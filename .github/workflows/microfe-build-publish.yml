name: MicroFE Build & Publish

"on":
  push:
    branches: [master]
    paths:
      - "platform/auth-service/**"
      - "platform/microfe/shell/**"
      - ".github/workflows/microfe-build-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: microfe-build-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a26af69be951a213d495a4c3e4e4022e16d87065 # v4
        with:
          node-version: "22"

      - name: Auth syntax and unit tests
        working-directory: platform/auth-service
        run: |
          npm install --omit=dev
          npm run check
          npm test

      - name: Login to GHCR
        uses: docker/login-action@184b5c8eafc5b4deba4ee1e2a0d6b98f0e34560b # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "auth=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/microfe-auth:$TAG" >> "$GITHUB_OUTPUT"
          echo "shell=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/microfe-shell:$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push auth
        uses: docker/build-push-action@cb8adf9a6f9f0c39c1e6f5a7d4f3b1d6c4e3a2b1 # v6
        with:
          context: .
          file: platform/auth-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.auth }}

      - name: Build and push shell
        uses: docker/build-push-action@cb8adf9a6f9f0c39c1e6f5a7d4f3b1d6c4e3a2b1 # v6
        with:
          context: .
          file: platform/microfe/shell/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.shell }}

      - name: Report immutable image references
        run: |
          echo "Auth image: ${{ steps.meta.outputs.auth }}"
          echo "Shell image: ${{ steps.meta.outputs.shell }}"
