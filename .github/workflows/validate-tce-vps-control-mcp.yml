name: Validate TCE VPS Control MCP

on:
  pull_request:
    paths:
      - "apps/tce-vps-control-mcp/**"
      - "scripts/validate-tce-vps-control-mcp.sh"
      - ".github/workflows/validate-tce-vps-control-mcp.yml"
  push:
    branches: [master]
    paths:
      - "apps/tce-vps-control-mcp/**"
      - "scripts/validate-tce-vps-control-mcp.sh"
      - ".github/workflows/validate-tce-vps-control-mcp.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"

      - name: Install exact committed lockfile dependencies
        working-directory: apps/tce-vps-control-mcp
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run security contract tests
        working-directory: apps/tce-vps-control-mcp
        run: npm test

      - name: Typecheck
        working-directory: apps/tce-vps-control-mcp
        run: npm run typecheck

      - name: Build
        working-directory: apps/tce-vps-control-mcp
        run: npm run build

      - name: Shell syntax and ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n apps/tce-vps-control-mcp/scripts/install.sh
          bash -n apps/tce-vps-control-mcp/ops/tce-mcp-docker
          shellcheck apps/tce-vps-control-mcp/scripts/install.sh apps/tce-vps-control-mcp/ops/tce-mcp-docker
