  deployment-lane-summary:
    name: Deployment lane summary / final gate
    needs:
      - reconcile
      - deploy-auth-service
      - deploy-microfe
      - deploy-tce-dashboard
      - deploy-keycloak
    if: ${{ always() && needs.reconcile.result == 'success' && needs.reconcile.outputs.mode == 'apply' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any targeted lane failed
        env:
          TARGET_APP: ${{ needs.reconcile.outputs.target_app }}
          AUTH_RESULT: ${{ needs.deploy-auth-service.result }}
          AUTH_HEALTH_STATE: ${{ needs.deploy-auth-service.outputs.health_state }}
          MICROFE_RESULT: ${{ needs.deploy-microfe.result }}
          MICROFE_HEALTH_STATE: ${{ needs.deploy-microfe.outputs.health_state }}
          TCE_RESULT: ${{ needs.deploy-tce-dashboard.result }}
          TCE_HEALTH_STATE: ${{ needs.deploy-tce-dashboard.outputs.health_state }}
          KEYCLOAK_RESULT: ${{ needs.deploy-keycloak.result }}
          KEYCLOAK_HEALTH_STATE: ${{ needs.deploy-keycloak.outputs.health_state }}
        run: |
          set -euo pipefail
          failed=0
          check_lane() {
            local app="$1" result="$2" health_state="$3"
            if [ "$TARGET_APP" = "all" ] || [ "$TARGET_APP" = "$app" ]; then
              if [ "$result" != "success" ]; then
                echo "::error::Deployment lane $app finished with result: $result"
                failed=1
              else
                case "$health_state" in
                  healthy)
                    echo "::notice::Deployment lane $app completed with live workload health verified."
                    ;;
                  maintenance)
                    echo "::notice::Deployment lane $app is in intentional zero-replica maintenance; no live workload health is asserted."
                    ;;
                  partial-maintenance)
                    echo "::notice::Deployment lane $app has live health verified for active scopes; zero-replica maintenance scopes are not asserted healthy."
                    ;;
                  *)
                    echo "::error::Deployment lane $app did not publish a valid machine-readable health state (state=${health_state:-missing})."
                    failed=1
                    ;;
                esac
              fi
            fi
          }
          check_lane auth-service "$AUTH_RESULT" "$AUTH_HEALTH_STATE"
          check_lane microfe "$MICROFE_RESULT" "$MICROFE_HEALTH_STATE"
          check_lane tce-dashboard "$TCE_RESULT" "$TCE_HEALTH_STATE"
          if [ "$TARGET_APP" = "keycloak" ]; then
            check_lane keycloak "$KEYCLOAK_RESULT" "$KEYCLOAK_HEALTH_STATE"
          fi
          [ "$failed" -eq 0 ] || exit 1
          echo "All targeted deployment lanes completed; health state for each lane is recorded above."
# yamllint enable rule:line-length

  notify-recovery-controller:
    name: Trigger inspection recovery after reconciliation
    needs:
      - reconcile
      - deployment-lane-summary
    if: ${{ always() && needs.reconcile.result == 'success' && needs.reconcile.outputs.mode == 'apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch recovery controller after all application lanes
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Invalid source reconciliation run id."
            exit 1
          }
          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid source reconciliation SHA."
            exit 1
          }
          current_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          started_at="$(jq -r '.run_started_at // .created_at // empty' <<< "$current_run")"
          [[ -n "$started_at" ]] || {
            echo "::error::Unable to resolve source reconciliation start time from Actions API."
            exit 1
          }
          gh workflow run recover-stale-ops.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f "source_run_id=$SOURCE_RUN_ID" \
            -f "source_head_sha=$SOURCE_HEAD_SHA"
          expected_display_title="Recover Stale Scheduled Ops — workflow_dispatch / source $SOURCE_RUN_ID"
          for attempt in $(seq 1 6); do
            runs="$(
              gh api -X GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/recover-stale-ops.yml/runs" \
                -F event=workflow_dispatch -F branch=master -F per_page=100
            )"
            dispatched_run="$(jq -c --arg started "$started_at" --arg source_run "$SOURCE_RUN_ID" '
              [.workflow_runs[] | select(
                .event == "workflow_dispatch"
                and .path == ".github/workflows/recover-stale-ops.yml"
                and .head_branch == "master"
                and .display_title == ("Recover Stale Scheduled Ops — workflow_dispatch / source " + $source_run)
                and .created_at >= $started
              )] | sort_by(.created_at) | last // empty
            ' <<< "$runs")"
            if [[ -n "$dispatched_run" ]]; then
              run_id="$(jq -r '.id' <<< "$dispatched_run")"
              run_url="$(jq -r '.html_url' <<< "$dispatched_run")"
              echo "Verified post-reconciliation recovery dispatch for source #$SOURCE_RUN_ID: #$run_id $run_url ($expected_display_title)"
              exit 0
            fi
            echo "Waiting for recovery controller dispatch correlation (attempt $attempt/6)."
            sleep 5
          done
          echo "::error::GitHub did not create a recovery-controller workflow_dispatch run for source reconciliation #$SOURCE_RUN_ID."
          exit 1
