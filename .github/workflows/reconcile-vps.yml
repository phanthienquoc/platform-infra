name: reconcile-vps

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Reconciliation mode"
        required: true
        default: apply
        type: choice
        options:
          - plan
          - apply
      allow_image_changes:
        description: "Allow deliberate workload image replacement during apply"
        required: false
        default: false
        type: boolean
      target_app:
        description: "Application scope for rollout verification"
        required: false
        default: all
        type: choice
        options:
          - all
          - tce-dashboard
          - stockdividend
  schedule:
    - cron: "0 * * * *"
  push:
    branches:
      - master
    paths:
      - "apps/**"
      - "environments/**"
  repository_dispatch:
    types:
      - gitops-release-ready

permissions:
  contents: read

concurrency:
  group: platform-vps-reconcile
  cancel-in-progress: false
  queue: max

env:
  RECONCILE_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'repository_dispatch') && 'apply' || inputs.mode }}
  TARGET_APP: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.app || inputs.target_app || 'all' }}
  RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release || '' }}
  ALLOW_IMAGE_CHANGES: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_image_changes == true && 'true' || 'false' }}
  TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}

jobs:
  reconcile:
    if: github.ref == 'refs/heads/master'
    environment: production
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify repository state
        run: |
          set -euo pipefail
          git status --short
          git rev-parse HEAD
          test -f environments/prod/kustomization.yaml
          chmod +x scripts/reconcile-vps.sh

      - name: Resolve deployment scope
        run: |
          set -euo pipefail
          case "$TARGET_APP" in
            all|tce-dashboard|stockdividend) ;;
            *) echo "::error::Unsupported deployment scope: $TARGET_APP"; exit 1 ;;
          esac
          echo "Deployment scope: $TARGET_APP"
          [ -z "$RELEASE_TAG" ] || echo "Release: $RELEASE_TAG"
      - name: Inspect diff prerequisites
        run: |
          set -euo pipefail
          command -v diff
          diff --version | head -n 1
          sudo /usr/local/sbin/platform-kubectl version

      - name: Validate TCE release pairing
        if: env.TARGET_APP == 'all' || env.TARGET_APP == 'tce-dashboard'
        run: |
          set -euo pipefail
          chmod +x scripts/verify-tce-gitops-release.sh
          ./scripts/verify-tce-gitops-release.sh

      - name: Preflight diff
        id: preflight
        run: |
          set -euo pipefail
          diff_stderr="$(mktemp)"
          trap 'rm -f "$diff_stderr"' EXIT
          set +e
          sudo /usr/local/sbin/platform-kubectl diff -k environments/prod 2>"$diff_stderr"
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "Kubernetes diff failed with exit code $rc" >&2
            echo "Diff stderr (diagnostic, no manifest diff is persisted):" >&2
            sed -n '1,120p' "$diff_stderr" >&2 || true
            echo "Diff prerequisites were verified immediately before this check." >&2
            exit "$rc"
          fi
          if [ "$rc" -eq 1 ]; then
            echo "Kubernetes drift detected; reconciliation will apply the repository state."
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "Kubernetes state matches the repository."
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard workload image changes
        if: env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' && env.ALLOW_IMAGE_CHANGES != 'true'
        run: |
          set -euo pipefail
          chmod +x scripts/guard-reconcile-images.sh
          ./scripts/guard-reconcile-images.sh check

      - name: Apply production manifests
        id: apply
        if: env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          ./scripts/reconcile-vps.sh apply

      - name: Notify Telegram — production processing
        if: env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub variable: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub variable: TELEGRAM_CHAT_ID"; exit 1; }
          TAG="$(grep -A1 'name: ghcr.io/phanthienquoc/tce-dashboard/web' apps/tce-dashboard/overlays/prod/kustomization.yaml | awk '/newTag:/ {print $2}')"
          test -n "$TAG" || TAG="unknown"
          MESSAGE="$(printf '%s\n%s\n%s\n%s\n%s' \
            "🔄 <b>PRODUCTION • PROCESSING</b>" \
            "🏷️ Release  <code>$TAG</code>" \
            "✓ GitOps synced" \
            "✓ VPS reconciliation" \
            "⏳ Rollout in progress")"
          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MESSAGE}" -d "parse_mode=HTML"

      - name: Verify cluster after reconciliation
        if: env.RECONCILE_MODE == 'apply'
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/platform-kubectl get nodes -o wide
          sudo /usr/local/sbin/platform-kubectl get pods -A -o wide

      - name: Verify TCE GitOps images
        id: verify_tce_images
        if: env.RECONCILE_MODE == 'apply' && (env.TARGET_APP == 'all' || env.TARGET_APP == 'tce-dashboard')
        continue-on-error: true
        run: |
          set -euo pipefail
          chmod +x scripts/verify-tce-gitops-images.sh
          ./scripts/verify-tce-gitops-images.sh

      - name: Verify stockdividend rollout
        id: verify_stock
        if: env.RECONCILE_MODE == 'apply' && (env.TARGET_APP == 'all' || env.TARGET_APP == 'stockdividend')
        continue-on-error: true
        run: |
          set -u
          rc=0
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/stock-backend -n stock-prod --timeout=180s || rc=1
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/stock-frontend -n stock-prod --timeout=180s || rc=1
          exit "$rc"

      - name: Verify TCE rollout
        id: verify_tce
        if: env.RECONCILE_MODE == 'apply' && (env.TARGET_APP == 'all' || env.TARGET_APP == 'tce-dashboard')
        continue-on-error: true
        run: |
          set -u
          rc=0
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/tce-service -n tce-prod --timeout=180s || rc=1
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/tce-frontend -n tce-prod --timeout=180s || rc=1
          exit "$rc"

      - name: Notify Telegram — production rollout summary
        if: ${{ !cancelled() && env.RECONCILE_MODE == 'apply' }}
        continue-on-error: true
        env:
          TCE_STATUS: ${{ steps.verify_tce.outcome }}
          TCE_IMAGES_STATUS: ${{ steps.verify_tce_images.outcome }}
          STOCK_STATUS: ${{ steps.verify_stock.outcome }}
          APPLY_STATUS: ${{ steps.apply.outcome }}
          DRIFT: ${{ steps.preflight.outputs.drift }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub variable: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub variable: TELEGRAM_CHAT_ID"; exit 1; }
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then TAG="$(grep -A1 'name: ghcr.io/phanthienquoc/tce-dashboard/web' apps/tce-dashboard/overlays/prod/kustomization.yaml | awk '/newTag:/ {print $2}')"; fi
          [ -n "$TAG" ] || TAG="GitOps sync"
          tce="NOT TARGETED"
          stock="NOT TARGETED"
          if [ "$TARGET_APP" = "all" ] || [ "$TARGET_APP" = "tce-dashboard" ]; then
            if [ "$TCE_STATUS" = "success" ] && [ "$TCE_IMAGES_STATUS" = "success" ]; then
              tce="SUCCESS"
            elif [ "$TCE_STATUS" = "failure" ] || [ "$TCE_IMAGES_STATUS" = "failure" ]; then
              tce="FAILED"
            else
              tce="NOT VERIFIED"
            fi
          fi
          if [ "$TARGET_APP" = "all" ] || [ "$TARGET_APP" = "stockdividend" ]; then
            if [ "$STOCK_STATUS" = "success" ]; then
              stock="SUCCESS"
            elif [ "$STOCK_STATUS" = "failure" ]; then
              stock="FAILED"
            else
              stock="NOT VERIFIED"
            fi
          fi

          icon_for_status() {
            case "$1" in
              SUCCESS) echo "🟢" ;;
              FAILED) echo "🔴" ;;
              NOT VERIFIED|NOT TARGETED) echo "⚪" ;;
              BLOCKED) echo "🟠" ;;
              *) echo "⚪" ;;
            esac
          }

          if [ "$DRIFT" = "false" ]; then
            status="NO CHANGES"
          elif [ "$APPLY_STATUS" != "success" ]; then
            status="RECONCILIATION FAILED"
            [ "$tce" = "FAILED" ] || [ "$tce" = "SUCCESS" ] || tce="BLOCKED"
            [ "$stock" = "FAILED" ] || [ "$stock" = "SUCCESS" ] || stock="BLOCKED"
          elif [[ "$tce" == "FAILED" && "$stock" == "FAILED" ]]; then
            status="FAILED"
          elif [[ "$tce" == "FAILED" || "$stock" == "FAILED" ]]; then
            status="PARTIAL"
          else
            status="SUCCESS"
          fi

          TCE_ICON="$(icon_for_status "$tce")"
          STOCK_ICON="$(icon_for_status "$stock")"
          MESSAGE="🚀 <b>PRODUCTION • ROLLOUT</b>\n🏷️ Release  <code>$TAG</code>\n🎯 Scope    <code>$TARGET_APP</code>\n${TCE_ICON} TCE           • $tce\n${STOCK_ICON} StockDividend • $stock\n🎯 Status: <b>$status</b>\n🔒 Failure isolation: enabled"
          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$MESSAGE" -d "parse_mode=HTML"
      - name: Verify drift cleared
        id: verify_drift
        if: ${{ !cancelled() && env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          diff_stderr="$(mktemp)"
          trap 'rm -f "$diff_stderr"' EXIT
          set +e
          sudo /usr/local/sbin/platform-kubectl diff -k environments/prod 2>"$diff_stderr"
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "Post-reconcile GitOps state is clean."
              ;;
            1)
              echo "Post-reconcile drift remains; refusing to report reconciliation as healthy." >&2
              ;;
            *)
              echo "Post-reconcile drift verification failed with exit code $rc." >&2
              echo "Diff stderr (diagnostic, no manifest diff is persisted):" >&2
              sed -n '1,120p' "$diff_stderr" >&2 || true
              ;;
          esac
          exit "$rc"

      - name: Fail if targeted deployment failed
        if: ${{ !cancelled() && env.RECONCILE_MODE == 'apply' }}
        env:
          APPLY_STATUS: ${{ steps.apply.outcome }}
          TCE_STATUS: ${{ steps.verify_tce.outcome }}
          TCE_IMAGES_STATUS: ${{ steps.verify_tce_images.outcome }}
          STOCK_STATUS: ${{ steps.verify_stock.outcome }}
          DRIFT_STATUS: ${{ steps.verify_drift.outcome }}
          DRIFT: ${{ steps.preflight.outputs.drift }}
        run: |
          set -euo pipefail
          if [ "$DRIFT" = "true" ]; then
            [ "$APPLY_STATUS" = "success" ] || { echo "Production manifest reconciliation failed." >&2; exit 1; }
            [ "$DRIFT_STATUS" = "success" ] || { echo "Post-reconcile GitOps drift verification failed." >&2; exit 1; }
          else
            echo "No manifest drift detected; apply was correctly skipped."
          fi
          if [ "$TARGET_APP" = "all" ] || [ "$TARGET_APP" = "tce-dashboard" ]; then
            if [ "$TCE_STATUS" != "success" ] || [ "$TCE_IMAGES_STATUS" != "success" ]; then echo "TCE deployment verification failed." >&2; exit 1; fi
          fi
          if [ "$TARGET_APP" = "all" ] || [ "$TARGET_APP" = "stockdividend" ]; then
            if [ "$STOCK_STATUS" != "success" ]; then echo "StockDividend deployment verification failed." >&2; exit 1; fi
          fi
          echo "Targeted production deployment verification passed."