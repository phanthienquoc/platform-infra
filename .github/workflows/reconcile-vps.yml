name: reconcile-vps

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: "Reconciliation mode"
        required: true
        default: apply
        type: choice
        options:
          - plan
          - apply
      allow_image_changes:
        description: "Allow deliberate workload image replacement during apply"
        required: false
        default: false
        type: boolean
      target_app:
        description: "Application scope for rollout verification"
        required: false
        default: all
        type: choice
        options:
          - all
          - tce-dashboard
          - stockdividend
          - media-generation
  push:
    branches:
      - master
    paths:
      - "apps/**"
      - "environments/**"
      - "platform/microfe/**"
      - "platform/auth-service/**"
      - "platform/cert-manager/**"
      - ".github/workflows/reconcile-vps.yml"
      - "scripts/reconcile-vps.sh"
      - "scripts/verify-workload-health.sh"
  repository_dispatch:
    types:
      - gitops-promoted-ready

permissions:
  contents: read
  packages: write

concurrency:
  group: platform-vps-reconcile
  cancel-in-progress: false

env:
  RECONCILE_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'repository_dispatch') && 'apply' || github.event.inputs.mode }}
  TARGET_APP: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.app || github.event.inputs.target_app || 'all' }}
  RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release || '' }}
  ALLOW_IMAGE_CHANGES: ${{ (github.event_name == 'repository_dispatch' && github.event.action == 'gitops-promoted-ready') || (github.event_name == 'workflow_dispatch' && github.event.inputs.allow_image_changes == 'true') }}
  TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}

jobs:
  reconcile:
    if: ${{ github.ref == 'refs/heads/master' }}
    environment: production
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build and promote MicroFE images on VPS runner
        id: publish_microfe
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.allow_image_changes) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            changed="platform/auth-service/manual-dispatch"
          else
            changed="$(git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" || true)"
          fi
          if ! printf '%s\n' "$changed" | grep -Eq '^platform/(microfe|auth-service)/'; then
            echo "No MicroFE source change in this pipeline; skipping image build."
            exit 0
          fi

          node --version
          npm --version
          (
            cd platform/auth-service
            npm install --omit=dev
            npm run check
            npm test
          )
          (
            cd platform/microfe/ws-gateway
            npm install --omit=dev
            npm run check
            npm test
          )

          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mkdir -p /tmp/microfe-build-meta
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="$GITHUB_SHA"

          build_image() {
            local image="$1"
            local dockerfile="$2"
            local context="$3"
            local meta="$4"
            docker buildx build --platform linux/arm64 --provenance=true --sbom=true --metadata-file "$meta" --push --tag "$image:$tag" --file "$dockerfile" "$context"
            python3 - "$meta" "$image" <<'PY'
import json, pathlib, sys
meta, image = sys.argv[1:]
digest = json.loads(pathlib.Path(meta).read_text()).get("containerimage.digest")
if not isinstance(digest, str) or not digest.startswith("sha256:"):
    raise SystemExit(f"Missing digest for {image}")
print(digest)
PY
          }

          auth_digest="$(build_image ghcr.io/$owner/microfe-auth platform/auth-service/Dockerfile . /tmp/microfe-build-meta/auth.json | tail -n1)"
          shell_digest="$(build_image ghcr.io/$owner/microfe-shell platform/microfe/shell/Dockerfile . /tmp/microfe-build-meta/shell.json | tail -n1)"
          ws_digest="$(build_image ghcr.io/$owner/microfe-ws platform/microfe/ws-gateway/Dockerfile platform/microfe/ws-gateway /tmp/microfe-build-meta/ws.json | tail -n1)"

          for digest in "$auth_digest" "$shell_digest" "$ws_digest"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          done

          cat >> environments/prod/kustomization.yaml <<EOF

          images:
          - name: ghcr.io/phanthienquoc/microfe-auth
            newName: ghcr.io/phanthienquoc/microfe-auth
            digest: $auth_digest
          - name: ghcr.io/phanthienquoc/microfe-shell
            newName: ghcr.io/phanthienquoc/microfe-shell
            digest: $shell_digest
          - name: ghcr.io/phanthienquoc/microfe-ws
            newName: ghcr.io/phanthienquoc/microfe-ws
            digest: $ws_digest
          EOF

          echo "MicroFE immutable image promotion prepared for this reconciliation."
      - name: Verify repository state
        run: |
          set -euo pipefail
          git status --short
          git rev-parse HEAD
          test -f environments/prod/kustomization.yaml
          chmod +x scripts/reconcile-vps.sh

      - name: Resolve deployment scope
        run: |
          set -euo pipefail
          case "$TARGET_APP" in
            all|tce-dashboard|stockdividend|media-generation) ;;
            *) echo "::error::Unsupported deployment scope: $TARGET_APP"; exit 1 ;;
          esac
          echo "Deployment scope: $TARGET_APP"
          [ -z "$RELEASE_TAG" ] || echo "Release: $RELEASE_TAG"

      - name: Inspect diff prerequisites
        run: |
          set -euo pipefail
          command -v diff
          diff --version | head -n 1
          sudo /usr/local/sbin/platform-kubectl version

      - name: Validate TCE release pairing
        if: ${{ env.TARGET_APP == 'all' || env.TARGET_APP == 'tce-dashboard' }}
        run: |
          set -euo pipefail
          chmod +x scripts/verify-tce-gitops-release.sh
          ./scripts/verify-tce-gitops-release.sh

      - name: Resolve media release tag
        if: ${{ env.TARGET_APP == 'media-generation' || env.TARGET_APP == 'all' }}
        run: |
          set -euo pipefail
          MEDIA_BACKEND_TAG="$(grep -A1 'name: ghcr.io/phanthienquoc/media-generation/backend' apps/media-generation/overlays/prod/kustomization.yaml | awk '/newTag:/ {print $2}')"
          MEDIA_FRONTEND_TAG="$(grep -A1 'name: ghcr.io/phanthienquoc/media-generation/frontend' apps/media-generation/overlays/prod/kustomization.yaml | awk '/newTag:/ {print $2}')"
          test -n "$MEDIA_BACKEND_TAG" || { echo "Unable to resolve media-generation backend image tag"; exit 1; }
          test -n "$MEDIA_FRONTEND_TAG" || { echo "Unable to resolve media-generation frontend image tag"; exit 1; }
          test "$MEDIA_BACKEND_TAG" = "$MEDIA_FRONTEND_TAG" || { echo "Media backend/frontend tags must be paired"; exit 1; }
          echo "MEDIA_BACKEND_TAG=$MEDIA_BACKEND_TAG" >> "$GITHUB_ENV"
          echo "MEDIA_FRONTEND_TAG=$MEDIA_FRONTEND_TAG" >> "$GITHUB_ENV"
          echo "MEDIA_TAG=$MEDIA_BACKEND_TAG" >> "$GITHUB_ENV"

      - name: Preflight diff
        id: preflight
        run: |
          set -euo pipefail
          chmod +x scripts/reconcile-vps.sh
          set +e
          ./scripts/reconcile-vps.sh plan
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "Kubernetes diff failed with exit code $rc" >&2
            echo "Diff prerequisites were verified immediately before this check." >&2
            exit "$rc"
          fi
          if [ "$rc" -eq 1 ]; then
            echo "Kubernetes drift detected; reconciliation will apply the repository state."
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "Kubernetes state matches the repository."
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard workload image changes
        if: ${{ env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' && env.ALLOW_IMAGE_CHANGES != 'true' && steps.publish_microfe.outcome != 'success' }}
        run: |
          set -euo pipefail
          chmod +x scripts/guard-reconcile-images.sh
          ./scripts/guard-reconcile-images.sh check

      - name: Apply production manifests
        id: apply
        if: ${{ env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          ./scripts/reconcile-vps.sh apply

      - name: Notify Telegram — production processing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        if: ${{ env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub variable: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub variable: TELEGRAM_CHAT_ID"; exit 1; }

          if [ "$TARGET_APP" = "media-generation" ]; then
            TAG="${RELEASE_TAG:-${MEDIA_TAG:-unknown}}"
          else
            TAG="$(grep -A1 'name: ghcr.io/phanthienquoc/tce-dashboard/web' apps/tce-dashboard/overlays/prod/kustomization.yaml | awk '/newTag:/ {print $2}')"
          fi
          test -n "$TAG" || TAG="unknown"

          # Keep this template identical in structure to the rollout summary.
          # Do not replace, collapse, or rewrite template fields dynamically.
          printf -v MESSAGE '%s\n' \
            "<pre>🔄 PRODUCTION • PROCESSING" \
            "" \
            "📦 App             $TARGET_APP" \
            "🏷️ Release         $TAG" \
            "" \
            "✓ GitOps synced" \
            "✓ VPS reconciliation" \
            "⏳ Rollout in progress</pre>"

          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MESSAGE}" -d "parse_mode=HTML"

      - name: Publish TCE deployment started event
        if: ${{ env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' && (env.TARGET_APP == 'all' || env.TARGET_APP == 'tce-dashboard') }}
        continue-on-error: true
        run: |
          set -euo pipefail
          chmod +x scripts/publish-microfe-deployment-event.sh
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG="$(grep -A1 'name: ghcr.io/phanthienquoc/tce-dashboard/web' apps/tce-dashboard/overlays/prod/kustomization.yaml | awk '/newTag:/ {print $2}')"
          fi
          ./scripts/publish-microfe-deployment-event.sh deploying tce-dashboard "$TAG" deploying

      - name: Verify cluster after reconciliation
        if: ${{ env.RECONCILE_MODE == 'apply' }}
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/platform-kubectl get nodes -o wide
          sudo /usr/local/sbin/platform-kubectl get pods -A -o wide

      - name: Verify Auth HTTPS
        if: ${{ env.RECONCILE_MODE == 'apply' }}
        run: |
          set -euo pipefail
          tls_output="$(printf '' | openssl s_client -connect auth.mrcute.space:443 -servername auth.mrcute.space -verify_return_error 2>&1 || true)"
          printf '%s\n' "$tls_output" | grep -q "Verify return code: 0 (ok)"
          printf '%s\n' "$tls_output" | grep -Eq "subject=.*CN|subject=.*auth.mrcute.space|DNS:auth.mrcute.space"
          echo "Auth TLS certificate chain and SNI verified for auth.mrcute.space."

      - name: Verify TCE GitOps images
        id: verify_tce_images
        if: ${{ env.RECONCILE_MODE == 'apply' && (env.TARGET_APP == 'all' || env.TARGET_APP == 'tce-dashboard') }}
        continue-on-error: true
        run: |
          set -euo pipefail
          chmod +x scripts/verify-tce-gitops-images.sh
          ./scripts/verify-tce-gitops-images.sh

      - name: Verify stockdividend rollout
        id: verify_stock
        if: ${{ env.RECONCILE_MODE == 'apply' && (env.TARGET_APP == 'all' || env.TARGET_APP == 'stockdividend') }}
        continue-on-error: true
        run: |
          set -u
          rc=0
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/stock-backend -n stock-prod --timeout=180s || rc=1
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/stock-frontend -n stock-prod --timeout=180s || rc=1
          exit "$rc"

      - name: Verify TCE rollout
        id: verify_tce
        if: ${{ env.RECONCILE_MODE == 'apply' && (env.TARGET_APP == 'all' || env.TARGET_APP == 'tce-dashboard') }}
        continue-on-error: true
        run: |
          set -u
          rc=0
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/tce-service -n tce-prod --timeout=180s || rc=1
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/tce-frontend -n tce-prod --timeout=180s || rc=1
          exit "$rc"

      - name: Verify media-generation rollout
        id: verify_media
        if: ${{ env.RECONCILE_MODE == 'apply' && (env.TARGET_APP == 'all' || env.TARGET_APP == 'media-generation') }}
        continue-on-error: true
        run: |
          set -u
          rc=0
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/media-generation -n media-prod --timeout=180s || rc=1
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/media-generation-frontend -n media-prod --timeout=180s || rc=1
          sudo /usr/local/sbin/platform-kubectl get deployments -n media-prod -o wide
          exit "$rc"

      - name: Verify targeted workload health
        if: ${{ env.RECONCILE_MODE == 'apply' }}
        run: |
          set -euo pipefail
          chmod +x scripts/verify-workload-health.sh
          ./scripts/verify-workload-health.sh

      - name: Notify Telegram — production rollout summary
        if: ${{ !cancelled() && env.RECONCILE_MODE == 'apply' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TCE_STATUS: ${{ steps.verify_tce.outcome }}
          TCE_IMAGES_STATUS: ${{ steps.verify_tce_images.outcome }}
          STOCK_STATUS: ${{ steps.verify_stock.outcome }}
          MEDIA_STATUS: ${{ steps.verify_media.outcome }}
          APPLY_STATUS: ${{ steps.apply.outcome }}
          DRIFT: ${{ steps.preflight.outputs.drift }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub variable: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub variable: TELEGRAM_CHAT_ID"; exit 1; }
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ] && [ "$TARGET_APP" = "media-generation" ]; then TAG="${MEDIA_TAG:-}"; fi
          if [ -z "$TAG" ]; then TAG="$(grep -A1 'name: ghcr.io/phanthienquoc/tce-dashboard/web' apps/tce-dashboard/overlays/prod/kustomization.yaml | awk '/newTag:/ {print $2}')"; fi
          [ -n "$TAG" ] || TAG="GitOps sync"
          tce="NOT TARGETED"
          stock="NOT TARGETED"
          media="NOT TARGETED"
          if [ "$TARGET_APP" = "all" ] || [ "$TARGET_APP" = "tce-dashboard" ]; then
            if [ "$TCE_STATUS" = "success" ] && [ "$TCE_IMAGES_STATUS" = "success" ]; then
              tce="SUCCESS"
            elif [ "$TCE_STATUS" = "failure" ] || [ "$TCE_IMAGES_STATUS" = "failure" ]; then
              tce="FAILED"
            else
              tce="NOT VERIFIED"
            fi
          fi
          if [ "$TARGET_APP" = "all" ] || [ "$TARGET_APP" = "stockdividend" ]; then
            if [ "$STOCK_STATUS" = "success" ]; then
              stock="SUCCESS"
            elif [ "$STOCK_STATUS" = "failure" ]; then
              stock="FAILED"
            else
              stock="NOT VERIFIED"
            fi
          fi
          if [ "$TARGET_APP" = "all" ] || [ "$TARGET_APP" = "media-generation" ]; then
            if [ "$MEDIA_STATUS" = "success" ]; then
              media="SUCCESS"
            elif [ "$MEDIA_STATUS" = "failure" ]; then
              media="FAILED"
            else
              media="NOT VERIFIED"
            fi
          fi

          icon_for_status() {
            case "$1" in
              SUCCESS) echo "🟢" ;;
              FAILED|"RECONCILIATION FAILED") echo "🔴" ;;
              PARTIAL|BLOCKED|"NOT VERIFIED") echo "🟡" ;;
              PROCESSING) echo "🟣" ;;
              "NOT TARGETED") echo "⚪" ;;
              "NO CHANGES") echo "🟢" ;;
              *) echo "🟡" ;;
            esac
          }

          if [ "$DRIFT" = "false" ]; then
            status="NO CHANGES"
          elif [ "$APPLY_STATUS" != "success" ]; then
            status="RECONCILIATION FAILED"
            [ "$tce" = "FAILED" ] || [ "$tce" = "SUCCESS" ] || tce="BLOCKED"
            [ "$stock" = "FAILED" ] || [ "$stock" = "SUCCESS" ] || stock="BLOCKED"
          elif [[ "$tce" == "FAILED" && "$stock" == "FAILED" && "$media" == "FAILED" ]]; then
            status="FAILED"
          elif [[ "$tce" == "FAILED" || "$stock" == "FAILED" || "$media" == "FAILED" ]]; then
            status="PARTIAL"
          elif [[ "$tce" == "NOT VERIFIED" || "$stock" == "NOT VERIFIED" || "$media" == "NOT VERIFIED" ]]; then
            status="RECONCILIATION FAILED"
          else
            status="SUCCESS"
          fi

          TCE_ICON="$(icon_for_status "$tce")"
          STOCK_ICON="$(icon_for_status "$stock")"
          MEDIA_ICON="$(icon_for_status "$media")"
          STATUS_ICON="$(icon_for_status "$status")"
          printf -v MESSAGE '%s\n' \
            "<pre>${STATUS_ICON} PRODUCTION • ROLLOUT" \
            "" \
            "🏷️ Release         $TAG" \
            "🎯 Scope           $TARGET_APP" \
            "" \
            "${TCE_ICON} TCE             $tce" \
            "${STOCK_ICON} StockDividend   $stock" \
            "${MEDIA_ICON} Media           $media" \
            "" \
            "🎯 Status          $status" \
            "🔒 Isolation       ENABLED</pre>"
          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$MESSAGE" -d "parse_mode=HTML"

      - name: Notify Telegram — reconciliation resolved
        if: ${{ !cancelled() && env.RECONCILE_MODE == 'apply' && steps.apply.outcome == 'success' && (steps.verify_media.outcome == 'success' || steps.verify_tce.outcome == 'success' || steps.verify_stock.outcome == 'success') }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub variable: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub variable: TELEGRAM_CHAT_ID"; exit 1; }
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ] && [ "$TARGET_APP" = "media-generation" ]; then TAG="${MEDIA_TAG:-}"; fi
          if [ -z "$TAG" ]; then TAG="$(grep -A1 'name: ghcr.io/phanthienquoc/tce-dashboard/web' apps/tce-dashboard/overlays/prod/kustomization.yaml | awk '/newTag:/ {print $2}')"; fi
          [ -n "$TAG" ] || TAG="unknown"
          NOW="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          printf -v MESSAGE '%s\n' \
            "<pre>🟢 PRODUCTION • RESOLVED" \
            "" \
            "📦 App             $TARGET_APP" \
            "🏷️ Release         $TAG" \
            "🔁 Run             #${GITHUB_RUN_NUMBER} (${GITHUB_RUN_ID})" \
            "🕐 Time            $NOW" \
            "" \
            "✓ Reconciliation succeeded" \
            "✓ Rollout verified" \
            "✓ Health verified" \
            "" \
            "↩️ This result supersedes prior failed attempts for this release." \
            "🔒 Isolation       ENABLED</pre>"
          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MESSAGE}" -d "parse_mode=HTML"
      - name: Publish TCE deployment result event
        if: ${{ !cancelled() && env.RECONCILE_MODE == 'apply' && (env.TARGET_APP == 'all' || env.TARGET_APP == 'tce-dashboard') }}
        continue-on-error: true
        env:
          TCE_STATUS: ${{ steps.verify_tce.outcome }}
          TCE_IMAGES_STATUS: ${{ steps.verify_tce_images.outcome }}
        run: |
          set -euo pipefail
          chmod +x scripts/publish-microfe-deployment-event.sh
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG="$(grep -A1 'name: ghcr.io/phanthienquoc/tce-dashboard/web' apps/tce-dashboard/overlays/prod/kustomization.yaml | awk '/newTag:/ {print $2}')"
          fi
          if [ "$TCE_STATUS" = "success" ] && [ "$TCE_IMAGES_STATUS" = "success" ]; then
            EVENT=deployed
            STATUS=success
          else
            EVENT=failed
            STATUS=failed
          fi
          ./scripts/publish-microfe-deployment-event.sh "$EVENT" tce-dashboard "$TAG" "$STATUS"

      - name: Verify drift cleared
        id: verify_drift
        if: ${{ !cancelled() && env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          diff_stderr="$(mktemp)"
          trap 'rm -f "$diff_stderr"' EXIT
          set +e
          sudo /usr/local/sbin/platform-kubectl diff -k environments/prod 2>"$diff_stderr"
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "Post-reconcile GitOps state is clean."
              ;;
            1)
              echo "Post-reconcile drift remains; refusing to report reconciliation as healthy." >&2
              ;;
            *)
              echo "Post-reconcile drift verification failed with exit code $rc." >&2
              echo "Diff stderr (diagnostic, no manifest diff is persisted):" >&2
              sed -n '1,120p' "$diff_stderr" >&2 || true
              ;;
          esac
          exit "$rc"

      - name: Fail if targeted deployment failed
        if: ${{ !cancelled() && env.RECONCILE_MODE == 'apply' }}
        env:
          APPLY_STATUS: ${{ steps.apply.outcome }}
          TCE_STATUS: ${{ steps.verify_tce.outcome }}
          TCE_IMAGES_STATUS: ${{ steps.verify_tce_images.outcome }}
          STOCK_STATUS: ${{ steps.verify_stock.outcome }}
          MEDIA_STATUS: ${{ steps.verify_media.outcome }}
          DRIFT_STATUS: ${{ steps.verify_drift.outcome }}
          DRIFT: ${{ steps.preflight.outputs.drift }}
        run: |
          set -euo pipefail
          if [ "$DRIFT" = "true" ]; then
            [ "$APPLY_STATUS" = "success" ] || { echo "Production manifest reconciliation failed." >&2; exit 1; }
            [ "$DRIFT_STATUS" = "success" ] || { echo "Post-reconcile GitOps drift verification failed." >&2; exit 1; }
          else
            echo "No manifest drift detected; apply was correctly skipped."
          fi
          if [ "$TARGET_APP" = "all" ] || [ "$TARGET_APP" = "tce-dashboard" ]; then
            if [ "$TCE_STATUS" != "success" ] || [ "$TCE_IMAGES_STATUS" != "success" ]; then echo "TCE deployment verification failed." >&2; exit 1; fi
          fi
          if [ "$TARGET_APP" = "all" ] || [ "$TARGET_APP" = "stockdividend" ]; then
            if [ "$STOCK_STATUS" != "success" ]; then echo "StockDividend deployment verification failed." >&2; exit 1; fi
          fi
          if [ "$TARGET_APP" = "all" ] || [ "$TARGET_APP" = "media-generation" ]; then
            if [ "$MEDIA_STATUS" != "success" ]; then echo "Media generation deployment verification failed." >&2; exit 1; fi
          fi
          echo "Targeted production deployment verification passed."
