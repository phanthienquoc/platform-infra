  deployment-lane-summary:
    name: Deployment lane summary / final gate
    needs:
      - reconcile
      - deploy-auth-service
      - deploy-microfe
      - deploy-tce-dashboard
      - deploy-stockdividend
      - deploy-media-generation
      - deploy-keycloak
    if: ${{ always() && needs.reconcile.result == 'success' && needs.reconcile.outputs.mode == 'apply' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any targeted lane failed
        env:
          TARGET_APP: ${{ needs.reconcile.outputs.target_app }}
          AUTH_RESULT: ${{ needs.deploy-auth-service.result }}
          MICROFE_RESULT: ${{ needs.deploy-microfe.result }}
          TCE_RESULT: ${{ needs.deploy-tce-dashboard.result }}
          STOCK_RESULT: ${{ needs.deploy-stockdividend.result }}
          MEDIA_RESULT: ${{ needs.deploy-media-generation.result }}
          KEYCLOAK_RESULT: ${{ needs.deploy-keycloak.result }}
        run: |
          set -euo pipefail
          failed=0
          check_lane() {
            local app="$1" result="$2"
            if [ "$TARGET_APP" = "all" ] || [ "$TARGET_APP" = "$app" ]; then
              if [ "$result" != "success" ]; then
                echo "::error::Deployment lane $app finished with result: $result"
                failed=1
              else
                echo "Deployment lane $app succeeded."
              fi
            fi
          }
          check_lane auth-service "$AUTH_RESULT"
          check_lane microfe "$MICROFE_RESULT"
          check_lane tce-dashboard "$TCE_RESULT"
          check_lane stockdividend "$STOCK_RESULT"
          check_lane media-generation "$MEDIA_RESULT"
          if [ "$TARGET_APP" = "keycloak" ]; then
            if [ "$KEYCLOAK_RESULT" != "success" ]; then
              echo "::error::Deployment lane keycloak finished with result: $KEYCLOAK_RESULT"
              failed=1
            else
              echo "Deployment lane keycloak succeeded."
            fi
          fi
          [ "$failed" -eq 0 ] || exit 1
          echo "All targeted deployment lanes passed."
