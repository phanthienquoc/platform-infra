# yamllint disable rule:line-length
name: reconcile-vps
run-name: Reconcile VPS — ${{ github.event.client_payload.app || inputs.target_app || (github.event_name == 'push' && contains(join(github.event.head_commit.modified, ','), 'platform/keycloak/') && 'keycloak-manifest') || 'all' }} / ${{ github.event.client_payload.release || inputs.mode || github.event_name }}

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: "Reconciliation mode"
        required: true
        default: apply
        type: choice
        options:
          - plan
          - apply
      allow_image_changes:
        description: "Allow deliberate workload image replacement during apply"
        required: false
        default: false
        type: boolean
      target_app:
        description: "Application scope for rollout verification"
        required: false
        default: all
        type: choice
        options:
          - all
          - auth-service
          - tce-dashboard
          - stockdividend
          - media-generation
          - microfe
          - keycloak
          - auth-shutdown
  repository_dispatch:
    types:
      - gitops-promoted-ready
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [master]
    paths:
      # Reconcile whenever any resource referenced by environments/prod changes.
      - apps/**
      - environments/prod/**
      - platform/auth-service/**
      - platform/cert-manager/**
      - platform/k3s-debug-logs/**
      - platform/microfe/**
      - platform/keycloak/**
      - scripts/reconcile-vps.sh
      - scripts/guard-reconcile-images.sh
      - scripts/validate-ghcr-pull-access.sh
      - scripts/verify-workload-health.sh

permissions:
  contents: read
  packages: write

concurrency:
  group: platform-vps-reconcile
  cancel-in-progress: false

env:
  RECONCILE_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'repository_dispatch') && 'apply' || github.event.inputs.mode }}
  TARGET_APP: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.app || github.event.inputs.target_app || 'all' }}
  RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release || '' }}
  ALLOW_IMAGE_CHANGES: ${{ (github.event_name == 'repository_dispatch' && github.event.action == 'gitops-promoted-ready') || (github.event_name == 'workflow_dispatch' && github.event.inputs.allow_image_changes == 'true') }}
  TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}

jobs:
  reconcile:
    if: ${{ github.ref == 'refs/heads/master' }}
    environment: production
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    timeout-minutes: 20
    outputs:
      target_app: ${{ steps.scope.outputs.target_app }}
      mode: ${{ steps.scope.outputs.mode }}
      drift: ${{ steps.preflight.outputs.drift }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify repository state
        run: |
          set -euo pipefail
          git status --short
          git rev-parse HEAD
          test -f environments/prod/kustomization.yaml
          chmod +x scripts/reconcile-vps.sh

      - name: Resolve Keycloak push scope
        if: ${{ github.event_name == 'push' && contains(join(github.event.head_commit.modified, ','), 'platform/keycloak/') }}
        run: |
          set -euo pipefail
          replicas="$(awk '
            $0 == "spec:" { in_spec = 1; next }
            in_spec && /^[^[:space:]]/ { in_spec = 0 }
            in_spec && /^  replicas:/ { print $2; exit }
          ' platform/keycloak/deployment.yaml)"
          case "$replicas" in
            0)
              echo "TARGET_APP=auth-shutdown" >> "$GITHUB_ENV"
              echo "Keycloak manifest declares replicas: 0; selecting isolated Auth/Keycloak shutdown."
              ;;
            1)
              echo "TARGET_APP=keycloak" >> "$GITHUB_ENV"
              echo "Keycloak manifest declares replicas: 1; selecting the dedicated Keycloak rollout."
              ;;
            *)
              echo "::error::Keycloak push requires replicas 0 or 1, got ${replicas:-missing}"
              exit 1
              ;;
          esac

      - name: Resolve deployment scope
        id: scope
        run: |
          set -euo pipefail
          case "$TARGET_APP" in
            all|auth-service|tce-dashboard|stockdividend|media-generation|microfe|keycloak|auth-shutdown) ;;
            *) echo "::error::Unsupported deployment scope: $TARGET_APP"; exit 1 ;;
          esac
          echo "Deployment scope: $TARGET_APP"
          echo "target_app=$TARGET_APP" >> "$GITHUB_OUTPUT"
          echo "mode=$RECONCILE_MODE" >> "$GITHUB_OUTPUT"
          [ -z "$RELEASE_TAG" ] || echo "Release: $RELEASE_TAG"

      - name: Inspect diff prerequisites
        run: |
          set -euo pipefail
          command -v diff
          diff --version | head -n 1
          sudo /usr/local/sbin/platform-kubectl version

      - name: Wait for runner reconciliation policy
        if: ${{ env.RECONCILE_MODE == 'apply' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if policy="$(sudo /usr/local/sbin/platform-kubectl policy-version 2>/dev/null)"; then
              if [ "$TARGET_APP" = "auth-shutdown" ]; then
                [[ "$policy" == "platform-kubectl policy: rollout-status-v11-auth-shutdown" ]] && {
                  echo "Auth shutdown runner allowlist is ready."
                  exit 0
                }
              elif [ "$TARGET_APP" = "keycloak" ]; then
                [[ "$policy" == "platform-kubectl policy: rollout-status-v10-keycloak-secret-provision" || "$policy" == "platform-kubectl policy: rollout-status-v11-auth-shutdown" ]] && {
                  echo "Keycloak runner allowlist is ready."
                  exit 0
                }
              elif [[ "$policy" == "platform-kubectl policy: rollout-status-v9-auth-secret-provision" || "$policy" == "platform-kubectl policy: rollout-status-v10-keycloak-secret-provision" || "$policy" == "platform-kubectl policy: rollout-status-v11-auth-shutdown" ]]; then
                echo "Runner reconciliation policy is ready."
                exit 0
              fi
            fi
            echo "Waiting for runner bootstrap policy (attempt $attempt/24)..."
            sleep 5
          done
          echo "Runner reconciliation policy did not become ready within 120s." >&2
          exit 1
      - name: Validate GHCR pull access before mutating cluster credentials
        if: ${{ env.RECONCILE_MODE == 'apply' && steps.scope.outputs.target_app != 'keycloak' && steps.scope.outputs.target_app != 'auth-shutdown' }}
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/validate-ghcr-pull-access.sh
          # The Kubernetes pull Secret is shared across production namespaces. A targeted
          # rollout must not rotate it unless every currently referenced GHCR package is readable.
          TARGET_APP=all GHCR_USERNAME="$GHCR_USERNAME" GHCR_TOKEN="$GHCR_TOKEN" ./scripts/validate-ghcr-pull-access.sh

      - name: Provision Auth runtime Secret from platform-infra Environment
        if: ${{ env.RECONCILE_MODE == 'apply' && (steps.scope.outputs.target_app == 'auth-service' || steps.scope.outputs.target_app == 'all') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY JWT_SECRET MFA_ENCRYPTION_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required production Environment Secret: $name"
              exit 1
            fi
          done
          printf '%s\n%s\n%s\n%s\n' \
            "$SUPABASE_URL" \
            "$SUPABASE_SERVICE_ROLE_KEY" \
            "$JWT_SECRET" \
            "$MFA_ENCRYPTION_KEY" |
            sudo /usr/local/sbin/platform-kubectl provision-auth-secret
          unset SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY JWT_SECRET MFA_ENCRYPTION_KEY
          sudo /usr/local/sbin/platform-kubectl verify-auth-secret

      - name: Bootstrap GHCR pull credentials
        if: ${{ env.RECONCILE_MODE == 'apply' && steps.scope.outputs.target_app != 'keycloak' && steps.scope.outputs.target_app != 'auth-shutdown' }}
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GHCR_USERNAME" || -z "$GHCR_TOKEN" ]]; then
            echo "::error::Configure GHCR_READ_TOKEN with read:packages access to all private production images."
            exit 1
          fi
          printf "%s\n%s\n" "$GHCR_USERNAME" "$GHCR_TOKEN" |
            sudo /usr/local/sbin/platform-kubectl reconcile-ghcr-pull
          echo "GHCR pull credentials reconciled across production GHCR namespaces."
      - name: Restart workloads blocked on image pulls
        if: ${{ env.RECONCILE_MODE == 'apply' && steps.scope.outputs.target_app != 'keycloak' && steps.scope.outputs.target_app != 'auth-shutdown' }}
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/platform-kubectl restart-blocked-image-pulls
      - name: Validate TCE release pairing
        if: ${{ steps.scope.outputs.target_app != 'keycloak' && (steps.scope.outputs.target_app == 'all' || steps.scope.outputs.target_app == 'tce-dashboard') }}
        run: |
          set -euo pipefail
          chmod +x scripts/verify-tce-gitops-release.sh
          ./scripts/verify-tce-gitops-release.sh

      - name: Resolve media release tag
        if: ${{ steps.scope.outputs.target_app != 'keycloak' && (steps.scope.outputs.target_app == 'media-generation' || steps.scope.outputs.target_app == 'all') }}
        run: |
          set -euo pipefail
          MEDIA_BACKEND_TAG="$(grep -A1 'name: ghcr.io/phanthienquoc/media-generation/backend' apps/media-generation/overlays/prod/kustomization.yaml | awk '/newTag:/ {print $2}')"
          MEDIA_FRONTEND_TAG="$(grep -A1 'name: ghcr.io/phanthienquoc/media-generation/frontend' apps/media-generation/overlays/prod/kustomization.yaml | awk '/newTag:/ {print $2}')"
          test -n "$MEDIA_BACKEND_TAG" || { echo "Unable to resolve media-generation backend image tag"; exit 1; }
          test -n "$MEDIA_FRONTEND_TAG" || { echo "Unable to resolve media-generation frontend image tag"; exit 1; }
          test "$MEDIA_BACKEND_TAG" = "$MEDIA_FRONTEND_TAG" || { echo "Media backend/frontend tags must be paired"; exit 1; }
           {
             echo "MEDIA_BACKEND_TAG=$MEDIA_BACKEND_TAG"
             echo "MEDIA_FRONTEND_TAG=$MEDIA_FRONTEND_TAG"
             echo "MEDIA_TAG=$MEDIA_BACKEND_TAG"
           } >> "$GITHUB_ENV"

      - name: Apply Auth and Keycloak shutdown only
        if: ${{ env.RECONCILE_MODE == 'apply' && steps.scope.outputs.target_app == 'auth-shutdown' }}
        run: |
          set -euo pipefail
          # Apply only the dedicated Keycloak resource set, then stop Auth and Keycloak.
          sudo /usr/local/sbin/platform-kubectl apply -k platform/keycloak
          sudo /usr/local/sbin/platform-kubectl scale deployment/microfe-auth deployment/keycloak --replicas=0 -n microfe-platform

      - name: Verify Auth and Keycloak shutdown state
        if: ${{ env.RECONCILE_MODE == 'apply' && steps.scope.outputs.target_app == 'auth-shutdown' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            all_zero=true
            for deployment in microfe-auth keycloak; do
              state="$(sudo /usr/local/sbin/platform-kubectl get deployment "$deployment" -n microfe-platform -o 'jsonpath={.spec.replicas} {.status.readyReplicas} {.status.updatedReplicas}')"
              read -r desired ready updated <<< "$state"
              if [[ "$desired" != "0" || "${ready:-0}" != "0" || "${updated:-0}" != "0" ]]; then
                all_zero=false
                echo "$deployment has not converged to desired/ready/updated=0: $state"
              fi
            done
            auth_pods="$(sudo /usr/local/sbin/platform-kubectl get pods -n microfe-platform -l app=microfe-auth -o name)"
            keycloak_pods="$(sudo /usr/local/sbin/platform-kubectl get pods -n microfe-platform -l app.kubernetes.io/name=keycloak -o name)"
            if [[ "$all_zero" == true && -z "$auth_pods" && -z "$keycloak_pods" ]]; then
              echo "Auth and Keycloak are scaled to zero with no matching pods remaining."
              exit 0
            fi
            [[ -z "$auth_pods" ]] || printf 'Remaining Auth pods:\n%s\n' "$auth_pods"
            [[ -z "$keycloak_pods" ]] || printf 'Remaining Keycloak pods:\n%s\n' "$keycloak_pods"
            echo "Waiting for Auth/Keycloak shutdown convergence (attempt $attempt/24)..."
            sleep 5
          done
          echo "::error::Auth/Keycloak shutdown did not converge to zero replicas and no matching pods within 120 seconds."
          exit 1

      - name: Preflight diff
        id: preflight
        run: |
          set -euo pipefail
          if [ "$TARGET_APP" = "auth-shutdown" ]; then
            echo "Auth shutdown is a narrow scale-to-zero maintenance operation; no shared GitOps apply is permitted."
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TARGET_APP" = "keycloak" ]; then
            echo "Keycloak has a separate allowlisted reconcile path; shared environments/prod manifests remain untouched."
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x scripts/reconcile-vps.sh
          set +e
          ./scripts/reconcile-vps.sh plan
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "Kubernetes diff failed with exit code $rc" >&2
            echo "Diff prerequisites were verified immediately before this check." >&2
            exit "$rc"
          fi
          if [ "$rc" -eq 1 ]; then
            echo "Kubernetes drift detected; reconciliation will apply the repository state."
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "Kubernetes state matches the repository."
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard workload image changes
        if: ${{ env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' && env.ALLOW_IMAGE_CHANGES != 'true' }}
        run: |
          set -euo pipefail
          chmod +x scripts/guard-reconcile-images.sh
          ./scripts/guard-reconcile-images.sh check

      - name: Apply production manifests
        id: apply
        if: ${{ env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          ./scripts/reconcile-vps.sh apply

      - name: Notify Telegram — production processing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        if: ${{ env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub variable: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub variable: TELEGRAM_CHAT_ID"; exit 1; }

          if [ "$TARGET_APP" = "media-generation" ]; then
            TAG="${RELEASE_TAG:-${MEDIA_TAG:-unknown}}"
          else
            TAG="$(grep -A1 'name: ghcr.io/phanthienquoc/tce-dashboard/web' apps/tce-dashboard/overlays/prod/kustomization.yaml | awk '/newTag:/ {print $2}')"
          fi
          test -n "$TAG" || TAG="unknown"

          # Keep this template identical in structure to the rollout summary.
          # Do not replace, collapse, or rewrite template fields dynamically.
          printf -v MESSAGE '%s\n' \
            "<pre>🔄 PRODUCTION • PROCESSING" \
            "" \
            "📦 App             $TARGET_APP" \
            "🏷️ Release         $TAG" \
            "" \
            "✓ GitOps synced" \
            "✓ VPS reconciliation" \
            "⏳ Rollout in progress</pre>"

          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MESSAGE}" -d "parse_mode=HTML"

      - name: Publish TCE deployment started event
        if: ${{ env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' && (steps.scope.outputs.target_app == 'all' || steps.scope.outputs.target_app == 'tce-dashboard') }}
        continue-on-error: true
        run: |
          set -euo pipefail
          chmod +x scripts/publish-microfe-deployment-event.sh
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG="$(grep -A1 'name: ghcr.io/phanthienquoc/tce-dashboard/web' apps/tce-dashboard/overlays/prod/kustomization.yaml | awk '/newTag:/ {print $2}')"
          fi
          ./scripts/publish-microfe-deployment-event.sh deploying tce-dashboard "$TAG" deploying

      - name: Verify cluster after reconciliation
        if: ${{ env.RECONCILE_MODE == 'apply' && steps.scope.outputs.target_app != 'keycloak' }}
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/platform-kubectl get nodes -o wide
          sudo /usr/local/sbin/platform-kubectl get pods -A -o wide

      - name: Verify drift cleared
        id: verify_drift
        if: ${{ env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          diff_stderr="$(mktemp)"
          trap 'rm -f "$diff_stderr"' EXIT
          set +e
          sudo /usr/local/sbin/platform-kubectl diff -k environments/prod 2>"$diff_stderr"
          rc=$?
          set -e
          case "$rc" in
            0) echo "Post-reconcile GitOps state is clean." ;;
            1) echo "Post-reconcile drift remains; refusing to report reconciliation as healthy." >&2 ;;
            *)
              echo "Post-reconcile drift verification failed with exit code $rc." >&2
              sed -n '1,120p' "$diff_stderr" >&2 || true
              ;;
          esac
          exit "$rc"

      - name: Fail if shared reconciliation failed
        if: ${{ !cancelled() && env.RECONCILE_MODE == 'apply' }}
        env:
          PREFLIGHT_STATUS: ${{ steps.preflight.outcome }}
          APPLY_STATUS: ${{ steps.apply.outcome }}
          DRIFT_STATUS: ${{ steps.verify_drift.outcome }}
          DRIFT: ${{ steps.preflight.outputs.drift }}
        run: |
          set -euo pipefail
          if [ "$PREFLIGHT_STATUS" != "success" ]; then
            echo "Shared reconciliation preflight did not succeed (status: ${PREFLIGHT_STATUS:-unknown}); refusing to report success." >&2
            exit 1
          fi
          case "$DRIFT" in
            true)
              [ "$APPLY_STATUS" = "success" ] || { echo "Production manifest reconciliation failed." >&2; exit 1; }
              [ "$DRIFT_STATUS" = "success" ] || { echo "Post-reconcile GitOps drift verification failed." >&2; exit 1; }
              ;;
            false)
              echo "Preflight succeeded and no manifest drift was detected; apply was correctly skipped."
              ;;
            *)
              echo "Shared reconciliation preflight did not produce a valid drift result; refusing to report success." >&2
              exit 1
              ;;
          esac
          echo "Shared manifest reconciliation passed; application lanes may proceed."

  deploy-auth-service:
    name: Deploy lane — Auth
    needs: reconcile
    if: ${{ needs.reconcile.result == 'success' && needs.reconcile.outputs.mode == 'apply' && (needs.reconcile.outputs.target_app == 'all' || needs.reconcile.outputs.target_app == 'auth-service') }}
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    environment: production
    concurrency:
      group: deploy-auth-service
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Verify Auth runtime Secret
        run: sudo /usr/local/sbin/platform-kubectl verify-auth-secret
      - name: Verify Auth rollout
        if: ${{ needs.reconcile.outputs.drift == 'true' }}
        run: sudo /usr/local/sbin/platform-kubectl rollout status deployment/microfe-auth -n microfe-platform --timeout=180s
      - name: Verify Auth HTTPS
        run: |
          set -euo pipefail
          tls_output="$(printf '' | openssl s_client -connect auth.mrcute.space:443 -servername auth.mrcute.space -verify_return_error 2>&1 || true)"
          printf '%s\\n' "$tls_output" | grep -q "Verify return code: 0 (ok)"
          printf '%s\\n' "$tls_output" | grep -Eq "subject=.*CN|subject=.*auth.mrcute.space|DNS:auth.mrcute.space"
      - name: Verify Auth workload health
        env:
          TARGET_APP: auth-service
        run: |
          set -euo pipefail
          chmod +x scripts/verify-workload-health.sh
          ./scripts/verify-workload-health.sh

  deploy-microfe:
    name: Deploy lane — MicroFE Shell / WS
    needs: reconcile
    if: ${{ needs.reconcile.result == 'success' && needs.reconcile.outputs.mode == 'apply' && (needs.reconcile.outputs.target_app == 'all' || needs.reconcile.outputs.target_app == 'microfe') }}
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    environment: production
    concurrency:
      group: deploy-microfe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Verify MicroFE Shell and WS rollout
        if: ${{ needs.reconcile.outputs.drift == 'true' }}
        run: |
          set -u
          rc=0
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/microfe-shell -n microfe-platform --timeout=180s || rc=1
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/microfe-ws -n microfe-platform --timeout=180s || rc=1
          exit "$rc"
      - name: Verify MicroFE workload health
        env:
          TARGET_APP: microfe
        run: |
          set -euo pipefail
          chmod +x scripts/verify-workload-health.sh
          ./scripts/verify-workload-health.sh

  deploy-keycloak:
    name: Deploy lane — Keycloak SSO
    needs: reconcile
    if: ${{ needs.reconcile.result == 'success' && needs.reconcile.outputs.mode == 'apply' && needs.reconcile.outputs.target_app == 'keycloak' }}
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    environment: production
    concurrency:
      group: deploy-keycloak
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Provision Keycloak runtime Secret
        env:
          KEYCLOAK_DB_URL: ${{ secrets.KEYCLOAK_DB_URL }}
          KEYCLOAK_DB_USERNAME: ${{ secrets.KEYCLOAK_DB_USERNAME }}
          KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
          KEYCLOAK_ADMIN_USERNAME: ${{ secrets.KEYCLOAK_ADMIN_USERNAME }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          for name in KEYCLOAK_DB_URL KEYCLOAK_DB_USERNAME KEYCLOAK_DB_PASSWORD KEYCLOAK_ADMIN_USERNAME KEYCLOAK_ADMIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required production Environment Secret: $name"
              exit 1
            fi
          done
          [[ "$KEYCLOAK_DB_USERNAME" == "keycloak_runtime.gtqovpusfyyvxpeezxlo" ]] || { echo "::error::KEYCLOAK_DB_USERNAME must be keycloak_runtime.gtqovpusfyyvxpeezxlo; do not deploy with the project owner role."; exit 1; }
          [[ "$KEYCLOAK_DB_URL" == "jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require" ]] || { echo "::error::Unexpected Keycloak JDBC target; refusing deploy."; exit 1; }
          [[ "${#KEYCLOAK_DB_PASSWORD}" -ge 32 && "${#KEYCLOAK_ADMIN_PASSWORD}" -ge 24 ]] || { echo "::error::Keycloak passwords do not meet minimum length requirements."; exit 1; }
          printf '%s\n%s\n%s\n%s\n%s\n' "$KEYCLOAK_DB_URL" "$KEYCLOAK_DB_USERNAME" "$KEYCLOAK_DB_PASSWORD" "$KEYCLOAK_ADMIN_USERNAME" "$KEYCLOAK_ADMIN_PASSWORD" |
            sudo /usr/local/sbin/platform-kubectl provision-keycloak-secret
          unset KEYCLOAK_DB_URL KEYCLOAK_DB_USERNAME KEYCLOAK_DB_PASSWORD KEYCLOAK_ADMIN_USERNAME KEYCLOAK_ADMIN_PASSWORD
          sudo /usr/local/sbin/platform-kubectl verify-keycloak-secret
      - name: Validate SSO DNS before issuing TLS
        run: |
          set -euo pipefail
          getent ahostsv4 sso.mrcute.space >/dev/null || { echo "::error::sso.mrcute.space does not currently resolve over IPv4."; exit 1; }
      - name: Apply only Keycloak resources
        run: sudo /usr/local/sbin/platform-kubectl apply -k platform/keycloak
      - name: Verify Keycloak rollout
        run: sudo /usr/local/sbin/platform-kubectl rollout status deployment/keycloak -n microfe-platform --timeout=300s
      - name: Verify Keycloak workload health
        env:
          TARGET_APP: keycloak
        run: |
          set -euo pipefail
          chmod +x scripts/verify-workload-health.sh
          ./scripts/verify-workload-health.sh
      - name: Provision and verify mrcute self-registration realm
        env:
          KEYCLOAK_ADMIN_USERNAME: ${{ secrets.KEYCLOAK_ADMIN_USERNAME }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          python3 scripts/provision-keycloak-realm.py
          python3 scripts/verify-keycloak-tce-client.py
          unset KEYCLOAK_ADMIN_USERNAME KEYCLOAK_ADMIN_PASSWORD
      - name: Verify public OIDC discovery
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 https://sso.mrcute.space/realms/master/.well-known/openid-configuration -o "$response"; then
              python3 - "$response" <<'PY'
          import json
          import sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          issuer = data.get("issuer", "")
          if issuer != "https://sso.mrcute.space/realms/master":
              raise SystemExit("OIDC discovery returned an unexpected issuer.")
          required = ("authorization_endpoint", "token_endpoint", "jwks_uri")
          if not all(data.get(key) for key in required):
              raise SystemExit("OIDC discovery document is missing required endpoints.")
          print("OIDC discovery passed; issuer and essential endpoints verified.")
          PY
              exit 0
            fi
            echo "Waiting for public OIDC discovery (attempt $attempt/18)..."
            sleep 10
          done
          echo "::error::Public OIDC discovery did not become ready." >&2
          exit 1

  deploy-tce-dashboard:
    name: Deploy lane — TCE Dashboard
    needs: reconcile
    if: ${{ needs.reconcile.result == 'success' && needs.reconcile.outputs.mode == 'apply' && (needs.reconcile.outputs.target_app == 'all' || needs.reconcile.outputs.target_app == 'tce-dashboard') }}
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    environment: production
    concurrency:
      group: deploy-tce-dashboard
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Verify TCE GitOps images
        run: |
          set -euo pipefail
          chmod +x scripts/verify-tce-gitops-images.sh
          ./scripts/verify-tce-gitops-images.sh
      - name: Verify TCE rollout
        if: ${{ needs.reconcile.outputs.drift == 'true' }}
        run: |
          set -u
          rc=0
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/tce-service -n tce-prod --timeout=180s || rc=1
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/tce-frontend -n tce-prod --timeout=180s || rc=1
          exit "$rc"
      - name: Verify TCE workload health
        env:
          TARGET_APP: tce-dashboard
        run: |
          set -euo pipefail
          chmod +x scripts/verify-workload-health.sh
          ./scripts/verify-workload-health.sh

