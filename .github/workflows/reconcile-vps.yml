name: reconcile-vps

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Reconciliation mode"
        required: true
        default: apply
        type: choice
        options:
          - plan
          - apply
      allow_image_changes:
        description: "Allow deliberate workload image replacement during apply"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 * * * *"
  push:
    branches:
      - master
    paths:
      - "apps/**"
      - "environments/**"

permissions:
  contents: read

concurrency:
  group: platform-vps-reconcile
  cancel-in-progress: false

env:
  RECONCILE_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'apply' || inputs.mode }}
  TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}

jobs:
  reconcile:
    if: github.ref == 'refs/heads/master'
    environment: production
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify repository state
        run: |
          set -euo pipefail
          git status --short
          git rev-parse HEAD
          test -f environments/prod/kustomization.yaml
          chmod +x scripts/reconcile-vps.sh

      - name: Inspect diff prerequisites
        run: |
          set -euo pipefail
          command -v diff
          diff --version | head -n 1
          sudo /usr/local/sbin/platform-kubectl version

      - name: Validate TCE release pairing
        run: |
          set -euo pipefail
          chmod +x scripts/verify-tce-gitops-release.sh
          ./scripts/verify-tce-gitops-release.sh

      - name: Preflight diff
        id: preflight
        run: |
          set -euo pipefail
          diff_stderr="$(mktemp)"
          trap 'rm -f "$diff_stderr"' EXIT
          set +e
          sudo /usr/local/sbin/platform-kubectl diff -k environments/prod 2>"$diff_stderr"
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "Kubernetes diff failed with exit code $rc" >&2
            echo "Diff stderr (diagnostic, no manifest diff is persisted):" >&2
            sed -n '1,120p' "$diff_stderr" >&2 || true
            echo "Diff prerequisites were verified immediately before this check." >&2
            exit "$rc"
          fi
          if [ "$rc" -eq 1 ]; then
            echo "Kubernetes drift detected; reconciliation will apply the repository state."
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "Kubernetes state matches the repository."
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard workload image changes
        if: env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' && inputs.allow_image_changes != true && github.event_name != 'push'
        run: |
          set -euo pipefail
          chmod +x scripts/guard-reconcile-images.sh
          ./scripts/guard-reconcile-images.sh check

      - name: Apply production manifests
        id: apply
        if: env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          ./scripts/reconcile-vps.sh apply

      - name: Notify Telegram — TCE rollout pending
        if: env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub variable: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub variable: TELEGRAM_CHAT_ID"; exit 1; }
          TAG="$(grep -A1 'name: ghcr.io/phanthienquoc/tce-dashboard/web' apps/tce-dashboard/overlays/prod/kustomization.yaml | awk '/newTag:/ {print $2}')"
          test -n "$TAG" || { echo "Unable to resolve TCE image tag"; exit 1; }
          MESSAGE="🟡 *tce-dashboard — RELEASE PROMOTED*\n\n📦 Environment: production\n🏷️ Image tag: ${TAG}\n🟡 GitOps state detected and reconciliation started\n⏳ VPS rollout: PENDING\n🕐 Time: $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M:%S ICT')\n🔗 Infra run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MESSAGE}" -d "parse_mode=Markdown"

      - name: Verify cluster after reconciliation
        if: env.RECONCILE_MODE == 'apply'
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/platform-kubectl get nodes -o wide
          sudo /usr/local/sbin/platform-kubectl get pods -A -o wide

      - name: Verify TCE GitOps images
        id: verify_tce_images
        if: env.RECONCILE_MODE == 'apply'
        run: |
          set -euo pipefail
          chmod +x scripts/verify-tce-gitops-images.sh
          ./scripts/verify-tce-gitops-images.sh

      - name: Verify stockdividend rollout
        id: verify_stock
        if: env.RECONCILE_MODE == 'apply'
        continue-on-error: true
        run: |
          set -u
          rc=0
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/stock-backend -n stock-prod || rc=1
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/stock-frontend -n stock-prod || rc=1
          exit "$rc"

      - name: Verify TCE rollout
        id: verify_tce
        if: env.RECONCILE_MODE == 'apply'
        continue-on-error: true
        run: |
          set -u
          rc=0
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/tce-service -n tce-prod || rc=1
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/tce-frontend -n tce-prod || rc=1
          exit "$rc"

      - name: Notify Telegram — TCE rollout failed
        if: env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' && steps.verify_tce.outcome != 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub variable: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub variable: TELEGRAM_CHAT_ID"; exit 1; }
          TAG="$(grep -A1 'name: ghcr.io/phanthienquoc/tce-dashboard/web' apps/tce-dashboard/overlays/prod/kustomization.yaml | awk '/newTag:/ {print $2}')"
          test -n "$TAG" || TAG="unknown"
          MESSAGE="🔴 *tce-dashboard — DEPLOY FAILED*\n\n📦 Environment: production\n🏷️ Image tag: ${TAG}\n❌ VPS rollout verification failed\n⚠️ Do not treat this release as live\n🕐 Time: $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M:%S ICT')\n🔗 Infra run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MESSAGE}" -d "parse_mode=Markdown"

      - name: Notify Telegram — stockdividend rollout failed
        if: env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' && steps.verify_stock.outcome != 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub variable: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub variable: TELEGRAM_CHAT_ID"; exit 1; }
          MESSAGE="🔴 *stockdividend — DEPLOY FAILED*\n\n📦 Environment: production\n❌ stock-backend/stock-frontend rollout verification failed\n⚠️ Do not treat this release as live\n🕐 Time: $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M:%S ICT')\n🔗 Infra run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MESSAGE}" -d "parse_mode=Markdown"

      - name: Notify Telegram — stockdividend rollout deployed
        if: env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' && steps.verify_stock.outcome == 'success'
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub variable: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub variable: TELEGRAM_CHAT_ID"; exit 1; }
          MESSAGE="✅ *stockdividend — PRODUCTION DEPLOYED*\n\n📦 Environment: production\n✅ stock-backend rollout verified\n✅ stock-frontend rollout verified\n🕐 Time: $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M:%S ICT')\n🔗 Infra run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MESSAGE}" -d "parse_mode=Markdown"

      - name: Notify Telegram — TCE rollout deployed
        if: env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' && steps.verify_tce.outcome == 'success' && steps.verify_tce_images.outcome == 'success'
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub variable: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub variable: TELEGRAM_CHAT_ID"; exit 1; }
          TAG="$(grep -A1 'name: ghcr.io/phanthienquoc/tce-dashboard/web' apps/tce-dashboard/overlays/prod/kustomization.yaml | awk '/newTag:/ {print $2}')"
          test -n "$TAG" || { echo "Unable to resolve TCE image tag"; exit 1; }
          MESSAGE="✅ *tce-dashboard — PRODUCTION DEPLOYED*\n\n📦 Environment: production\n🏷️ Image tag: ${TAG}\n✅ tce-frontend rollout verified\n✅ tce-service rollout verified\n🕐 Time: $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M:%S ICT')\n🔗 Infra run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MESSAGE}" -d "parse_mode=Markdown"

      - name: Notify Telegram — all production rollouts deployed
        if: env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' && steps.verify_stock.outcome == 'success' && steps.verify_tce.outcome == 'success' && steps.verify_tce_images.outcome == 'success'
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub variable: TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing GitHub variable: TELEGRAM_CHAT_ID"; exit 1; }
          MESSAGE="🎉 *ALL PRODUCTION ROLLOUTS SUCCESS*\n\n📦 Successful repositories:\n• stockdividend\n• tce-dashboard\n\n✅ All application rollouts verified\n🕐 Time: $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M:%S ICT')\n🔗 Infra run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MESSAGE}" -d "parse_mode=Markdown"

      - name: Verify drift cleared
        if: env.RECONCILE_MODE == 'apply'
        run: |
          set -euo pipefail
          diff_stderr="$(mktemp)"
          trap 'rm -f "$diff_stderr"' EXIT
          set +e
          sudo /usr/local/sbin/platform-kubectl diff -k environments/prod 2>"$diff_stderr"
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "Post-reconcile GitOps state is clean."
              ;;
            1)
              echo "Post-reconcile drift remains; refusing to report reconciliation as healthy." >&2
              ;;
            *)
              echo "Post-reconcile drift verification failed with exit code $rc." >&2
              echo "Diff stderr (diagnostic, no manifest diff is persisted):" >&2
              sed -n '1,120p' "$diff_stderr" >&2 || true
              ;;
          esac
          exit "$rc"

      - name: Fail if reconciliation apply failed
        if: env.RECONCILE_MODE == 'apply' && steps.preflight.outputs.drift == 'true' && steps.apply.outcome != 'success'
        run: |
          echo "Reconciliation apply reported one or more rollout failures." >&2
          echo "Per-repository rollout notifications above report which repositories completed successfully." >&2
          exit 1
