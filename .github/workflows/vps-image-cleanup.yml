name: vps-image-cleanup

on:
  workflow_dispatch:
    inputs:
      keep_count:
        description: "Minimum number of newest unreferenced tagged images to retain"
        required: true
        default: "3"
        type: string
      dry_run:
        description: "List candidates without deleting"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "30 3 * * 0"

permissions:
  contents: read

concurrency:
  group: platform-vps-image-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    environment: production
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tools
        run: |
          set -euo pipefail
          command -v docker
          command -v jq
          sudo docker version
          sudo /usr/local/sbin/platform-kubectl version

      - name: Cleanup safe unreferenced images
        env:
          KEEP_COUNT: "${{ inputs.keep_count || '3' }}"
          DRY_RUN: "${{ inputs.dry_run || 'false' }}"
        run: |
          set -euo pipefail
          case "$KEEP_COUNT" in ''|*[!0-9]*) echo "keep_count must be numeric" >&2; exit 1;; esac
          [ "$KEEP_COUNT" -ge 1 ] || { echo "keep_count must be >= 1" >&2; exit 1; }

          sudo /usr/local/sbin/platform-kubectl get pods -A -o json |
            jq -r '.items[].spec.containers[].image' | sort -u > /tmp/live-images.txt

          echo "Live images:"
          cat /tmp/live-images.txt

          # Resolve live Docker image IDs too. This protects digest-based or
          # differently tagged references that point at the same local image.
          while IFS= read -r image; do
            sudo docker image inspect "$image" --format '{{.Id}}' 2>/dev/null || true
          done < /tmp/live-images.txt | sort -u > /tmp/live-image-ids.txt

          sudo docker image ls --format '{{.Repository}}:{{.Tag}}	{{.ID}}	{{.CreatedAt}}' |
            awk -F '\t' '$1 !~ /<none>:/ && $2 !~ /<none>/' |
            sort -t '\t' -k3,3r > /tmp/all-tagged-images.txt

          : > /tmp/image-candidates.txt
          while IFS=
          done < /tmp/all-tagged-images.txt |
            tee /tmp/unreferenced-tagged-images.txt

          candidate_count="$(wc -l < /tmp/unreferenced-tagged-images.txt | tr -d ' ')"
          if [ "$candidate_count" -le "$KEEP_COUNT" ]; then
            : > /tmp/image-candidates.txt
          else
            tail -n +$((KEEP_COUNT + 1)) /tmp/unreferenced-tagged-images.txt > /tmp/image-candidates.txt
          fi

          echo
          echo "Retaining newest $KEEP_COUNT unreferenced tagged image(s)."
          echo "Tagged images selected for removal:"
          if [ -s /tmp/image-candidates.txt ]; then
            cat /tmp/image-candidates.txt
          else
            echo "none"
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled; no images deleted."
            exit 0
          fi

          # Remove only explicitly selected tags. --no-prune prevents Docker
          # from cascading into unselected parent layers.
          while IFS=$'\t' read -r image id created; do
            [ -n "$image" ] || continue
            echo "Removing unreferenced image tag: $image"
            sudo docker image rm --no-prune "$image"
          done < /tmp/image-candidates.txt

          # Remove dangling images left behind by tag cleanup. This remains
          # separate from K3s/containerd, which is intentionally not pruned.
          mapfile -t dangling < <(sudo docker image ls --filter dangling=true -q | sort -u)
          if [ "${#dangling[@]}" -gt 0 ]; then
            printf '%s\n' "${dangling[@]}" | xargs -r sudo docker image rm --no-prune
          fi

          echo "Safe cleanup completed; K3s/containerd cache was not pruned."
\t' read -r created image id; do
            [ -n "$image" ] || continue
            grep -Fxq "$image" /tmp/live-images.txt && continue
            grep -Fxq "$id" /tmp/live-image-ids.txt && continue
            printf '%s\t%s\t%s\n' "$image" "$id" "$created"
          done < /tmp/all-tagged-images.txt |
            tee /tmp/unreferenced-tagged-images.txt

          candidate_count="$(wc -l < /tmp/unreferenced-tagged-images.txt | tr -d ' ')"
          if [ "$candidate_count" -le "$KEEP_COUNT" ]; then
            : > /tmp/image-candidates.txt
          else
            tail -n +$((KEEP_COUNT + 1)) /tmp/unreferenced-tagged-images.txt > /tmp/image-candidates.txt
          fi

          echo
          echo "Retaining newest $KEEP_COUNT unreferenced tagged image(s)."
          echo "Tagged images selected for removal:"
          if [ -s /tmp/image-candidates.txt ]; then
            cat /tmp/image-candidates.txt
          else
            echo "none"
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled; no images deleted."
            exit 0
          fi

          # Remove only explicitly selected tags. --no-prune prevents Docker
          # from cascading into unselected parent layers.
          while IFS=$'\t' read -r image id created; do
            [ -n "$image" ] || continue
            echo "Removing unreferenced image tag: $image"
            sudo docker image rm --no-prune "$image"
          done < /tmp/image-candidates.txt

          # Remove dangling images left behind by tag cleanup. This remains
          # separate from K3s/containerd, which is intentionally not pruned.
          mapfile -t dangling < <(sudo docker image ls --filter dangling=true -q | sort -u)
          if [ "${#dangling[@]}" -gt 0 ]; then
            printf '%s\n' "${dangling[@]}" | xargs -r sudo docker image rm --no-prune
          fi

          echo "Safe cleanup completed; K3s/containerd cache was not pruned."
