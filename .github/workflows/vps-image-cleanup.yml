name: vps-image-cleanup

on:
  workflow_dispatch:
    inputs:
      keep_count:
        description: "Minimum number of newest unreferenced Docker image tags to retain"
        required: true
        default: "3"
        type: string
      dry_run:
        description: "List candidates without deleting"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "30 3 * * 0"

permissions:
  contents: read

concurrency:
  group: platform-vps-image-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    environment: production
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tools
        run: |
          set -euo pipefail
          command -v docker
          command -v jq
          sudo docker version
          sudo /usr/local/sbin/platform-kubectl version

      - name: Cleanup safe unreferenced Docker images
        env:
          KEEP_COUNT: "${{ inputs.keep_count || '3' }}"
          DRY_RUN: "${{ inputs.dry_run || 'false' }}"
        run: |
          set -euo pipefail
          case "$KEEP_COUNT" in ''|*[!0-9]*) echo "keep_count must be numeric" >&2; exit 1;; esac
          [ "$KEEP_COUNT" -ge 1 ] || { echo "keep_count must be >= 1" >&2; exit 1; }
          sudo /usr/local/sbin/platform-kubectl get pods -A -o json |
            jq -r '.items[].spec.containers[].image' | sort -u > /tmp/live-images.txt
          while IFS= read -r image; do
            sudo docker image inspect "$image" --format '{{.Id}}' 2>/dev/null || true
          done < /tmp/live-images.txt | sort -u > /tmp/live-image-ids.txt
          sudo docker image ls --format '{{.Repository}}:{{.Tag}}	{{.ID}}	{{.CreatedAt}}' |
            awk -F '\t' '$1 !~ /<none>:/ && $2 !~ /<none>/' |
            sort -t '\t' -k3,3r > /tmp/all-tagged-images.txt
          : > /tmp/unreferenced-tagged-images.txt
          while IFS=$'\t' read -r image id created; do
            [ -n "$image" ] || continue
            grep -Fxq "$image" /tmp/live-images.txt && continue
            grep -Fxq "$id" /tmp/live-image-ids.txt && continue
            printf '%s\t%s\t%s\n' "$image" "$id" "$created"
          done < /tmp/all-tagged-images.txt > /tmp/unreferenced-tagged-images.txt
          candidate_count="$(wc -l < /tmp/unreferenced-tagged-images.txt | tr -d ' ')"
          if [ "$candidate_count" -le "$KEEP_COUNT" ]; then
            : > /tmp/image-candidates.txt
          else
            tail -n +$((KEEP_COUNT + 1)) /tmp/unreferenced-tagged-images.txt > /tmp/image-candidates.txt
          fi
          echo "Live image references:"
          cat /tmp/live-images.txt
          echo "Selected Docker tag candidates:"
          cat /tmp/image-candidates.txt || true
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled; no images deleted."
            exit 0
          fi
          while IFS=$'\t' read -r image id created; do
            [ -n "$image" ] || continue
            echo "Removing unreferenced Docker image tag: $image"
            sudo docker image rm --no-prune "$image"
          done < /tmp/image-candidates.txt
          echo "Docker-only cleanup completed; K3s/containerd is managed separately."

      - name: Cleanup safe unused K3s containerd images
        env:
          DRY_RUN: "${{ inputs.dry_run || 'false' }}"
          KEEP_UNUSED_IMAGES: "10"
        run: |
          set -euo pipefail
          DRY_RUN="$DRY_RUN" KEEP_UNUSED_IMAGES="$KEEP_UNUSED_IMAGES" scripts/cleanup-k3s-images.sh
