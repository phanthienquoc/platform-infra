name: vps-image-cleanup

on:
  push:
    branches: [master]
    paths:
      - "scripts/cleanup-k3s-images.sh"
      - "scripts/tests/cleanup-k3s-images.test.sh"
      - ".github/workflows/vps-image-cleanup.yml"
  workflow_dispatch:
    inputs:
      keep_unused_images:
        description: "Minimum number of newest unused K3s images to retain"
        required: true
        default: "10"
        type: string
      dry_run:
        description: "List candidates without deleting"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "30 3 * * 0"

permissions:
  contents: read

concurrency:
  group: platform-vps-image-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    environment: production
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify cleanup prerequisites
        run: |
          set -euo pipefail
          command -v jq
          sudo /usr/local/sbin/platform-kubectl version
          test -x /usr/local/sbin/platform-crictl
          sudo /usr/local/sbin/platform-crictl ps >/dev/null
          sudo /usr/local/sbin/platform-crictl images >/dev/null

      - name: Dry-run or clean unused K3s images
        env:
          KEEP_UNUSED_IMAGES: "${{ inputs.keep_unused_images || '10' }}"
          DRY_RUN: "${{ github.event_name != 'workflow_dispatch' && 'true' || (inputs.dry_run == true && 'true' || 'false') }}"
        run: |
          set -euo pipefail
          scripts/cleanup-k3s-images.sh
