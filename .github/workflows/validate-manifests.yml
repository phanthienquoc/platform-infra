name: validate-manifests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.2

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print | sort)

      - name: Render production manifests
        run: kubectl kustomize environments/prod > /tmp/platform-infra-rendered.yaml

      - name: Validate rendered YAML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          docs = list(yaml.safe_load_all(Path('/tmp/platform-infra-rendered.yaml').read_text()))
          if not docs:
              raise SystemExit('Rendered manifest is empty.')
          for i, obj in enumerate(docs, 1):
              if not isinstance(obj, dict):
                  raise SystemExit(f'Document {i} is not a YAML object.')
              if not all(k in obj for k in ('apiVersion', 'kind', 'metadata')):
                  raise SystemExit(f'Document {i} is missing required Kubernetes fields.')
              if not isinstance(obj['metadata'], dict) or not obj['metadata'].get('name'):
                  raise SystemExit(f'Document {i} has invalid metadata.name.')
          print(f'Validated {len(docs)} rendered Kubernetes objects.')

      - name: Enforce secret policy
        run: |
          set -euo pipefail
          if grep -nE '^kind: Secret$|^[[:space:]]+data:' /tmp/platform-infra-rendered.yaml; then
            echo 'Rendered manifests must not contain Secret objects or inline secret data.'
            exit 1
          fi

      - name: Validate immutable image policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import yaml

          docs = list(yaml.safe_load_all(Path('/tmp/platform-infra-rendered.yaml').read_text()))
          images = []
          def walk(v):
              if isinstance(v, dict):
                  for k, child in v.items():
                      if k == 'image' and isinstance(child, str) and child.startswith('ghcr.io/phanthienquoc/'):
                          images.append(child)
                      walk(child)
              elif isinstance(v, list):
                  for child in v:
                      walk(child)
          for doc in docs:
              walk(doc)

          if not images:
              raise SystemExit('No first-party application images were rendered.')

          patterns = [
              re.compile(r'^ghcr\.io/phanthienquoc/stockdividend/(backend|admin):[0-9a-f]{7,64}$'),
              re.compile(r'^ghcr\.io/phanthienquoc/tce-dashboard/(web|service):prod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7,64}$'),
              re.compile(r'^ghcr\.io/phanthienquoc/media-generation/(backend|frontend):[0-9a-f]{7,64}$'),
              re.compile(r'^ghcr\.io/phanthienquoc/microfe-(auth|shell):0\.1\.0$'),
              re.compile(r'^ghcr\.io/phanthienquoc/microfe-ws:RELEASE_SHA$'),
              re.compile(r'^ghcr\.io/phanthienquoc/microfe-(auth|shell|ws)@sha256:[0-9a-f]{64}$'),
          ]
          invalid = [image for image in images if not any(p.fullmatch(image) for p in patterns)]
          if invalid:
              raise SystemExit('Invalid first-party image tags:\n' + '\n'.join(f'  {x}' for x in invalid))
          print(f'Validated {len(images)} first-party image references.')

      - name: Validate network boundaries
        run: ./scripts/validate-network-boundaries.sh /tmp/platform-infra-network.yaml

      - name: Report validation failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Manifest validation failed. Check the failed step(s) above."
