name: validate-manifests
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML with kubectl
        uses: azure/setup-kubectl@v4
      - run: |
          for file in $(find kubernetes -type f -name '*.yaml'); do
            kubectl apply --dry-run=client --validate=false -f "$file" >/dev/null
          done
