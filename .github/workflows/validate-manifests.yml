name: validate-manifests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.2
      - name: Install kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
      - name: Validate shell scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find scripts -type f -name '*.sh' -print | sort)
          test "${#scripts[@]}" -gt 0
          for script in "${scripts[@]}"; do
            bash -n "$script"
            echo "Validated shell syntax: $script"
          done
      - name: Render production manifests
        run: kubectl kustomize environments/prod > /tmp/platform-infra-rendered.yaml
      - name: Validate rendered YAML structure (offline)
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('/tmp/platform-infra-rendered.yaml')
          docs = list(yaml.safe_load_all(path.read_text()))
          if not docs:
              raise SystemExit('Rendered manifest is empty.')
          for index, obj in enumerate(docs, 1):
              if not isinstance(obj, dict):
                  raise SystemExit(f'Document {index} is not a YAML object.')
              missing = [key for key in ('apiVersion', 'kind', 'metadata') if key not in obj]
              if missing:
                  raise SystemExit(f'Document {index} is missing required Kubernetes fields: {missing}')
              if not isinstance(obj['metadata'], dict) or not obj['metadata'].get('name'):
                  raise SystemExit(f'Document {index} has invalid metadata.name.')
          print(f'Validated {len(docs)} rendered Kubernetes objects offline.')
          PY
      - name: Enforce secret policy
        run: |
          set -euo pipefail
          if grep -nE '^kind: Secret$|^[[:space:]]+data:' /tmp/platform-infra-rendered.yaml; then
            echo 'Rendered manifests must not contain Secret objects or inline secret data.'
            exit 1
          fi
      - name: Check immutable application image tags
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          docs = list(yaml.safe_load_all(Path('/tmp/platform-infra-rendered.yaml').read_text()))
          images = []

          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key == 'image' and isinstance(child, str) and child.startswith('ghcr.io/phanthienquoc/'):
                          images.append(child)
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          for doc in docs:
              walk(doc)

          if not images:
              raise SystemExit('No first-party application images were rendered.')

          stock_sha = re.compile(
              r'^ghcr\.io/phanthienquoc/stockdividend/(backend|admin):[0-9a-f]{7,64}$'
          )
          tce_versioned = re.compile(
              r'^ghcr\.io/phanthienquoc/tce-dashboard/(web|service):prod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7,64}
          if invalid:
              print('Invalid first-party image tags:')
              for image in invalid:
                  print(f'  {image}')
              raise SystemExit(
                  'First-party application images must use immutable Git-SHA tags; '
                  'TCE versioned tags must be prod-v<semver>-<git-sha>.'
              )

          print(f'Validated {len(images)} immutable first-party application images.')
          PY
      - name: Validate network boundaries
        run: |
          chmod +x scripts/validate-network-boundaries.sh
          ./scripts/validate-network-boundaries.sh /tmp/platform-infra-network.yaml

          )
          media_sha = re.compile(
              r'^ghcr\.io/phanthienquoc/media-generation:[0-9a-f]{7,64}
          if invalid:
              print('Invalid first-party image tags:')
              for image in invalid:
                  print(f'  {image}')
              raise SystemExit(
                  'First-party application images must use immutable Git-SHA tags; '
                  'TCE versioned tags must be prod-v<semver>-<git-sha>.'
              )

          print(f'Validated {len(images)} immutable first-party application images.')
          PY
      - name: Validate network boundaries
        run: |
          chmod +x scripts/validate-network-boundaries.sh
          ./scripts/validate-network-boundaries.sh /tmp/platform-infra-network.yaml

          )

          invalid = [
              image for image in images
              if not (
                  stock_sha.fullmatch(image)
                  or tce_versioned.fullmatch(image)
                  or media_sha.fullmatch(image)
              )
          ]
          if invalid:
              print('Invalid first-party image tags:')
              for image in invalid:
                  print(f'  {image}')
              raise SystemExit(
                  'First-party application images must use immutable Git-SHA tags; '
                  'TCE versioned tags must be prod-v<semver>-<git-sha>.'
              )

          print(f'Validated {len(images)} immutable first-party application images.')
          PY
      - name: Validate network boundaries
        run: |
          chmod +x scripts/validate-network-boundaries.sh
          ./scripts/validate-network-boundaries.sh /tmp/platform-infra-network.yaml
