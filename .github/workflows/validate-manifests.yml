# yamllint disable rule:line-length
name: validate-manifests

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "debug/vps-latest.md"
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Reject retired StockDividend and Media production manifests
        run: bash scripts/verify-retired-production-manifests.sh

      - name: Test immutable image-change contract
        run: python3 scripts/validate-image-change-contract.py --self-test

      - name: Test Auth digest promotion helper
        run: python3 scripts/promote-auth-image-digest.py --self-test

      - name: Test exact Auth and TCE dispatch payload contracts
        run: |
          set -euo pipefail
          bash scripts/tests/verify-auth-dispatch-payload.test.sh
          bash scripts/tests/verify-tce-dispatch-payload.test.sh


      - name: Validate changed production image references
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/validate-image-change-contract.py "$BASE_SHA" "$HEAD_SHA"

      - name: Install offline validation dependencies
        env:
          KUBECTL_VERSION: v1.36.3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          case "$(uname -m)" in
            x86_64) kubectl_arch=amd64 ;;
            aarch64|arm64) kubectl_arch=arm64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${kubectl_arch}/kubectl"
          curl -fsSLo kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${kubectl_arch}/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client=true

      - name: Validate optional VPS MCP GitOps-only contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validate-vps-control-mcp-contract.py
          python3 scripts/validate-vps-control-mcp-contract.py --self-test
          python3 scripts/validate-vps-control-mcp-contract.py

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print | sort)

      - name: Validate pinned cert-manager bootstrap contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validate-cert-manager-bootstrap-contract.py
          python3 scripts/validate-cert-manager-bootstrap-contract.py --self-test

      - name: Render production manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="platform/cert-manager/cert-manager.yaml"
          prepared=false
          cleanup() {
            if [[ "$prepared" == true ]]; then
              rm -f "$manifest"
            fi
          }
          trap cleanup EXIT
          bash scripts/prepare-cert-manager-manifest.sh "$GITHUB_WORKSPACE/$manifest"
          prepared=true
          kubectl kustomize environments/prod > /tmp/platform-infra-rendered.yaml

      - name: Validate Auth GitOps contract validator
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validate-auth-gitops-contract.py
          python3 scripts/validate-auth-gitops-contract.py --self-test

      - name: Validate rendered Auth GitOps contract
        run: python3 scripts/validate-auth-gitops-contract.py /tmp/platform-infra-rendered.yaml

      - name: Validate rendered YAML structure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          docs = list(yaml.safe_load_all(Path("/tmp/platform-infra-rendered.yaml").read_text()))
          if not docs:
              raise SystemExit("Rendered manifest is empty.")
          for index, obj in enumerate(docs, 1):
              if not isinstance(obj, dict):
                  raise SystemExit(f"Document {index} is not a YAML object.")
              missing = [k for k in ("apiVersion", "kind", "metadata") if k not in obj]
              if missing:
                  raise SystemExit(f"Document {index} missing required fields: {missing}")
              if not isinstance(obj["metadata"], dict) or not obj["metadata"].get("name"):
                  raise SystemExit(f"Document {index} has invalid metadata.name.")
          print(f"Validated {len(docs)} rendered Kubernetes objects offline.")
          PY

      - name: Enforce secret policy
        run: |
          set -euo pipefail
          if grep -nE '^kind: Secret$|^[[:space:]]+data:' /tmp/platform-infra-rendered.yaml; then
            echo 'Rendered manifests must not contain Secret objects or inline secret data.'
            exit 1
          fi

      - name: Validate immutable image policy
        run: |
          set -euo pipefail
          mapfile -t images < <(
            grep -E '^[[:space:]]+image:[[:space:]]+ghcr\.io/phanthienquoc/' /tmp/platform-infra-rendered.yaml |
            sed -E 's/^[[:space:]]+image:[[:space:]]+//'
          )
          test "${#images[@]}" -gt 0
          for image in "${images[@]}"; do
            case "$image" in
              ghcr.io/phanthienquoc/tce-dashboard/*)
                [[ "$image" =~ ^ghcr[.]io/phanthienquoc/tce-dashboard/(web|service)(:prod-v[0-9]+[.][0-9]+[.][0-9]+-[0-9a-f]{7,40}|@sha256:[0-9a-f]{64})$ ]] || { echo "Invalid TCE image: $image"; exit 1; } ;;
              ghcr.io/phanthienquoc/auth-service/auth:*|ghcr.io/phanthienquoc/auth-service/auth@sha256:*)
                [[ "$image" =~ ^ghcr\.io/phanthienquoc/auth-service/auth(:prod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7,40}|:[0-9a-f]{7,64}|@sha256:[0-9a-f]{64})$ ]] || { echo "Invalid Auth image reference: $image"; exit 1; } ;;
              ghcr.io/phanthienquoc/microfe-auth@sha256:*|ghcr.io/phanthienquoc/microfe-shell@sha256:*|ghcr.io/phanthienquoc/microfe-ws@sha256:*)
                [[ "$image" =~ ^ghcr\.io/phanthienquoc/microfe-(auth|shell|ws)@sha256:[0-9a-f]{64}$ ]] || { echo "Invalid MicroFE digest: $image"; exit 1; } ;;
              *)
                echo "Invalid first-party image tag: $image"
                exit 1 ;;
            esac
          done

      - name: Validate isolated Keycloak manifests
        run: |
          set -euo pipefail
          kubectl kustomize platform/keycloak > /tmp/keycloak-rendered.yaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          rendered = Path("/tmp/keycloak-rendered.yaml").read_text()
          docs = list(yaml.safe_load_all(rendered))
          if len(docs) != 6:
              raise SystemExit(f"Expected 6 isolated Keycloak resources, got {len(docs)}")
          identities = {(item.get("kind"), item.get("metadata", {}).get("name")) for item in docs}
          required = {
              ("Deployment", "keycloak"),
              ("Service", "keycloak"),
              ("Ingress", "keycloak-public"),
              ("Certificate", "keycloak-sso-tls"),
              ("Middleware", "keycloak-registration-rate-limit"),
              ("Ingress", "keycloak-registration-rate-limit"),
          }
          if identities != required:
              raise SystemExit(f"Keycloak resource contract mismatch: {identities}")
          deployment = next(item for item in docs if item.get("kind") == "Deployment")
          container = deployment["spec"]["template"]["spec"]["containers"][0]
          if container.get("image") != "quay.io/keycloak/keycloak:26.8.1":
              raise SystemExit("Keycloak image must remain pinned to 26.8.1.")
          if any(item.get("kind") == "Secret" for item in docs):
              raise SystemExit("Keycloak credentials must not be stored as Git manifests.")
          if "sso.mrcute.space" not in rendered or "auth.mrcute.space" in rendered:
              raise SystemExit("Keycloak resources must only own the dedicated SSO hostname.")
          print("Validated isolated Keycloak Deployment, Service, Ingress, Certificate and secret references.")
          PY

      - name: Validate network boundaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/validate-network-boundaries.sh
          ./scripts/validate-network-boundaries.sh /tmp/platform-infra-network.yaml

  report-validation-failure:
    if: ${{ always() && github.event_name == 'pull_request' && needs.validate.result == 'failure' }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Report validation failure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Manifest validation failed. Check the failed step(s) above."
# yamllint enable rule:line-length
