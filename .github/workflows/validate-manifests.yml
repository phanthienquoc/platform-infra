name: validate-manifests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print | sort)

      - name: Render production manifests
        run: kubectl kustomize environments/prod > /tmp/platform-infra-rendered.yaml

      - name: Validate rendered YAML
        run: kubectl apply --dry-run=client -f /tmp/platform-infra-rendered.yaml >/dev/null

      - name: Enforce secret policy
        run: |
          set -euo pipefail
          if grep -nE '^kind: Secret$|^[[:space:]]+data:' /tmp/platform-infra-rendered.yaml; then
            echo 'Rendered manifests must not contain Secret objects or inline secret data.'
            exit 1
          fi

      - name: Validate immutable image policy
        run: |
          set -euo pipefail
          mapfile -t images < <(
            grep -E '^[[:space:]]+image:[[:space:]]+ghcr\.io/phanthienquoc/' /tmp/platform-infra-rendered.yaml |
            sed -E 's/^[[:space:]]+image:[[:space:]]+//'
          )
          test "${#images[@]}" -gt 0
          for image in "${images[@]}"; do
            case "$image" in
              ghcr.io/phanthienquoc/stockdividend/backend:[0-9a-f]*|ghcr.io/phanthienquoc/stockdividend/admin:[0-9a-f]*)
                [[ "$image" =~ ^ghcr\.io/phanthienquoc/stockdividend/(backend|admin):[0-9a-f]{7,64}$ ]] || exit 1 ;;
              ghcr.io/phanthienquoc/tce-dashboard/*)
                [[ "$image" =~ ^ghcr\.io/phanthienquoc/tce-dashboard/(web|service):prod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7,64}$ ]] || exit 1 ;;
              ghcr.io/phanthienquoc/media-generation/*)
                [[ "$image" =~ ^ghcr\.io/phanthienquoc/media-generation/(backend|frontend):[0-9a-f]{7,64}$ ]] || exit 1 ;;
              ghcr.io/phanthienquoc/microfe-auth:0.1.0|ghcr.io/phanthienquoc/microfe-shell:0.1.0|ghcr.io/phanthienquoc/microfe-ws:RELEASE_SHA)
                ;;
              ghcr.io/phanthienquoc/microfe-auth@sha256:*|ghcr.io/phanthienquoc/microfe-shell@sha256:*|ghcr.io/phanthienquoc/microfe-ws@sha256:*)
                [[ "$image" =~ ^ghcr\.io/phanthienquoc/microfe-(auth|shell|ws)@sha256:[0-9a-f]{64}$ ]] || exit 1 ;;
              *)
                echo "Invalid first-party image tag: $image"
                exit 1 ;;
            esac
          done

      - name: Validate network boundaries
        run: ./scripts/validate-network-boundaries.sh /tmp/platform-infra-network.yaml

      - name: Report validation failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body "Manifest validation failed. Check the failed step(s) above."
