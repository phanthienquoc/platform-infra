name: provision-auth-runtime-secret

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-runtime-secret-provision
  cancel-in-progress: false

jobs:
  provision:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    environment: production
    timeout-minutes: 5
    steps:
      - name: Verify runner policy
        run: |
          set -euo pipefail
          policy="$(sudo /usr/local/sbin/platform-kubectl policy-version)"
          case "$policy" in
            "platform-kubectl policy: rollout-status-v9-auth-secret-provision" | \
              "platform-kubectl policy: rollout-status-v10-keycloak-secret-provision" | \
              "platform-kubectl policy: rollout-status-v11-auth-shutdown")
              ;;
            *)
              echo "::error::Runner policy is not updated. Re-run the approved platform runner bootstrap before provisioning."
              exit 1
              ;;
          esac

      - name: Provision Auth runtime Secret from platform-infra Environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY JWT_SECRET MFA_ENCRYPTION_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required production Environment Secret: $name"
              exit 1
            fi
          done
          printf '%s\n%s\n%s\n%s\n' \
            "$SUPABASE_URL" \
            "$SUPABASE_SERVICE_ROLE_KEY" \
            "$JWT_SECRET" \
            "$MFA_ENCRYPTION_KEY" |
            sudo /usr/local/sbin/platform-kubectl provision-auth-secret
          unset SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY JWT_SECRET MFA_ENCRYPTION_KEY

      - name: Verify required keys without displaying values
        run: sudo /usr/local/sbin/platform-kubectl verify-auth-secret
