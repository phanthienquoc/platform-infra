name: Reusable — Sync Media Runtime Secret

on:
  workflow_call:
    secrets:
      gemini_api_key:
        required: true
      supabase_url:
        required: true
      supabase_service_role_key:
        required: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.gemini_api_key }}
      SUPABASE_URL: ${{ secrets.supabase_url }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.supabase_service_role_key }}
      MEDIA_STORAGE_BUCKET: media-generation
    steps:
      - name: Sync media runtime secret to K3s
        run: |
          set -euo pipefail

          test -n "${VPS_HOST:-}" || { echo "::error::Missing platform secret VPS_HOST"; exit 1; }
          test -n "${VPS_USER:-}" || { echo "::error::Missing platform secret VPS_USER"; exit 1; }
          test -n "${VPS_SSH_PRIVATE_KEY:-}" || { echo "::error::Missing platform secret VPS_SSH_PRIVATE_KEY"; exit 1; }
          test -n "${GEMINI_API_KEY:-}" || { echo "::error::Missing media secret GEMINI_API_KEY"; exit 1; }
          test -n "${SUPABASE_URL:-}" || { echo "::error::Missing media secret SUPABASE_URL"; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "::error::Missing media secret SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/vps_key"
          chmod 600 "${HOME}/.ssh/vps_key"
          ssh-keyscan -H "${VPS_HOST}" >> "${HOME}/.ssh/known_hosts" 2>/dev/null

          printf '%s\n' \
            "GEMINI_API_KEY=${GEMINI_API_KEY}" \
            "SUPABASE_URL=${SUPABASE_URL}" \
            "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}" \
            "MEDIA_STORAGE_BUCKET=${MEDIA_STORAGE_BUCKET}" |
            ssh -i "${HOME}/.ssh/vps_key" -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" '
              set -euo pipefail
              sudo /usr/local/sbin/platform-kubectl create namespace media-prod --dry-run=client -o yaml |
                sudo /usr/local/sbin/platform-kubectl apply -f -
              sudo /usr/local/sbin/platform-kubectl create secret generic media-generation-secrets                 -n media-prod                 --from-env-file=/dev/stdin                 --dry-run=client                 -o yaml |
                sudo /usr/local/sbin/platform-kubectl apply -f -
              sudo /usr/local/sbin/platform-kubectl get secret media-generation-secrets -n media-prod >/dev/null
            '

          echo "Media runtime secret synchronized to media-prod."
