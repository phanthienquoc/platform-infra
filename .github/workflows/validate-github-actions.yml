name: validate-github-actions

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "actionlint.yaml"
      - ".yamllint.yml"
      - ".github/workflows/validate-github-actions.yml"
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "actionlint.yaml"
      - ".yamllint.yml"
      - ".github/workflows/validate-github-actions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Install pinned actionlint release binary
        env:
          ACTIONLINT_VERSION: "1.7.12"
          CHECKSUMS_SHA256: "433028cf0ba3c42163ea1a668dedce30fcdbe84fe912b1a5e288c006eab8a4f5"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 120 \
            --output "$RUNNER_TEMP/$archive" "$base/$archive"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 120 \
            --output "$RUNNER_TEMP/actionlint_checksums.txt" \
            "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          printf '%s  %s\n' "$CHECKSUMS_SHA256" "$RUNNER_TEMP/actionlint_checksums.txt" | sha256sum --check --status
          awk -v archive="$archive" '$2 == archive { print $1 "  " archive }' \
            "$RUNNER_TEMP/actionlint_checksums.txt" > "$RUNNER_TEMP/actionlint.sha256"
          test -s "$RUNNER_TEMP/actionlint.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check actionlint.sha256)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" actionlint
          chmod 0755 "$RUNNER_TEMP/bin/actionlint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/actionlint" -version

      - name: Install yamllint
        run: |
          python -m pip install --disable-pip-version-check --no-input yamllint

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run actionlint
        run: actionlint -config-file actionlint.yaml

      - name: Run yamllint
        run: yamllint --strict .github/workflows

      - name: Run shellcheck on standalone scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find scripts -type f -name '*.sh' -print)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi
          shellcheck "${scripts[@]}"

      - name: Run ops regression tests
        run: |
          bash scripts/tests/verify-workload-health.test.sh
          bash scripts/tests/reconcile-vps.test.sh
          bash scripts/tests/validate-public-smoke-contract.test.sh
          bash scripts/tests/validate-ghcr-pull-access.test.sh
          bash scripts/tests/validate-ghcr-image-reference.test.sh
          bash scripts/tests/validate-ghcr-image-platform.test.sh
          bash scripts/tests/cleanup-k3s-images.test.sh
          bash scripts/tests/restart-blocked-image-pulls.test.sh
          bash scripts/tests/decommission-stock-media-namespaces.test.sh
          bash scripts/tests/verify-retired-production-manifests.test.sh
          bash scripts/tests/prepare-cert-manager-manifest-auth.test.sh
          bash scripts/tests/namespace-storage-snapshot-refs.test.sh
          bash scripts/tests/verify-media-runner-retired.test.sh
          python3 scripts/verify-reconcile-lane-queue.py --self-test
          python3 scripts/verify-scheduled-run-result.py --self-test
          python3 scripts/verify-gitops-ready-dispatch.py --self-test
          python3 scripts/verify-gitops-ready-image-refs.py --self-test
          python3 scripts/verify-tce-schedule-delivery.py --self-test
          python3 scripts/verify-native-schedule-gap.py --self-test
          python3 scripts/verify-tce-heartbeat-receipts.py --self-test
          bash scripts/tests/verify-auth-publisher-run.test.sh
          bash scripts/tests/verify-auth-dispatch-payload.test.sh
          bash scripts/tests/verify-tce-dispatch-payload.test.sh
          bash scripts/tests/verify-tce-microfe-dispatch-payload.test.sh
          bash scripts/tests/verify-tce-publisher-run.test.sh
          bash scripts/tests/verify-tce-microfe-publisher-run.test.sh
          python3 scripts/promote-tce-image-digests.py --self-test
          python3 scripts/resolve-tce-gitops-image-refs.py --self-test
          bash scripts/tests/inspect-vps-cri-contract.test.sh
          bash scripts/guard-reconcile-images.sh --self-test

      - name: Test path-scoped push deployment resolution
        run: bash scripts/resolve-push-deployment-scope.sh --self-test

      - name: Run immutable image-change contract tests
        run: python3 scripts/validate-image-change-contract.py --self-test

      - name: Run workflow contract checks
        run: python3 scripts/validate-workflow-contracts.py
