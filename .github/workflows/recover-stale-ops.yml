name: Recover Stale Scheduled Ops
run-name: >-
  ${{ format(
    'Recover Stale Scheduled Ops — {0} / source {1}{2}',
    github.event_name,
    inputs.source_run_id || github.event.client_payload.source_run_id || github.event.workflow_run.id || 'none',
    github.event_name == 'repository_dispatch' && format(' / {0}', github.event.client_payload.source_workflow_path) || ''
  ) }}

'on':
  schedule:
    - cron: "10,25,40,55 * * * *"
  # Bootstrap recovery after deployment-contract changes even if schedule delivery is stale.
  push:
    branches: [master]
    paths:
      - "apps/**"
      - "!apps/**/*.md"
      - '!apps/tce-vps-control-mcp/**'
      - "platform/**"
      - '!platform/keycloak/**/*.md'
      - "environments/prod/**"
      - "scripts/**"
      # VPS inspection is read-only; its own push/schedule workflow owns snapshot refresh.
      - "!scripts/inspect-vps.sh"
      # Read-only CI/watchdog helpers must not trigger a production reconcile.
      - "!scripts/verify-tce-schedule-delivery.py"
      - "!scripts/verify-native-schedule-gap.py"
      - "!scripts/verify-tce-heartbeat-receipts.py"
      - "!scripts/verify-scheduled-run-result.py"
      - "!scripts/verify-gitops-ready-dispatch.py"
      - "!scripts/verify-gitops-ready-image-refs.py"
      - "!scripts/verify-reconcile-lane-queue.py"
      - "!scripts/validate-workflow-contracts.py"
      - "!scripts/validate-network-boundaries.sh"
      - "!scripts/validate-auth-gitops-contract.py"
      - "!scripts/validate-vps-control-mcp-contract.py"
      # Scope-resolver edits affect future push routing, not current cluster state.
      - "!scripts/resolve-push-deployment-scope.sh"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Optional completed reconcile-vps run to wait for before inspection recovery
        required: false
        type: string
      source_head_sha:
        description: Full source SHA for source_run_id verification
        required: false
        type: string
  workflow_run:
    workflows:
      - "reconcile-vps"
      - "inspect-vps"
      - "Reconcile Schedule Freshness Watchdog"
    types: [completed]
  # Independent heartbeat from TCE's scheduled WF-06/WF-07/WF-12 checks.
  repository_dispatch:
    types: [tce-schedule-heartbeat]

permissions:
  actions: write
  contents: read

# Keep native schedule recovery independent from completed-run diagnostics and TCE heartbeats.
# Non-schedule recovery triggers remain serialized with each other.
concurrency:
  group: scheduled-ops-delivery-recovery-${{ github.event_name == 'schedule' && 'schedule' || 'diagnostic' }}
  cancel-in-progress: false

jobs:
  recover:
    # GitHub reruns preserve the original event; only attempt 1 is native schedule evidence.
    # workflow_run payloads expose workflow_run.workflow_id, not a top-level workflow.path.
    # Repository-scoped IDs keep source filtering stable despite dynamic run names.
    # reconcile-vps=364209709; inspect-vps=364209707; watchdog=402675709.
    if: >-
      ${{ github.ref == 'refs/heads/master' &&
          github.run_attempt == 1 &&
          (github.event_name != 'workflow_run' ||
           (github.event.workflow_run.head_branch == 'master' &&
            github.event.workflow_run.run_attempt == 1 &&
            (github.event.workflow_run.workflow_id == 364209709 ||
             (github.event.workflow_run.workflow_id == 364209707 &&
              github.event.workflow_run.event == 'schedule') ||
             (github.event.workflow_run.workflow_id == 402675709 &&
              github.event.workflow_run.event == 'schedule' &&
              github.event.workflow_run.conclusion == 'failure')))) &&
          (github.event_name != 'repository_dispatch' ||
           (github.event.action == 'tce-schedule-heartbeat' &&
            github.event.client_payload.source_repository == 'phanthienquoc/TCE-dashboard' &&
            github.event.client_payload.source_event == 'schedule' &&
            github.event.client_payload.source_run_attempt == '1' &&
            github.event.client_payload.heartbeat_run_attempt == '1' &&
            (github.event.client_payload.source_workflow_path == '.github/workflows/wf-06-tce-healthcheck.yml' ||
             github.event.client_payload.source_workflow_path == '.github/workflows/wf-07-tce-integration-check.yml' ||
             github.event.client_payload.source_workflow_path == '.github/workflows/wf-12-tce-healthcheck-schedule-watchdog.yml'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_RECONCILE_AGE_MINUTES: "20"
      MAX_INSPECTION_AGE_MINUTES: "75"
    steps:
      - name: Validate external TCE schedule heartbeat payload
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_EVENT: ${{ github.event.client_payload.source_event }}
          SOURCE_WORKFLOW_PATH: ${{ github.event.client_payload.source_workflow_path }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.client_payload.source_run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.client_payload.source_head_sha }}
          HEARTBEAT_RUN_ID: ${{ github.event.client_payload.heartbeat_run_id }}
          HEARTBEAT_RUN_ATTEMPT: ${{ github.event.client_payload.heartbeat_run_attempt }}
          HEARTBEAT_HEAD_SHA: ${{ github.event.client_payload.heartbeat_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPOSITORY" == "phanthienquoc/TCE-dashboard" ]] || {
            echo "::error::Unexpected external heartbeat repository."
            exit 1
          }
          [[ "$SOURCE_EVENT" == "schedule" ]] || {
            echo "::error::External heartbeat must originate from a scheduled TCE event."
            exit 1
          }
          case "$SOURCE_WORKFLOW_PATH" in
            .github/workflows/wf-06-tce-healthcheck.yml|\
            .github/workflows/wf-07-tce-integration-check.yml|\
            .github/workflows/wf-12-tce-healthcheck-schedule-watchdog.yml) ;;
            *) echo "::error::Unapproved TCE heartbeat workflow path."; exit 1 ;;
          esac
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ && "$HEARTBEAT_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::TCE heartbeat run IDs must be numeric."
            exit 1
          }
          if ! [[ "$SOURCE_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || ! [[ "$HEARTBEAT_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "::error::TCE heartbeat run attempts must be numeric."
            exit 1
          fi
          if [[ "$SOURCE_RUN_ATTEMPT" != "1" || "$HEARTBEAT_RUN_ATTEMPT" != "1" ]]; then
            echo "::error::Rerun attempts cannot be accepted as native schedule heartbeats."
            exit 1
          fi
          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$HEARTBEAT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::TCE heartbeat SHAs must be full commit IDs."
            exit 1
          }

          # Validate both run IDs against the public source repository's Actions API.
          # Payload fields alone are not proof that a scheduled TCE run actually exists.
          fetch_tce_run() {
            # Retry transient 5xx/transport failures with a bounded window; permanent 4xx still fail closed.
            curl --fail --silent --show-error --retry 4 --retry-delay 2 --retry-max-time 45 --max-time 15 --retry-connrefused \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$SOURCE_REPOSITORY/actions/runs/$1"
          }

          source_run="$(fetch_tce_run "$SOURCE_RUN_ID")"
          source_run_path="$(jq -r '.path // empty' <<< "$source_run")"
          source_run_event="$(jq -r '.event // empty' <<< "$source_run")"
          source_run_branch="$(jq -r '.head_branch // empty' <<< "$source_run")"
          source_run_sha="$(jq -r '.head_sha // empty' <<< "$source_run")"
          source_run_attempt="$(jq -r '.run_attempt // empty' <<< "$source_run")"
          source_run_status="$(jq -r '.status // empty' <<< "$source_run")"

          [[ "$source_run_path" == "$SOURCE_WORKFLOW_PATH" ]] || {
            echo "::error::TCE source run #$SOURCE_RUN_ID does not match the payload workflow path."
            exit 1
          }
          [[ "$source_run_event" == "schedule" && "$source_run_branch" == "master" && "$source_run_sha" == "$SOURCE_HEAD_SHA" ]] || {
            echo "::error::TCE source run #$SOURCE_RUN_ID is not the claimed scheduled master commit."
            exit 1
          }
          [[ "$source_run_attempt" == "1" && "$source_run_attempt" == "$SOURCE_RUN_ATTEMPT" ]] || {
            echo "::error::TCE source run #$SOURCE_RUN_ID is a rerun or its attempt does not match the payload."
            exit 1
          }

          case "$SOURCE_WORKFLOW_PATH" in
            .github/workflows/wf-12-tce-healthcheck-schedule-watchdog.yml)
              [[ "$SOURCE_RUN_ID" == "$HEARTBEAT_RUN_ID" && "$SOURCE_HEAD_SHA" == "$HEARTBEAT_HEAD_SHA" ]] || {
                echo "::error::Direct WF-12 schedule heartbeat must identify the same source and heartbeat run."
                exit 1
              }
              [[ "$source_run_status" == "in_progress" || "$source_run_status" == "completed" ]] || {
                echo "::error::Direct WF-12 schedule run has an unexpected status: $source_run_status."
                exit 1
              }
              heartbeat_run="$source_run"
              ;;
            .github/workflows/wf-06-tce-healthcheck.yml|.github/workflows/wf-07-tce-integration-check.yml)
              [[ "$source_run_status" == "completed" ]] || {
                echo "::error::WF-06/WF-07 heartbeat source must be completed before forwarding."
                exit 1
              }
              heartbeat_run="$(fetch_tce_run "$HEARTBEAT_RUN_ID")"
              ;;
          esac

          heartbeat_run_path="$(jq -r '.path // empty' <<< "$heartbeat_run")"
          heartbeat_run_event="$(jq -r '.event // empty' <<< "$heartbeat_run")"
          heartbeat_run_branch="$(jq -r '.head_branch // empty' <<< "$heartbeat_run")"
          heartbeat_run_sha="$(jq -r '.head_sha // empty' <<< "$heartbeat_run")"
          heartbeat_run_attempt="$(jq -r '.run_attempt // empty' <<< "$heartbeat_run")"
          heartbeat_run_status="$(jq -r '.status // empty' <<< "$heartbeat_run")"

          [[ "$heartbeat_run_path" == ".github/workflows/wf-12-tce-healthcheck-schedule-watchdog.yml" ]] || {
            echo "::error::Heartbeat run #$HEARTBEAT_RUN_ID is not the TCE WF-12 watchdog."
            exit 1
          }
          [[ "$heartbeat_run_branch" == "master" && "$heartbeat_run_sha" == "$HEARTBEAT_HEAD_SHA" ]] || {
            echo "::error::TCE heartbeat run #$HEARTBEAT_RUN_ID does not match the claimed master SHA."
            exit 1
          }
          [[ "$heartbeat_run_status" == "in_progress" || "$heartbeat_run_status" == "completed" ]] || {
            echo "::error::TCE heartbeat run #$HEARTBEAT_RUN_ID has an unexpected status: $heartbeat_run_status."
            exit 1
          }
          [[ "$heartbeat_run_attempt" == "1" && "$heartbeat_run_attempt" == "$HEARTBEAT_RUN_ATTEMPT" ]] || {
            echo "::error::TCE heartbeat run #$HEARTBEAT_RUN_ID is a rerun or its attempt does not match the payload."
            exit 1
          }

          case "$SOURCE_WORKFLOW_PATH" in
            .github/workflows/wf-12-tce-healthcheck-schedule-watchdog.yml)
              [[ "$heartbeat_run_event" == "schedule" ]] || {
                echo "::error::Direct WF-12 heartbeat run must have event=schedule."
                exit 1
              }
              ;;
            .github/workflows/wf-06-tce-healthcheck.yml|.github/workflows/wf-07-tce-integration-check.yml)
              [[ "$heartbeat_run_event" == "workflow_run" ]] || {
                echo "::error::WF-06/WF-07 heartbeat must be forwarded by a WF-12 workflow_run."
                exit 1
              }
              ;;
          esac

          printf 'Verified TCE schedule heartbeat: source=%s run=%s attempt=%s sha=%s heartbeat_run=%s attempt=%s event=%s\\n' \
            "$SOURCE_WORKFLOW_PATH" "$SOURCE_RUN_ID" \
            "$SOURCE_RUN_ATTEMPT" "$SOURCE_HEAD_SHA" \
            "$HEARTBEAT_RUN_ID" "$HEARTBEAT_RUN_ATTEMPT" \
            "$heartbeat_run_event"

      - name: Verify and await source reconciliation completion
        id: source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id != '' }}
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_HEAD_SHA: ${{ inputs.source_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::source_run_id must be a numeric GitHub Actions run id."
            exit 1
          }
          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_head_sha must be a full 40-character commit SHA."
            exit 1
          }
          for attempt in $(seq 1 12); do
            source_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
            source_path="$(jq -r '.path // empty' <<< "$source_run")"
            source_branch="$(jq -r '.head_branch // empty' <<< "$source_run")"
            source_sha="$(jq -r '.head_sha // empty' <<< "$source_run")"
            source_status="$(jq -r '.status // empty' <<< "$source_run")"
            if [[ "$source_path" != ".github/workflows/reconcile-vps.yml" ||
                  "$source_branch" != "master" ||
                  "$source_sha" != "$SOURCE_HEAD_SHA" ]]; then
              echo "::error::Source run identity does not match the expected master reconcile-vps workflow and SHA."
              exit 1
            fi
            if [[ "$source_status" == "completed" ]]; then
              conclusion="$(jq -r '.conclusion // "unknown"' <<< "$source_run")"
              source_completed_at="$(jq -r '.updated_at // empty' <<< "$source_run")"
              [[ -n "$source_completed_at" ]] || {
                echo "::error::Completed source reconciliation has no updated_at timestamp."
                exit 1
              }
              echo "completed_at=$source_completed_at" >> "$GITHUB_OUTPUT"
              echo "Verified source reconciliation #$SOURCE_RUN_ID completed with conclusion=$conclusion at $source_completed_at."
              exit 0
            fi
            echo "Waiting for source reconciliation #$SOURCE_RUN_ID to complete (attempt $attempt/12; status=$source_status)."
            sleep 5
          done
          echo "::error::Source reconciliation #$SOURCE_RUN_ID did not complete within 60 seconds."
          exit 1

      - name: Observe schedule watchdog workflow state
        id: watchdog-state
        shell: bash
        run: |
          set -euo pipefail
          if ! workflow="$(gh api -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/reconcile-schedule-watchdog.yml")"; then
            echo "state=unavailable" >> "$GITHUB_OUTPUT"
            echo "::warning::Unable to read schedule watchdog workflow state; continuing recovery."
            echo "::warning::Native watchdog coverage is not verified."
            exit 0
          fi

          state="$(jq -r '.state // empty' <<< "$workflow" 2>/dev/null || true)"
          echo "state=${state:-missing}" >> "$GITHUB_OUTPUT"
          if [[ "$state" != "active" ]]; then
            echo "::warning::Schedule freshness watchdog is not active (state=${state:-missing})."
            echo "::warning::Continuing recovery, but native watchdog coverage is unavailable."
            exit 0
          fi
          echo "Schedule freshness watchdog state: active"

      - name: Resolve GitHub Actions API reference clock
        id: clock
        env:
          SOURCE_COMPLETED_AT: ${{ steps.source.outputs.completed_at }}
        shell: bash
        run: |
          set -euo pipefail
          current_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          reference_at="$(jq -r '.updated_at // .run_started_at // .created_at // empty' <<< "$current_run")"
          reference_epoch="$(
            jq -r 'if (.updated_at // .run_started_at // .created_at) then
              ((.updated_at // .run_started_at // .created_at) | fromdateiso8601)
            else empty end' <<< "$current_run"
          )"
          [[ -n "$reference_at" && -n "$reference_epoch" ]] || {
            echo "::error::Unable to resolve current recovery run timestamp from the Actions API."
            exit 1
          }
          if [[ -n "$SOURCE_COMPLETED_AT" ]]; then
            source_epoch="$(jq -nr --arg timestamp "$SOURCE_COMPLETED_AT" '$timestamp | fromdateiso8601')"
            if (( source_epoch > reference_epoch )); then
              reference_at="$SOURCE_COMPLETED_AT"
              reference_epoch="$source_epoch"
            fi
          fi
          echo "reference_at=$reference_at" >> "$GITHUB_OUTPUT"
          echo "reference_epoch=$reference_epoch" >> "$GITHUB_OUTPUT"
          echo "Recovery reference clock: $reference_at (GitHub Actions API; includes completed source run when newer)."

      - name: Recover missing reconciliation delivery
        id: reconcile
        env:
          REFERENCE_AT: ${{ steps.clock.outputs.reference_at }}
          REFERENCE_EPOCH: ${{ steps.clock.outputs.reference_epoch }}
        shell: bash
        run: |
          set -euo pipefail
          workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/reconcile-vps.yml")"
          state="$(jq -r '.state // empty' <<< "$workflow")"
          [[ "$state" == "active" ]] || {
            echo "::error::reconcile-vps is not active (state=${state:-missing}); refusing to dispatch."
            exit 1
          }

          runs="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" -F branch=master -F per_page=100)"
          latest="$(
            jq -c \
              --arg workflow_path ".github/workflows/reconcile-vps.yml" \
              '[
                .workflow_runs[]
                | select(.path == $workflow_path and .head_branch == "master")
              ]
              | sort_by(.created_at)
              | last // empty' <<< "$runs"
          )"
          if [[ -z "$latest" ]]; then
            age_seconds=$((MAX_RECONCILE_AGE_MINUTES * 60 + 1))
            latest_id="none"
          else
            latest_id="$(jq -r '.id' <<< "$latest")"
            status="$(jq -r '.status // empty' <<< "$latest")"
            if [[ "$status" != "completed" ]]; then
              echo "Reconciliation run #$latest_id is $status; avoiding duplicate reconciliation/inspection dispatches."
              echo "busy=true" >> "$GITHUB_OUTPUT"
              echo "dispatched=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            activity_at="$(jq -r '.updated_at // .run_started_at // .created_at' <<< "$latest")"
            activity_epoch="$(jq -r '(.updated_at // .run_started_at // .created_at) | fromdateiso8601' <<< "$latest")"
            age_seconds=$((REFERENCE_EPOCH - activity_epoch))
            (( age_seconds >= 0 )) || {
              echo "::error::Reconciliation activity timestamp is newer than the recovery API clock."
              exit 1
            }
            echo "Latest master reconciliation run #$latest_id: last_activity=$activity_at, age=$((age_seconds / 60))m."
          fi

          if (( age_seconds <= MAX_RECONCILE_AGE_MINUTES * 60 )); then
            echo "Reconciliation delivery is recent; no fallback dispatch needed."
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          dispatch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)"
          [[ "$dispatch_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Unable to resolve the exact master SHA for reconciliation dispatch."
            exit 1
          }
          echo "::warning::No recent master reconciliation run; dispatching the existing GitOps authority in its scheduled apply mode."
          echo "Dispatch payload: ref=master sha=$dispatch_sha mode=apply target_app=all"
          gh workflow run reconcile-vps.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f mode=apply \
            -f target_app=all

          dispatched_run=""
          for attempt in $(seq 1 6); do
            if ! response="$(
              gh api -X GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/reconcile-vps.yml/runs" \
                -f event=workflow_dispatch -F branch=master -F per_page=100 2>&1
            )"; then
              if grep -Eq 'HTTP (500|502|503|504)' <<< "$response"; then
                retry_delay=$((attempt * 5))
                echo "::warning::Transient GitHub HTTP 5xx while correlating reconciliation dispatch (attempt $attempt/6); retrying in ${retry_delay}s."
                sleep "$retry_delay"
                continue
              fi
              echo "::error::GitHub Actions API failed while correlating reconciliation dispatch; refusing to report success." >&2
              printf '%s\n' "$response" >&2
              exit 1
            fi
            if ! dispatched_run="$(
              jq -c --arg started "$REFERENCE_AT" --arg sha "$dispatch_sha" \
                '[.workflow_runs[] | select(
                  .event == "workflow_dispatch"
                  and .head_branch == "master"
                  and .head_sha == $sha
                  and .created_at >= $started
                )] | sort_by(.created_at) | last // empty' \
                <<< "$response"
            )"; then
              echo "::error::GitHub Actions API returned malformed reconciliation run history; refusing to report success." >&2
              exit 1
            fi
            if [[ -n "$dispatched_run" ]]; then
              run_id="$(jq -r '.id' <<< "$dispatched_run")"
              run_url="$(jq -r '.html_url' <<< "$dispatched_run")"
              echo "Verified fallback reconciliation dispatch: #$run_id $run_url"
              echo "dispatched=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for reconciliation workflow_dispatch correlation (attempt $attempt/6)..."
            sleep 5
          done
          echo "::error::GitHub did not create a master workflow_dispatch run for reconcile-vps after the recovery request."
          exit 1

      - name: Recover missing inspection delivery
        if: ${{ steps.reconcile.outputs.dispatched != 'true' && steps.reconcile.outputs.busy != 'true' }}
        env:
          REFERENCE_AT: ${{ steps.clock.outputs.reference_at }}
          REFERENCE_EPOCH: ${{ steps.clock.outputs.reference_epoch }}
        shell: bash
        run: |
          set -euo pipefail
          workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/inspect-vps.yml")"
          state="$(jq -r '.state // empty' <<< "$workflow")"
          [[ "$state" == "active" ]] || {
            echo "::error::inspect-vps is not active (state=${state:-missing}); refusing to dispatch."
            exit 1
          }

          # Native schedule evidence and read-only fallback activity are separate signals.
          # A recent workflow_dispatch must never be treated as a native cron delivery.
          native_runs="$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/inspect-vps.yml/runs" \
            -f event=schedule -F branch=master -F per_page=100)"
          native_latest="$(jq -c '.workflow_runs | sort_by(.created_at) | last // empty' <<< "$native_runs")"
          native_age_seconds=$((MAX_INSPECTION_AGE_MINUTES * 60 + 1))
          native_latest_id="none"

          if [[ -n "$native_latest" ]]; then
            native_latest_id="$(jq -r '.id' <<< "$native_latest")"
            native_status="$(jq -r '.status // empty' <<< "$native_latest")"
            if [[ "$native_status" != "completed" ]]; then
              echo "Native scheduled inspection #$native_latest_id is $native_status; avoiding a duplicate fallback."
              exit 0
            fi

            native_conclusion="$(jq -r '.conclusion // "unknown"' <<< "$native_latest")"
            native_created_at="$(jq -r '.created_at // empty' <<< "$native_latest")"
            native_created_epoch="$(jq -r 'if .created_at then (.created_at | fromdateiso8601) else empty end' <<< "$native_latest")"
            [[ -n "$native_created_at" && "$native_created_epoch" =~ ^[0-9]+$ ]] || {
              echo "::error::Latest native scheduled inspection #$native_latest_id has no usable created_at timestamp."
              exit 1
            }
            native_age_seconds=$((REFERENCE_EPOCH - native_created_epoch))
            (( native_age_seconds >= 0 )) || {
              echo "::error::Native scheduled inspection #$native_latest_id is newer than the recovery API clock."
              exit 1
            }
            if [[ "$native_conclusion" != "success" ]]; then
              echo "::warning::Latest native scheduled inspection #$native_latest_id concluded $native_conclusion."
              native_age_seconds=$((MAX_INSPECTION_AGE_MINUTES * 60 + 1))
            else
              echo "Latest native scheduled inspection #$native_latest_id: age=$((native_age_seconds / 60))m conclusion=$native_conclusion."
            fi
          else
            echo "::warning::No native scheduled inspect-vps run is available in GitHub Actions history."
          fi

          if (( native_age_seconds <= MAX_INSPECTION_AGE_MINUTES * 60 )); then
            echo "Native scheduled inspection is fresh; no fallback dispatch needed."
            exit 0
          fi

          printf '%s\n' \
            "::warning::Native inspection schedule remains stale (latest native run #$native_latest_id);" \
            "checking read-only fallback activity separately."

          fallback_runs="$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/inspect-vps.yml/runs" \
            -f event=workflow_dispatch -F branch=master -F per_page=100)"
          fallback_latest="$(jq -c '.workflow_runs | sort_by(.created_at) | last // empty' <<< "$fallback_runs")"
          if [[ -n "$fallback_latest" ]]; then
            fallback_id="$(jq -r '.id' <<< "$fallback_latest")"
            fallback_status="$(jq -r '.status // empty' <<< "$fallback_latest")"
            if [[ "$fallback_status" != "completed" ]]; then
              printf '%s\n' \
                "Recent read-only workflow_dispatch fallback #$fallback_id is $fallback_status;" \
                "avoiding a duplicate fallback. Native schedule remains stale."
              exit 0
            fi

            fallback_conclusion="$(jq -r '.conclusion // "unknown"' <<< "$fallback_latest")"
            if [[ "$fallback_conclusion" == "success" ]]; then
              fallback_activity_epoch="$(jq -r \
                '(.updated_at // .run_started_at // .created_at // empty) | fromdateiso8601' \
                <<< "$fallback_latest")"
              [[ "$fallback_activity_epoch" =~ ^[0-9]+$ ]] || {
                echo "::error::Read-only fallback inspection #$fallback_id has no usable activity timestamp."
                exit 1
              }
              fallback_age_seconds=$((REFERENCE_EPOCH - fallback_activity_epoch))
              (( fallback_age_seconds >= 0 )) || {
                echo "::error::Read-only fallback inspection #$fallback_id is newer than the recovery API clock."
                exit 1
              }
              if (( fallback_age_seconds <= MAX_INSPECTION_AGE_MINUTES * 60 )); then
                printf '%s\n' \
                  "Recent workflow_dispatch inspection fallback #$fallback_id is fresh (age=$((fallback_age_seconds / 60))m);" \
                  "no duplicate fallback needed. Native schedule remains stale and the watchdog must continue to report it."
                exit 0
              fi
            else
              printf '%s\n' \
                "::warning::Latest read-only workflow_dispatch fallback #$fallback_id concluded $fallback_conclusion;" \
                "a new fallback will be attempted."
            fi
          fi

          dispatch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)"
          [[ "$dispatch_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Unable to resolve the exact master SHA for inspection dispatch."
            exit 1
          }
          printf '%s\n' \
            "::warning::No fresh read-only inspection fallback exists while native schedule evidence is stale;" \
            "dispatching the existing read-only inspection workflow."
          echo "Dispatch payload: ref=master sha=$dispatch_sha (no inputs)"

          # GitHub occasionally returns HTTP 5xx for workflow dispatch requests.
          # Retry only those transient server errors; do not retry permission or payload failures.
          dispatch_succeeded=false
          for attempt in 1 2 3; do
            if dispatch_output="$(gh workflow run inspect-vps.yml --repo "$GITHUB_REPOSITORY" --ref master 2>&1)"; then
              printf '%s\n' "$dispatch_output"
              dispatch_succeeded=true
              break
            else
              dispatch_status=$?
              printf '%s\n' "$dispatch_output"
              if grep -Eq 'HTTP (500|502|503|504)' <<< "$dispatch_output" && (( attempt < 3 )); then
                delay_seconds=$((attempt * 10))
                echo "::warning::Transient GitHub HTTP 5xx during inspection dispatch (attempt $attempt/3); retrying in ${delay_seconds}s."
                sleep "$delay_seconds"
                continue
              fi
              echo "::error::Inspection dispatch failed without a retryable HTTP 5xx response."
              exit "$dispatch_status"
            fi
          done
          [[ "$dispatch_succeeded" == true ]] || {
            echo "::error::Inspection workflow dispatch did not succeed after retries."
            exit 1
          }

          dispatched_run=""
          for attempt in $(seq 1 6); do
            if ! response="$(
              gh api -X GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/inspect-vps.yml/runs" \
                -f event=workflow_dispatch -F branch=master -F per_page=100 2>&1
            )"; then
              if grep -Eq 'HTTP (500|502|503|504)' <<< "$response"; then
                retry_delay=$((attempt * 5))
                echo "::warning::Transient GitHub HTTP 5xx while correlating inspection dispatch (attempt $attempt/6); retrying in ${retry_delay}s."
                sleep "$retry_delay"
                continue
              fi
              echo "::error::GitHub Actions API failed while correlating inspection dispatch; refusing to report success." >&2
              printf '%s\n' "$response" >&2
              exit 1
            fi
            if ! dispatched_run="$(
              jq -c --arg started "$REFERENCE_AT" --arg sha "$dispatch_sha" \
                '[.workflow_runs[] | select(
                  .event == "workflow_dispatch"
                  and .head_branch == "master"
                  and .head_sha == $sha
                  and .created_at >= $started
                )] | sort_by(.created_at) | last // empty' \
                <<< "$response"
            )"; then
              echo "::error::GitHub Actions API returned malformed inspection run history; refusing to report success." >&2
              exit 1
            fi
            if [[ -n "$dispatched_run" ]]; then
              run_id="$(jq -r '.id' <<< "$dispatched_run")"
              run_url="$(jq -r '.html_url' <<< "$dispatched_run")"
              echo "Verified read-only workflow_dispatch fallback: #$run_id $run_url (does not satisfy native schedule freshness)."
              exit 0
            fi
            echo "Waiting for inspection workflow_dispatch correlation (attempt $attempt/6)..."
            sleep 5
          done
          echo "::error::GitHub did not create a master workflow_dispatch run for inspect-vps after the recovery request."
          exit 1
