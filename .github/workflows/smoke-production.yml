name: smoke-production

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Read-only TCE/Auth production smoke scope
        required: true
        default: tce-dashboard
        type: choice
        options:
          - tce-dashboard
          - all

permissions:
  contents: read

concurrency:
  group: platform-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run allowlisted production smoke checks
        env:
          SMOKE_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          test -x ops/scripts/smoke.sh || chmod +x ops/scripts/smoke.sh
          ./ops/scripts/smoke.sh "$SMOKE_SCOPE"

      - name: Publish smoke summary
        env:
          SMOKE_SCOPE: ${{ inputs.scope }}
        run: |
          {
            echo "## Production smoke validation"
            echo
            echo "- Scope: \`$SMOKE_SCOPE\`"
            echo "- Mode: read-only HTTP checks"
            echo "- Production mutation: none"
            echo "- Endpoints: repository-allowlisted production URLs only"
          } >> "$GITHUB_STEP_SUMMARY"
