# yamllint disable rule:line-length
name: reconcile-microfe

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: "Reconciliation mode"
        required: true
        default: apply
        type: choice
        options:
          - plan
          - apply
      allow_image_changes:
        description: "Allow deliberate MicroFE image replacement"
        required: true
        default: false
        type: boolean
  push:
    branches: [master]
    paths:
      - .github/workflows/reconcile-microfe.yml
  repository_dispatch:
    types:
      - microfe-images-published

permissions:
  contents: read
  packages: read

concurrency:
  group: platform-microfe-reconcile-v2
  cancel-in-progress: false

env:
  RECONCILE_MODE: ${{ github.event_name == 'repository_dispatch' && 'apply' || github.event.inputs.mode || 'apply' }}
  ALLOW_IMAGE_CHANGES: ${{ github.event_name == 'repository_dispatch' || github.event.inputs.allow_image_changes == 'true' }}

jobs:
  reconcile:
    if: ${{ github.ref == 'refs/heads/master' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure SSH and K3s tunnel
        env:
          KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/tce_vps_key
          chmod 600 ~/.ssh/tce_vps_key
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@132.226.175.206 'sudo test -r /etc/rancher/k3s/k3s.yaml'
          ssh -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no ubuntu@132.226.175.206 'sudo cat /etc/rancher/k3s/k3s.yaml' > /tmp/k3s.yaml
          sed -i 's#https://127.0.0.1:6443#https://127.0.0.1:6443#' /tmp/k3s.yaml
          chmod 600 /tmp/k3s.yaml
          ssh -fNT -i ~/.ssh/tce_vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -L 6443:127.0.0.1:6443 ubuntu@132.226.175.206
          echo "KUBECONFIG=/tmp/k3s.yaml" >> "$GITHUB_ENV"

      - name: Provision MicroFE Auth Supabase credentials
        if: ${{ env.RECONCILE_MODE == 'apply' }}
        run: |
          set -euo pipefail
          kubectl apply -f platform/microfe/namespace.yaml
          # The DB/API credentials are sourced from TCE's existing runtime Secret;
          # the MFA encryption key remains sourced from the existing tce-auth Secret.
          kubectl -n tce-prod get secret tce-app-secrets -o json |
            jq -e '{
              apiVersion: "v1",
              kind: "Secret",
              metadata: {name: "microfe-auth-secrets", namespace: "microfe-platform"},
              type: "Opaque",
              data: {
                SUPABASE_URL: .data.SUPABASE_URL,
                SUPABASE_SERVICE_ROLE_KEY: .data.SUPABASE_SERVICE_ROLE_KEY,
                JWT_SECRET: .data.JWT_SECRET
              }
            } | select(.data.SUPABASE_URL != null and .data.SUPABASE_SERVICE_ROLE_KEY != null and .data.JWT_SECRET != null)' |
            kubectl apply -f -
          kubectl -n tce-prod get secret tce-auth -o json |
            jq -e '{
              apiVersion: "v1",
              kind: "Secret",
              metadata: {name: "microfe-auth-secrets", namespace: "microfe-platform"},
              type: "Opaque",
              data: {MFA_ENCRYPTION_KEY: .data.MFA_ENCRYPTION_KEY}
            } | select(.data.MFA_ENCRYPTION_KEY != null)' |
            kubectl apply --server-side --force-conflicts -f -
          echo "MicroFE Auth runtime secret keys reconciled from existing TCE Kubernetes Secrets."
      
      - name: Promote published MicroFE images
        if: ${{ github.event_name == 'repository_dispatch' && env.RECONCILE_MODE == 'apply' }}
        env:
          AUTH_DIGEST: ${{ github.event.client_payload.auth_digest }}
          SHELL_DIGEST: ${{ github.event.client_payload.shell_digest }}
          WS_DIGEST: ${{ github.event.client_payload.ws_digest }}
        run: |
          set -euo pipefail
          for digest in "$AUTH_DIGEST" "$SHELL_DIGEST" "$WS_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Invalid MicroFE image digest: $digest"; exit 1; }
          done
          cat >> environments/prod/kustomization.yaml <<EOF

          images:
          - name: ghcr.io/phanthienquoc/microfe-auth
            newName: ghcr.io/phanthienquoc/microfe-auth
            digest: $AUTH_DIGEST
          - name: ghcr.io/phanthienquoc/microfe-shell
            newName: ghcr.io/phanthienquoc/microfe-shell
            digest: $SHELL_DIGEST
          - name: ghcr.io/phanthienquoc/microfe-ws
            newName: ghcr.io/phanthienquoc/microfe-ws
            digest: $WS_DIGEST
          EOF

      - name: Validate MicroFE immutable image policy
        if: ${{ env.RECONCILE_MODE == 'apply' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            rendered="$(kubectl kustomize environments/prod)"
            printf '%s\n' "$rendered" | grep -Eq 'ghcr.io/phanthienquoc/microfe-auth@sha256:[0-9a-f]{64}'
            printf '%s\n' "$rendered" | grep -Eq 'ghcr.io/phanthienquoc/microfe-shell@sha256:[0-9a-f]{64}'
            printf '%s\n' "$rendered" | grep -Eq 'ghcr.io/phanthienquoc/microfe-ws@sha256:[0-9a-f]{64}'
            echo "Validated explicit MicroFE image promotion."
            exit 0
          fi
          auth_image="$(sudo /usr/local/sbin/platform-kubectl -n microfe-platform get deployment microfe-auth -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          shell_image="$(sudo /usr/local/sbin/platform-kubectl -n microfe-platform get deployment microfe-shell -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          ws_image="$(sudo /usr/local/sbin/platform-kubectl -n microfe-platform get deployment microfe-ws -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"

          for image in "$auth_image" "$shell_image" "$ws_image"; do
            [ -n "$image" ] || continue
            case "$image" in
              ghcr.io/phanthienquoc/microfe-auth:[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*|ghcr.io/phanthienquoc/microfe-shell:[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*|ghcr.io/phanthienquoc/microfe-ws:[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*)
                ;;
              *)
                echo "::error::Mutable or unexpected MicroFE image: $image"
                echo "::error::Promote an immutable Git-SHA image before reconcile."
                exit 1
                ;;
            esac
          done

      - name: Configure GHCR pull credentials
        if: ${{ env.RECONCILE_MODE == 'apply' }}
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          GHCR_TOKEN: ${{ secrets['Platform-infra-token'] || secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GHCR_TOKEN"
          kubectl -n microfe-platform create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n microfe-platform patch serviceaccount default \
            --type='merge' \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      - name: Reconcile MicroFE
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$RECONCILE_MODE" = "apply" ] && [ "$ALLOW_IMAGE_CHANGES" != "true" ]; then
            echo "Workflow-only push: GHCR credentials are already reconciled; skip workload mutation."
            exit 0
          fi
          if [ "$RECONCILE_MODE" = "apply" ] && [ "$ALLOW_IMAGE_CHANGES" != "true" ]; then
            echo "::error::Apply blocked: ALLOW_IMAGE_CHANGES is false."
            echo "::error::Use the image-promotion path or explicitly authorize a deliberate image change."
            exit 1
          fi
          for namespace_manifest in \
            platform/microfe/namespace.yaml \
            apps/stockdividend/base/namespace.yaml \
            apps/tce-dashboard/base/namespace.yaml \
            apps/media-generation/base/namespace.yaml; do
            echo "== Ensuring namespace from $namespace_manifest =="
            kubectl apply -f "$namespace_manifest"
          done

          set +e
          kubectl diff -k environments/prod
          diff_rc=$?
          set -e

          case "$RECONCILE_MODE:$diff_rc" in
            plan:0|apply:0)
              echo "Kubernetes state matches the repository."
              ;;
            plan:1)
              echo "Kubernetes drift detected."
              exit 1
              ;;
            apply:1)
              echo "Drift detected; applying environments/prod."
              kubectl apply -k environments/prod
              ;;
            *)
              echo "Kubernetes reconciliation failed with exit code $diff_rc." >&2
              exit "$diff_rc"
              ;;
          esac

      - name: Verify MicroFE workloads
        if: ${{ env.RECONCILE_MODE == 'apply' }}
        run: |
          set -euo pipefail
          kubectl rollout status deployment/microfe-auth -n microfe-platform --timeout=180s
          kubectl rollout status deployment/microfe-shell -n microfe-platform --timeout=180s
          kubectl rollout status deployment/microfe-ws -n microfe-platform --timeout=180s
          kubectl get ingress microfe-public -n microfe-platform

      - name: Verify WS HTTPS
        if: ${{ env.RECONCILE_MODE == 'apply' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://auth.mrcute.space/health >/dev/null
          code="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' https://auth.mrcute.space/auth/me)"
          test "$code" = "401"

      - name: Verify WS health
        if: ${{ env.RECONCILE_MODE == 'apply' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://ws.mrcute.space/health >/dev/null

      - name: Verify shell HTTPS
        if: ${{ env.RECONCILE_MODE == 'apply' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://app.mrcute.space/ >/dev/null

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/tce_vps_key /tmp/k3s.yaml
# yamllint enable rule:line-length
