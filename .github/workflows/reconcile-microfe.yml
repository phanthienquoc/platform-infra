name: reconcile-microfe

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: "Reconciliation mode"
        required: true
        default: apply
        type: choice
        options:
          - plan
          - apply
      allow_image_changes:
        description: "Allow deliberate MicroFE image replacement"
        required: true
        default: false
        type: boolean
  repository_dispatch:
    types:
      - microfe-images-published

permissions:
  contents: read

concurrency:
  group: platform-microfe-reconcile
  cancel-in-progress: false

env:
  RECONCILE_MODE: ${{ github.event_name == 'repository_dispatch' && 'apply' || github.event.inputs.mode || 'apply' }}
  ALLOW_IMAGE_CHANGES: ${{ github.event_name == 'repository_dispatch' || github.event.inputs.allow_image_changes == 'true' }}

jobs:
  reconcile:
    if: ${{ github.ref == 'refs/heads/master' }}
    environment: production
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate MicroFE immutable image policy
        if: ${{ env.RECONCILE_MODE == 'apply' }}
        run: |
          set -euo pipefail
          auth_image="$(sudo /usr/local/sbin/platform-kubectl -n microfe-platform get deployment microfe-auth -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          shell_image="$(sudo /usr/local/sbin/platform-kubectl -n microfe-platform get deployment microfe-shell -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          ws_image="$(sudo /usr/local/sbin/platform-kubectl -n microfe-platform get deployment microfe-ws -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"

          for image in "$auth_image" "$shell_image" "$ws_image"; do
            [ -n "$image" ] || continue
            case "$image" in
              ghcr.io/phanthienquoc/microfe-auth:[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*|ghcr.io/phanthienquoc/microfe-shell:[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*|ghcr.io/phanthienquoc/microfe-ws:[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*)
                ;;
              *)
                echo "::error::Mutable or unexpected MicroFE image: $image"
                echo "::error::Promote an immutable Git-SHA image before reconcile."
                exit 1
                ;;
            esac
          done

      - name: Reconcile MicroFE
        run: |
          set -euo pipefail
          if [ "$RECONCILE_MODE" = "apply" ] && [ "$ALLOW_IMAGE_CHANGES" != "true" ]; then
            echo "::error::Apply blocked: ALLOW_IMAGE_CHANGES is false."
            echo "::error::Use the image-promotion path or explicitly authorize a deliberate image change."
            exit 1
          fi
          chmod +x scripts/reconcile-vps.sh
          ./scripts/reconcile-vps.sh "$RECONCILE_MODE"

      - name: Verify MicroFE workloads
        if: ${{ env.RECONCILE_MODE == 'apply' }}
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/microfe-auth -n microfe-platform --timeout=180s
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/microfe-shell -n microfe-platform --timeout=180s
          sudo /usr/local/sbin/platform-kubectl rollout status deployment/microfe-ws -n microfe-platform --timeout=180s
          sudo /usr/local/sbin/platform-kubectl get ingress microfe-public -n microfe-platform

      - name: Verify WS HTTPS
        if: ${{ env.RECONCILE_MODE == 'apply' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://auth.mrcute.space/health >/dev/null
          code="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' https://auth.mrcute.space/auth/me)"
          test "$code" = "401"

      - name: Verify WS health
        if: ${{ env.RECONCILE_MODE == 'apply' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://ws.mrcute.space/health >/dev/null

      - name: Verify shell HTTPS
        if: ${{ env.RECONCILE_MODE == 'apply' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://app.mrcute.space/ >/dev/null
