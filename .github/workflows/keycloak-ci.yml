# yamllint disable rule:line-length
name: keycloak-ci

on:
  pull_request:
    paths:
      - "platform/keycloak/**"
      - ".github/workflows/keycloak-ci.yml"
      - ".github/workflows/validate-manifests.yml"
      - "scripts/validate-network-boundaries.sh"
      - "scripts/provision-keycloak-realm.py"
      - "scripts/verify-keycloak-tce-client.py"
      - ".github/workflows/reconcile-vps.yml"
  push:
    branches: [master]
    paths:
      - "platform/keycloak/**"
      - ".github/workflows/keycloak-ci.yml"
      - ".github/workflows/validate-manifests.yml"
      - "scripts/validate-network-boundaries.sh"
      - "scripts/provision-keycloak-realm.py"
      - "scripts/verify-keycloak-tce-client.py"
      - ".github/workflows/reconcile-vps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-keycloak:
    name: Validate Keycloak manifests and boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Install offline validation dependencies
        env:
          KUBECTL_VERSION: v1.36.3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          case "$(uname -m)" in
            x86_64) kubectl_arch=amd64 ;;
            aarch64|arm64) kubectl_arch=arm64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${kubectl_arch}/kubectl"
          curl -fsSLo kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${kubectl_arch}/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client=true

      - name: Render Keycloak manifests
        run: kubectl kustomize platform/keycloak > /tmp/keycloak-rendered.yaml

      - name: Validate rendered Keycloak resources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          rendered = Path("/tmp/keycloak-rendered.yaml").read_text()
          docs = list(yaml.safe_load_all(rendered))
          if len(docs) != 6:
              raise SystemExit(f"Expected 6 resources, got {len(docs)}")
          identities = {(item.get("kind"), item.get("metadata", {}).get("name")) for item in docs}
          required = {
              ("Deployment", "keycloak"),
              ("Service", "keycloak"),
              ("Ingress", "keycloak-public"),
              ("Certificate", "keycloak-sso-tls"),
              ("Middleware", "keycloak-registration-rate-limit"),
              ("Ingress", "keycloak-registration-rate-limit"),
          }
          if identities != required:
              raise SystemExit(f"Unexpected Keycloak resource set: {identities}")
          deployment = next(item for item in docs if item.get("kind") == "Deployment")
          spec = deployment["spec"]["template"]["spec"]
          container = spec["containers"][0]
          if container.get("image") != "quay.io/keycloak/keycloak:26.8.1":
              raise SystemExit("Keycloak image must remain pinned to 26.8.1.")
          if any(item.get("kind") == "Secret" for item in docs):
              raise SystemExit("Credentials must not be stored as Git manifests.")
          if "sso.mrcute.space" not in rendered or "auth.mrcute.space" in rendered:
              raise SystemExit("Keycloak must only own sso.mrcute.space.")
          print("Keycloak resource contract passed.")
          PY

      - name: Validate self-registration policy contract
        run: |
          set -euo pipefail
          grep -Fq "Self-registration enabled only in" platform/keycloak/README.md
          grep -Fq "Email verification disabled" platform/keycloak/README.md
          grep -Fq "realm remains admin-only" platform/keycloak/README.md
          grep -Fq "rate-limit middleware" platform/keycloak/README.md
          test -f scripts/provision-keycloak-realm.py
          python3 -m py_compile scripts/provision-keycloak-realm.py scripts/verify-keycloak-tce-client.py
          grep -Fq "TCE_CLIENT_ID =" scripts/provision-keycloak-realm.py
          grep -Fq "python3 scripts/verify-keycloak-tce-client.py" .github/workflows/reconcile-vps.yml
          echo "Realm/client provisioning, OIDC verification, registration rate limiting and policy contract passed."

      - name: Validate network boundaries
        run: |
          chmod +x scripts/validate-network-boundaries.sh
          ./scripts/validate-network-boundaries.sh /tmp/platform-infra-network.yaml
