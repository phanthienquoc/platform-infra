name: inspect-vps

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"
    - cron: "30 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: platform-vps-inspect
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Inspect VPS
        run: |
          set -euo pipefail
          chmod +x scripts/inspect-vps.sh
          scripts/inspect-vps.sh debug/vps-latest.md

      - name: Detect meaningful inspection changes
        id: changes
        run: |
          set -euo pipefail
          if [ ! -f debug/vps-latest.md ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git show HEAD:debug/vps-latest.md 2>/dev/null | sed '/^Generated: /d' > /tmp/previous-inspection.md || true
          sed '/^Generated: /d' debug/vps-latest.md > /tmp/current-inspection.md

          if diff -u /tmp/previous-inspection.md /tmp/current-inspection.md >/dev/null; then
            git checkout -- debug/vps-latest.md
            echo "No meaningful VPS/K3s inspection change detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Meaningful VPS/K3s inspection change detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate inspection output
        run: |
          set -euo pipefail
          test -s debug/vps-latest.md
          grep -q "^### Pod failure evidence$" debug/vps-latest.md
          grep -q "^### Recent failure events$" debug/vps-latest.md
          grep -q "^### GitOps drift$" debug/vps-latest.md
          if grep -q "^echo  echo" debug/vps-latest.md; then
            echo "Malformed duplicate echo marker found in inspection output." >&2
            exit 1
          fi
          echo "Inspection output structure validated."

      - name: Create inspection PR
        id: inspection_pr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ github.token }}
          branch: automation/vps-inspection
          delete-branch: true
          title: "chore: update VPS inspection state"
          commit-message: "chore: update VPS inspection state"
          body: |
            Automated VPS/K3s inspection snapshot.

            This PR contains inspection state only; no production manifests are changed.

      - name: Merge inspection PR
        if: steps.inspection_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.inspection_pr.outputs.pull-request-number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload='{"merge_method":"squash"}'
          curl --fail --silent --show-error             -X PUT             -H "Accept: application/vnd.github+json"      \
                                                                                                                                -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/merge"             -d "$payload"  # yamllint disable-line rule:line-length
