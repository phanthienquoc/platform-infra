# yamllint disable rule:line-length
name: inspect-vps

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/inspect-vps.sh"
      - ".github/workflows/inspect-vps.yml"
  schedule:
    - cron: "15 * * * *"
    - cron: "30 * * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: platform-vps-inspect
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Inspect VPS
        run: |
          set -euo pipefail
          chmod +x scripts/inspect-vps.sh
          scripts/inspect-vps.sh debug/vps-latest.md

      - name: Detect meaningful inspection changes
        id: changes
        run: |
          set -euo pipefail
          if [ ! -f debug/vps-latest.md ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git show HEAD:debug/vps-latest.md 2>/dev/null | sed '/^Generated: /d' > /tmp/previous-inspection.md || true
          sed '/^Generated: /d' debug/vps-latest.md > /tmp/current-inspection.md

          if diff -u /tmp/previous-inspection.md /tmp/current-inspection.md >/dev/null; then
            git checkout -- debug/vps-latest.md
            echo "No meaningful VPS/K3s inspection change detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Meaningful VPS/K3s inspection change detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate inspection output
        run: |
          set -euo pipefail
          test -s debug/vps-latest.md
          grep -q "^### Pod failure evidence$" debug/vps-latest.md
          grep -q "^### Recent failure events$" debug/vps-latest.md
          grep -q "^### GitOps drift$" debug/vps-latest.md
          if grep -q "^echo  echo" debug/vps-latest.md; then
            echo "Malformed duplicate echo marker found in inspection output." >&2
            exit 1
          fi
          echo "Inspection output structure validated."

      - name: Create inspection PR
        id: inspection_pr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ github.token }}
          branch: automation/vps-inspection
          delete-branch: true
          title: "chore: update VPS inspection state"
          commit-message: "chore: update VPS inspection state"
          body: |
            Automated VPS/K3s inspection snapshot.

            This PR contains inspection state only; no production manifests are changed.

      - name: Validate exact inspection PR head before squash merge
        if: steps.inspection_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.inspection_pr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.inspection_pr.outputs.pull-request-head-sha }}
          PR_BRANCH: ${{ steps.inspection_pr.outputs.pull-request-branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Missing or invalid inspection PR head SHA." >&2; exit 1; }
          [[ "$PR_BRANCH" == "automation/vps-inspection" ]] || { echo "Unexpected inspection PR branch: $PR_BRANCH" >&2; exit 1; }

          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dispatch_payload="$(jq -n --arg ref "$PR_BRANCH" '{ref: $ref}')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/validate-manifests.yml/dispatches" \
            -d "$dispatch_payload"

          deadline=$((SECONDS + 900))
          validation_run=""
          while (( SECONDS < deadline )); do
            runs_json="$(curl --fail --silent --show-error -G \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/workflows/validate-manifests.yml/runs" \
              --data-urlencode "branch=$PR_BRANCH" \
              --data-urlencode "event=workflow_dispatch" \
              --data-urlencode "per_page=20")"
            validation_run="$(jq -c --arg sha "$PR_HEAD_SHA" --arg started "$started_at" \
              '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch" and .created_at >= $started)] | sort_by(.created_at) | last // empty' \
              <<< "$runs_json")"

            if [[ -n "$validation_run" && "$(jq -r '.status' <<< "$validation_run")" == "completed" ]]; then
              validation_conclusion="$(jq -r '.conclusion // empty' <<< "$validation_run")"
              validation_url="$(jq -r '.html_url' <<< "$validation_run")"
              if [[ "$validation_conclusion" != "success" ]]; then
                echo "Exact-head manifest validation did not pass: $validation_url (conclusion=$validation_conclusion)" >&2
                exit 1
              fi
              echo "Exact-head manifest validation passed: $validation_url"
              break
            fi
            sleep 10
          done

          if [[ -z "$validation_run" || "$(jq -r '.status' <<< "$validation_run")" != "completed" || "$(jq -r '.conclusion // empty' <<< "$validation_run")" != "success" ]]; then
            echo "Timed out waiting for validate-manifests success on $PR_HEAD_SHA; leaving PR open." >&2
            exit 1
          fi

          pr_json="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER")"
          [[ "$(jq -r '.state' <<< "$pr_json")" == "open" ]] || { echo "Inspection PR is no longer open; refusing merge." >&2; exit 1; }
          [[ "$(jq -r '.head.sha' <<< "$pr_json")" == "$PR_HEAD_SHA" ]] || { echo "Inspection PR head changed after validation; refusing merge." >&2; exit 1; }
          [[ "$(jq -r '.head.ref' <<< "$pr_json")" == "$PR_BRANCH" ]] || { echo "Inspection PR branch changed after validation; refusing merge." >&2; exit 1; }

          merge_payload="$(jq -n --arg sha "$PR_HEAD_SHA" '{merge_method: "squash", sha: $sha}')"
          merge_result="$(curl --fail --silent --show-error \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -d "$merge_payload")"
          [[ "$(jq -r '.merged' <<< "$merge_result")" == "true" ]] || { echo "GitHub did not confirm the squash merge." >&2; exit 1; }
          echo "Squash-merged inspection PR #$PR_NUMBER only after validation passed for exact head $PR_HEAD_SHA."
# yamllint enable rule:line-length
