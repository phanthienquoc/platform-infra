# yamllint disable rule:line-length
name: inspect-vps

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/inspect-vps.sh"
      - "scripts/decommission-stock-media-namespaces.sh"
      - "scripts/prepare-cert-manager-manifest.sh"
      - ".github/workflows/inspect-vps.yml"
  schedule:
    - cron: "2,32 * * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: platform-vps-inspect
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, arm64, platform-infra, k3s, vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Inspect VPS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/inspect-vps.sh
          scripts/inspect-vps.sh debug/vps-latest.md

      - name: Detect meaningful inspection changes
        id: changes
        run: |
          set -euo pipefail
          if [ ! -f debug/vps-latest.md ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git show HEAD:debug/vps-latest.md 2>/dev/null | sed '/^Generated: /d' > /tmp/previous-inspection.md || true
          sed '/^Generated: /d' debug/vps-latest.md > /tmp/current-inspection.md

          if diff -u /tmp/previous-inspection.md /tmp/current-inspection.md >/dev/null; then
            git checkout -- debug/vps-latest.md
            echo "No meaningful VPS/K3s inspection change detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Meaningful VPS/K3s inspection change detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate inspection output
        run: |
          set -euo pipefail
          test -s debug/vps-latest.md
          grep -q "^### Pod failure evidence$" debug/vps-latest.md
          grep -q "^### Persistent storage inventory$" debug/vps-latest.md
          grep -q "^### Recent failure events$" debug/vps-latest.md
          grep -q "^### GitOps drift$" debug/vps-latest.md
          grep -q "^runner_policy:" debug/vps-latest.md
          grep -q "^Images (repo tags, repo digests, image ID, pinned, size bytes):$" debug/vps-latest.md
          grep -q "^### GHCR image digest coverage$" debug/vps-latest.md
          grep -q "^Containers (container ID, name, image reference, state):$" debug/vps-latest.md
          if grep -q "^echo  echo" debug/vps-latest.md; then
            echo "Malformed duplicate echo marker found in inspection output." >&2
            exit 1
          fi
          echo "Inspection output structure validated."

      # A rerun may execute from an older workflow SHA. Rebase the generated
      # read-only snapshot onto the live master tip before the PR action creates
      # its branch, otherwise the exact-head merge can fail on a stale base.
      # A rerun may execute from an older workflow SHA. Rebase the generated
      # read-only snapshot onto the live master tip before the PR action creates
      # its branch, otherwise exact-head validation can still hit a stale base.
      - name: Rebase inspection snapshot on latest master
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp debug/vps-latest.md "$RUNNER_TEMP/vps-latest.md"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          # The persistent self-hosted runner may retain a remote-tracking ref from a
          # newer/divergent checkout. Force-update only refs/remotes/origin/master;
          # this does not force-push or modify the remote master branch.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          git checkout --force -B master refs/remotes/origin/master
          install -m 0644 "$RUNNER_TEMP/vps-latest.md" debug/vps-latest.md
          if [[ "$(git status --short)" != " M debug/vps-latest.md" ]]; then
            echo "Unexpected worktree changes while rebasing inspection snapshot onto latest master." >&2
            git status --short
            exit 1
          fi
          echo "Inspection snapshot is now based on current origin/master."

      - name: Create inspection PR
        id: inspection_pr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/vps-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          delete-branch: true
          title: "chore: update VPS inspection state"
          commit-message: "chore: update VPS inspection state"
          body: |
            Automated VPS/K3s inspection snapshot.

            This PR contains inspection state only; no production manifests are changed.

      - name: Validate exact inspection PR head before squash merge
        if: steps.inspection_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.inspection_pr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.inspection_pr.outputs.pull-request-head-sha }}
          PR_BRANCH: ${{ steps.inspection_pr.outputs.pull-request-branch }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          github_api_get() {
            local url="$1"
            local response_file="$2"
            local max_get_attempts=3
            local attempt=1
            local status
            local retry_delay

            while (( attempt <= max_get_attempts )); do
              : > "$response_file"
              if status="$(curl --silent --show-error \
                --output "$response_file" \
                --write-out '%{http_code}' \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url")"; then
                :
              else
                status="000"
              fi

              if [[ "$status" == "200" ]]; then
                cat "$response_file"
                return 0
              fi

              if [[ "$status" =~ ^(000|500|502|503|504)$ ]] && (( attempt < max_get_attempts )); then
                retry_delay=$((attempt * 5))
                echo "::warning::Transient GitHub API GET failure HTTP $status; retrying in ${retry_delay}s (attempt $((attempt + 1))/$max_get_attempts)." >&2
                sleep "$retry_delay"
                attempt=$((attempt + 1))
                continue
              fi

              echo "::error::GitHub API GET failed with HTTP $status: $url" >&2
              return 1
            done

            return 1
          }
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Missing or invalid inspection PR head SHA." >&2; exit 1; }
          EXPECTED_BRANCH="automation/vps-inspection-${RUN_ID}-${RUN_ATTEMPT}"
          [[ "$PR_BRANCH" == "$EXPECTED_BRANCH" ]] || { echo "Unexpected inspection PR branch: $PR_BRANCH (expected $EXPECTED_BRANCH)" >&2; exit 1; }

          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dispatch_payload="$(jq -n --arg ref "$PR_BRANCH" '{ref: $ref}')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/validate-manifests.yml/dispatches" \
            -d "$dispatch_payload"

          deadline=$((SECONDS + 900))
          validation_run=""
          while (( SECONDS < deadline )); do
            encoded_branch="$(printf '%s' "$PR_BRANCH" | jq -sRr @uri)"
            runs_url="https://api.github.com/repos/$REPOSITORY/actions/workflows/validate-manifests.yml/runs?branch=$encoded_branch&event=workflow_dispatch&per_page=20"
            runs_json="$(github_api_get "$runs_url" "$RUNNER_TEMP/inspection-validation-runs.json")"
            validation_run="$(jq -c --arg sha "$PR_HEAD_SHA" --arg started "$started_at" \
              '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch" and .created_at >= $started)] | sort_by(.created_at) | last // empty' \
              <<< "$runs_json")"

            if [[ -n "$validation_run" && "$(jq -r '.status' <<< "$validation_run")" == "completed" ]]; then
              validation_conclusion="$(jq -r '.conclusion // empty' <<< "$validation_run")"
              validation_url="$(jq -r '.html_url' <<< "$validation_run")"
              if [[ "$validation_conclusion" != "success" ]]; then
                echo "Exact-head manifest validation did not pass: $validation_url (conclusion=$validation_conclusion)" >&2
                exit 1
              fi
              echo "Exact-head manifest validation passed: $validation_url"
              break
            fi
            sleep 10
          done

          if [[ -z "$validation_run" || "$(jq -r '.status' <<< "$validation_run")" != "completed" || "$(jq -r '.conclusion // empty' <<< "$validation_run")" != "success" ]]; then
            echo "Timed out waiting for validate-manifests success on $PR_HEAD_SHA; leaving PR open." >&2
            exit 1
          fi

          pr_json="$(github_api_get "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER" "$RUNNER_TEMP/inspection-pr-pre-merge.json")"
          [[ "$(jq -r '.state' <<< "$pr_json")" == "open" ]] || { echo "Inspection PR is no longer open; refusing merge." >&2; exit 1; }
          [[ "$(jq -r '.head.sha' <<< "$pr_json")" == "$PR_HEAD_SHA" ]] || { echo "Inspection PR head changed after validation; refusing merge." >&2; exit 1; }
          [[ "$(jq -r '.head.ref' <<< "$pr_json")" == "$PR_BRANCH" ]] || { echo "Inspection PR branch changed after validation; refusing merge." >&2; exit 1; }

          merge_payload="$(jq -n --arg sha "$PR_HEAD_SHA" '{merge_method: "squash", sha: $sha}')"
          merge_response="$RUNNER_TEMP/inspection-merge-response.json"
          max_merge_attempts=3
          merge_confirmed=false

          for ((attempt = 1; attempt <= max_merge_attempts; attempt++)); do
            current_pr_json="$(github_api_get "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER" "$RUNNER_TEMP/inspection-pr-current.json")"
            current_state="$(jq -r '.state // empty' <<< "$current_pr_json")"
            current_head="$(jq -r '.head.sha // empty' <<< "$current_pr_json")"
            current_merged="$(jq -r '.merged // false' <<< "$current_pr_json")"
            current_merge_commit="$(jq -r '.merge_commit_sha // empty' <<< "$current_pr_json")"

            if [[ "$current_merged" == "true" && "$current_head" == "$PR_HEAD_SHA" && -n "$current_merge_commit" ]]; then
              echo "Inspection PR #$PR_NUMBER is already squash-merged at the exact validated head $PR_HEAD_SHA."
              merge_confirmed=true
              break
            fi
            [[ "$current_state" == "open" ]] || { echo "Inspection PR is no longer open; refusing merge." >&2; exit 1; }
            [[ "$current_head" == "$PR_HEAD_SHA" ]] || { echo "Inspection PR head changed after validation; refusing merge." >&2; exit 1; }

            : > "$merge_response"
            if merge_http_status="$(curl --silent --show-error \
              --output "$merge_response" \
              --write-out '%{http_code}' \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
              -d "$merge_payload")"; then
              :
            else
              merge_http_status="000"
            fi

            if [[ "$merge_http_status" == "200" ]]; then
              merge_result="$(cat "$merge_response")"
              [[ "$(jq -r '.merged // false' <<< "$merge_result")" == "true" ]] || {
                echo "GitHub returned HTTP 200 without confirming the squash merge." >&2
                exit 1
              }

              merged_pr_json="$(github_api_get "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER" "$RUNNER_TEMP/inspection-pr-merged.json")"
              [[ "$(jq -r '.merged // false' <<< "$merged_pr_json")" == "true" ]] || {
                echo "GitHub did not report the inspection PR as merged after the merge request." >&2
                exit 1
              }
              [[ "$(jq -r '.head.sha // empty' <<< "$merged_pr_json")" == "$PR_HEAD_SHA" ]] || {
                echo "Merged inspection PR head does not match the exact validated SHA $PR_HEAD_SHA." >&2
                exit 1
              }
              merge_commit_sha="$(jq -r '.merge_commit_sha // empty' <<< "$merged_pr_json")"
              [[ -n "$merge_commit_sha" ]] || {
                echo "GitHub did not return a merge commit SHA for inspection PR #$PR_NUMBER." >&2
                exit 1
              }
              echo "Squash-merged inspection PR #$PR_NUMBER at exact validated head $PR_HEAD_SHA (merge commit $merge_commit_sha)."
              merge_confirmed=true
              break
            fi

            if after_merge_pr="$(github_api_get "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER" "$RUNNER_TEMP/inspection-pr-after-merge.json")"; then
              after_merge_state="$(jq -r '.state // empty' <<< "$after_merge_pr")"
              after_merge_head="$(jq -r '.head.sha // empty' <<< "$after_merge_pr")"
              after_merge_merged="$(jq -r '.merged // false' <<< "$after_merge_pr")"
              after_merge_commit="$(jq -r '.merge_commit_sha // empty' <<< "$after_merge_pr")"

              if [[ "$after_merge_merged" == "true" && "$after_merge_head" == "$PR_HEAD_SHA" && -n "$after_merge_commit" ]]; then
                echo "Inspection PR #$PR_NUMBER was already squash-merged at the exact validated head $PR_HEAD_SHA (merge API HTTP $merge_http_status)."
                merge_confirmed=true
                break
              fi
              if [[ "$after_merge_state" != "open" || "$after_merge_head" != "$PR_HEAD_SHA" ]]; then
                echo "::error::GitHub merge response could not be reconciled safely (HTTP $merge_http_status). PR state=${after_merge_state:-unknown}, head=${after_merge_head:-unknown}; leaving it untouched." >&2
                exit 1
              fi
            else
              echo "::warning::Could not read inspection PR state after merge API HTTP $merge_http_status."
            fi

            if [[ "$merge_http_status" =~ ^(000|500|502|503|504)$ ]] && (( attempt < max_merge_attempts )); then
              retry_delay=$((attempt * 5))
              echo "::warning::Transient GitHub merge API failure HTTP $merge_http_status; retrying exact-head merge in ${retry_delay}s (attempt $((attempt + 1))/$max_merge_attempts)."
              sleep "$retry_delay"
              continue
            fi

            api_message="$(jq -r '.message // empty' "$merge_response" 2>/dev/null || true)"
            [[ -n "$api_message" ]] || api_message="GitHub returned no JSON error message."
            echo "::error::GitHub rejected inspection squash merge (HTTP $merge_http_status): $api_message. PR state=${after_merge_state:-unknown}, head=${after_merge_head:-unknown}; leaving it open." >&2
            exit 1
          done

          [[ "$merge_confirmed" == "true" ]] || {
            echo "Inspection PR squash merge was not confirmed; leaving it open." >&2
            exit 1
          }
# yamllint enable rule:line-length
