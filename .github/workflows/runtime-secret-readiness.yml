name: runtime-secret-readiness

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to inspect
        required: true
        default: production
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configured secret names only
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          gh secret list --env "$TARGET_ENV" --json name --jq '.[].name' | sort > /tmp/secret-names.txt
          required="GEMINI_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY MEDIA_STORAGE_BUCKET"
          missing=0
          for name in $required; do
            if grep -Fxq "$name" /tmp/secret-names.txt; then
              echo "configured: $name"
            else
              echo "::error::missing: $name"
              missing=1
            fi
          done
          rm -f /tmp/secret-names.txt
          exit "$missing"
