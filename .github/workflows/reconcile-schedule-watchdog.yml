name: Reconcile Schedule Freshness Watchdog
run-name: Reconcile Schedule Freshness Watchdog — ${{ github.event_name }}

'on':
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
  # Exercise the read-only GitHub API path after a watchdog change lands.
  # Push runs are diagnostic smoke tests; scheduled/manual/fallback runs enforce freshness.
  push:
    branches: [master]
    paths:
      - ".github/workflows/reconcile-schedule-watchdog.yml"
  # Check freshness after scheduled reconciliation, inspection and recovery runs.
  workflow_run:
    workflows:
      - inspect-vps
      - reconcile-vps
      - Recover Stale Scheduled Ops
    types:
      - completed

permissions:
  actions: read
  contents: read

# GitHub retains only one pending run per concurrency group. Keep native schedule
# enforcement separate from workflow_run/push/manual diagnostics so a newer
# read-only event cannot replace a pending scheduled watchdog run.
concurrency:
  group: reconcile-schedule-freshness-watchdog-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify scheduled reconciliation freshness
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_AGE_MINUTES: "45"
      MAX_QUEUE_MINUTES: "15"
      MAX_INSPECTION_AGE_MINUTES: "75"
      MAX_RECOVERY_AGE_MINUTES: "45"
      MAX_WATCHDOG_AGE_MINUTES: "45"
      MAX_TCE_WF06_AGE_MINUTES: "25"
      MAX_TCE_WF12_GAP_MINUTES: "25"
    steps:
      - name: Checkout read-only queue verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Verify reconcile-vps workflow is enabled
        shell: bash
        run: |
          set -euo pipefail
          workflow="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/reconcile-vps.yml")"
          state="$(jq -r '.state // empty' <<< "$workflow")"
          if [[ "$state" != "active" ]]; then
            echo "::error::reconcile-vps workflow is not active (state=${state:-missing}); scheduled events cannot be relied on."
            exit 1
          fi
          echo "reconcile-vps workflow state: active"

      - name: Inspect latest scheduled reconcile run
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/reconcile-vps.yml/runs" \
            -f event=schedule \
            -F per_page=1)"
          latest="$(jq -c '.workflow_runs | sort_by(.created_at) | last // empty' <<< "$response")"
          if [[ -z "$latest" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded, but no scheduled reconcile-vps run is present yet."
              exit 0
            fi
            echo "::error::No scheduled reconcile-vps run is available in GitHub Actions history."
            exit 1
          fi

          # Use the current watchdog run's GitHub API timestamp as the reference clock.
          # Hosted runner wall clocks can differ from Actions API timestamps; comparing
          # two API-created timestamps avoids false future-run and queue-delay failures.
          current_run="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          reference_at="$(jq -r '.created_at // empty' <<< "$current_run")"
          reference_epoch="$(jq -r 'if .created_at then (.created_at | fromdateiso8601) else empty end' <<< "$current_run")"
          if [[ -z "$reference_at" || -z "$reference_epoch" ]]; then
            echo "::error::Unable to obtain the current watchdog run timestamp from the Actions API."
            exit 1
          fi
          echo "WATCHDOG_REFERENCE_EPOCH=$reference_epoch" >> "$GITHUB_ENV"

          created_at="$(jq -r '.created_at' <<< "$latest")"
          created_epoch="$(jq -r '.created_at | fromdateiso8601' <<< "$latest")"
          run_id="$(jq -r '.id' <<< "$latest")"
          run_url="$(jq -r '.html_url' <<< "$latest")"
          status="$(jq -r '.status' <<< "$latest")"
          conclusion="$(jq -r '.conclusion // "pending"' <<< "$latest")"
          age_seconds=$((reference_epoch - created_epoch))
          age_minutes=$((age_seconds / 60))
          run_attempt="$(jq -r '.run_attempt // 1' <<< "$latest")"
          queue_measurable=true
          if (( run_attempt > 1 )); then
            # GitHub keeps created_at from the original run but updates run_started_at
            # for a re-run attempt. Their difference is not runner queue time.
            queue_measurable=false
            queue_seconds=0
            queue_minutes=0
            echo "::notice::Reconcile #${run_id} attempt ${run_attempt}: queue not measurable; freshness uses original created_at."
          else
            started_at="$(jq -r '.run_started_at // empty' <<< "$latest")"
            if [[ -n "$started_at" ]]; then
              started_epoch="$(jq -r '.run_started_at | fromdateiso8601' <<< "$latest")"
            else
              # A queued run has not acquired a runner yet; measure its wait to this
              # watchdog run API timestamp, not the hosted runner wall clock.
              started_epoch="$reference_epoch"
            fi
            queue_seconds=$((started_epoch - created_epoch))
            queue_minutes=$((queue_seconds / 60))
          fi

          if (( age_seconds < 0 )); then
            echo "::error::GitHub returned a future timestamp for scheduled reconcile run #${run_id}: ${created_at}"
            exit 1
          fi
          if [[ "$queue_measurable" == true ]] && (( queue_seconds < 0 )); then
            echo "::error::GitHub returned a run_started_at earlier than created_at for scheduled reconcile #${run_id}."
            exit 1
          fi
          if [[ "$queue_measurable" == true ]] && (( queue_seconds > MAX_QUEUE_MINUTES * 60 )); then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded; latest scheduled reconcile runner queue delay exceeds ${MAX_QUEUE_MINUTES}m."
              echo "::warning::Latest run #${run_id}: queue_wait=${queue_minutes}m status=${status}."
              echo "::warning::Run evidence: ${run_url}"
            else
              echo "::error::Scheduled reconcile #${run_id} waited ${queue_minutes}m for a runner."
              echo "::error::Queue budget=${MAX_QUEUE_MINUTES}m; status=${status}."
              echo "::error::created_at=${created_at}, run_started_at=${started_at:-not-started}."
              echo "::error::Run evidence: ${run_url}"
              exit 1
            fi
          fi
          if (( age_seconds > MAX_AGE_MINUTES * 60 )); then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded; latest scheduled reconcile is stale."
              echo "::warning::Latest run #${run_id}: created=${created_at}, age=${age_minutes}m."
              echo "::warning::status=${status}, conclusion=${conclusion}."
              echo "::warning::Run evidence: ${run_url}"
              exit 0
            fi
            echo "::error::No scheduled reconcile-vps run within ${MAX_AGE_MINUTES} minutes."
            echo "::error::Latest run #${run_id}: created=${created_at}, age=${age_minutes}m."
            echo "::error::status=${status}, conclusion=${conclusion}."
            echo "::error::Run evidence: ${run_url}"
            exit 1
          fi

          # Freshness alone is not deployment success. A recent scheduled run that
          # completed with failure/cancelled/timed_out must fail the watchdog too.
          python3 scripts/verify-scheduled-run-result.py --event "$GITHUB_EVENT_NAME" --run-id "$run_id" --run-url "$run_url" <<< "$latest"

          echo "Scheduled reconcile freshness evaluated for run #${run_id}."
          if [[ "$queue_measurable" == true ]]; then
            echo "age=${age_minutes}m queue_wait=${queue_minutes}m status=${status} conclusion=${conclusion}."
          else
            echo "age=${age_minutes}m queue_wait=not-measurable (run_attempt=${run_attempt}) status=${status} conclusion=${conclusion}."
          fi
          echo "Age reference: watchdog run #${GITHUB_RUN_ID} created=${reference_at} (GitHub Actions API clock)."
          echo "Run evidence: ${run_url}"

      - name: Report latest scheduled inspection runner queue delay
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/inspect-vps.yml/runs" \
            -f event=schedule \
            -F per_page=1)"
          latest="$(jq -c '.workflow_runs | sort_by(.created_at) | last // empty' <<< "$response")"
          if [[ -z "$latest" ]]; then
            echo "::warning::No scheduled inspect-vps run is available for runner queue diagnostics."
            exit 0
          fi

          # The freshness step normally exports this value. Fetch it again when that
          # step failed early (disabled workflow or empty reconcile history), so queue
          # telemetry still runs after the enforcement failure.
          reference_epoch="${WATCHDOG_REFERENCE_EPOCH:-}"
          if [[ -z "$reference_epoch" ]]; then
            current_run="$(gh api \
              -X GET \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")" || {
                echo "::warning::Unable to fetch watchdog run metadata; inspection queue telemetry is unavailable."
                exit 0
              }
            reference_epoch="$(jq -r 'if .created_at then (.created_at | fromdateiso8601) else empty end' <<< "$current_run")"
            if [[ -z "$reference_epoch" ]]; then
              echo "::warning::Watchdog run metadata has no usable created_at; inspection queue telemetry is unavailable."
              exit 0
            fi
          fi

          run_attempt="$(jq -r '.run_attempt // 1' <<< "$latest")"
          if (( run_attempt > 1 )); then
            echo "::warning::Inspection rerun attempt ${run_attempt}: queue not measurable; created_at is original."
            exit 0
          fi
          created_at="$(jq -r '.created_at' <<< "$latest")"
          created_epoch="$(jq -r '.created_at | fromdateiso8601' <<< "$latest")"
          started_at="$(jq -r '.run_started_at // empty' <<< "$latest")"
          if [[ -n "$started_at" ]]; then
            started_epoch="$(jq -r '.run_started_at | fromdateiso8601' <<< "$latest")"
          else
            started_epoch="$reference_epoch"
          fi
          queue_seconds=$((started_epoch - created_epoch))
          queue_minutes=$((queue_seconds / 60))
          run_id="$(jq -r '.id' <<< "$latest")"
          run_url="$(jq -r '.html_url' <<< "$latest")"
          status="$(jq -r '.status' <<< "$latest")"

          if (( queue_seconds < 0 )); then
            echo "::warning::Inspection run #${run_id} has an invalid negative queue duration."
            exit 0
          fi
          echo "Latest scheduled inspect-vps run #${run_id}: queue_wait=${queue_minutes}m status=${status}."
          echo "created_at=${created_at} started_at=${started_at:-not-started}."
          if (( queue_seconds > MAX_QUEUE_MINUTES * 60 )); then
            echo "::warning::Self-hosted inspection runner queue delay exceeds ${MAX_QUEUE_MINUTES}m."
            echo "::warning::Run evidence: ${run_url}"
          fi

      - name: Verify scheduled reconciliation deployment-lane runner assignment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/reconcile-vps.yml/runs" \
            -f event=schedule \
            -F per_page=1)"
          latest="$(jq -c '.workflow_runs | sort_by(.created_at) | last // empty' <<< "$response")"
          if [[ -z "$latest" ]]; then
            echo "::warning::No scheduled reconciliation run is available for deployment-lane queue diagnostics."
            exit 0
          fi

          run_id="$(jq -r '.id' <<< "$latest")"
          run_attempt="$(jq -r '.run_attempt // 1' <<< "$latest")"
          run_url="$(jq -r '.html_url' <<< "$latest")"
          reconcile_created_at="$(jq -r '.created_at // empty' <<< "$latest")"
          if [[ -z "$reconcile_created_at" ]]; then
            echo "::error::Latest scheduled reconciliation #${run_id} has no created_at timestamp."
            exit 1
          fi
          if (( run_attempt > 1 )); then
            echo "::notice::Reconcile #${run_id} is a rerun; deployment-lane queue age is not inferred from the original attempt."
            exit 0
          fi

          jobs="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
            -F per_page=100)"
          reference_epoch="${WATCHDOG_REFERENCE_EPOCH:-}"
          if [[ -z "$reference_epoch" ]]; then
            current_run="$(gh api \
              -X GET \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            reference_epoch="$(jq -r 'if .created_at then (.created_at | fromdateiso8601) else empty end' <<< "$current_run")"
          fi
          [[ "$reference_epoch" =~ ^[0-9]+$ ]] || {
            echo "::error::Unable to obtain GitHub API reference time for deployment-lane queue diagnostics."
            exit 1
          }

          echo "Inspecting deployment-lane runner assignment for reconcile #${run_id}: ${run_url}"
          python3 scripts/verify-reconcile-lane-queue.py \
            --reference-epoch "$reference_epoch" \
            --max-queue-minutes "$MAX_QUEUE_MINUTES" \
            --reconcile-created-at "$reconcile_created_at" \
            --max-reconcile-age-minutes "$MAX_AGE_MINUTES" \
            --event "$GITHUB_EVENT_NAME" <<< "$jobs"

      - name: Verify scheduled inspection delivery
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          workflow="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/inspect-vps.yml")"
          state="$(jq -r '.state // empty' <<< "$workflow")"
          if [[ "$state" != "active" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded; inspect-vps workflow is not active (state=${state:-missing})."
              exit 0
            fi
            echo "::error::inspect-vps workflow is not active (state=${state:-missing}); scheduled inspection cannot be relied on."
            exit 1
          fi

          response="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/inspect-vps.yml/runs" \
            -f event=schedule \
            -F per_page=1)"
          latest="$(jq -c '.workflow_runs | sort_by(.created_at) | last // empty' <<< "$response")"
          if [[ -z "$latest" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded, but no scheduled inspect-vps run is present yet."
              exit 0
            fi
            echo "::error::No scheduled inspect-vps run is available in GitHub Actions history."
            exit 1
          fi

          reference_epoch="${WATCHDOG_REFERENCE_EPOCH:-}"
          if [[ -z "$reference_epoch" ]]; then
            current_run="$(gh api \
              -X GET \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            reference_epoch="$(jq -r 'if .created_at then (.created_at | fromdateiso8601) else empty end' <<< "$current_run")"
          fi
          if [[ -z "$reference_epoch" ]]; then
            echo "::error::Unable to obtain the current watchdog run timestamp from the Actions API."
            exit 1
          fi

          created_at="$(jq -r '.created_at' <<< "$latest")"
          created_epoch="$(jq -r '.created_at | fromdateiso8601' <<< "$latest")"
          run_id="$(jq -r '.id' <<< "$latest")"
          run_url="$(jq -r '.html_url' <<< "$latest")"
          status="$(jq -r '.status' <<< "$latest")"
          conclusion="$(jq -r '.conclusion // "pending"' <<< "$latest")"
          age_seconds=$((reference_epoch - created_epoch))
          age_minutes=$((age_seconds / 60))

          if (( age_seconds < 0 )); then
            echo "::error::GitHub returned a future timestamp for scheduled inspect-vps run #${run_id}: ${created_at}"
            exit 1
          fi
          if (( age_seconds > MAX_INSPECTION_AGE_MINUTES * 60 )); then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded; scheduled inspect-vps is stale."
              echo "::warning::Latest run #${run_id}: created=${created_at}, age=${age_minutes}m."
              echo "::warning::status=${status}, conclusion=${conclusion}."
              echo "::warning::Run evidence: ${run_url}"
              exit 0
            fi
            echo "::error::No scheduled inspect-vps run within ${MAX_INSPECTION_AGE_MINUTES} minutes."
            echo "::error::Latest run #${run_id}: created=${created_at}, age=${age_minutes}m."
            echo "::error::status=${status}, conclusion=${conclusion}."
            echo "::error::Run evidence: ${run_url}"
            exit 1
          fi

          if [[ "$status" != "completed" ]]; then
            echo "::notice::Scheduled inspection run #${run_id} is still ${status}; completion has not been verified."
            exit 0
          fi
          if [[ "$conclusion" != "success" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded; latest scheduled inspect-vps run concluded ${conclusion}."
              echo "::warning::Run evidence: ${run_url}"
              exit 0
            fi
            echo "::error::Scheduled inspect-vps run #${run_id} failed with conclusion=${conclusion}."
            echo "::error::Run evidence: ${run_url}"
            exit 1
          fi

          echo "Scheduled inspection delivery passed for run #${run_id}."
          echo "age=${age_minutes}m status=${status} conclusion=${conclusion}."
          echo "Run evidence: ${run_url}"

      - name: Verify scheduled recovery controller delivery and result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          workflow="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/recover-stale-ops.yml")"
          state="$(jq -r '.state // empty' <<< "$workflow")"
          if [[ "$state" != "active" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded; recovery controller is not active (state=${state:-missing})."
              exit 0
            fi
            echo "::error::Recovery controller is not active (state=${state:-missing})."
            exit 1
          fi

          response="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/recover-stale-ops.yml/runs" \
            -f event=schedule \
            -f branch=master \
            -F per_page=1)"
          latest="$(jq -c '.workflow_runs | sort_by(.created_at) | last // empty' <<< "$response")"
          if [[ -z "$latest" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded, but no native scheduled recovery run is present yet."
              exit 0
            fi
            echo "::error::No native scheduled recovery-controller run is available in GitHub Actions history."
            exit 1
          fi

          current_run="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          reference_epoch="$(jq -r 'if .created_at then (.created_at | fromdateiso8601) else empty end' <<< "$current_run")"
          if [[ -z "$reference_epoch" ]]; then
            echo "::error::Unable to obtain the watchdog run timestamp for recovery freshness."
            exit 1
          fi

          created_at="$(jq -r '.created_at' <<< "$latest")"
          created_epoch="$(jq -r '.created_at | fromdateiso8601' <<< "$latest")"
          run_id="$(jq -r '.id' <<< "$latest")"
          run_url="$(jq -r '.html_url' <<< "$latest")"
          status="$(jq -r '.status' <<< "$latest")"
          conclusion="$(jq -r '.conclusion // "pending"' <<< "$latest")"
          age_seconds=$((reference_epoch - created_epoch))
          age_minutes=$((age_seconds / 60))

          if (( age_seconds < 0 )); then
            echo "::error::GitHub returned a future timestamp for scheduled recovery run #${run_id}: ${created_at}"
            exit 1
          fi
          if (( age_seconds > MAX_RECOVERY_AGE_MINUTES * 60 )); then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded; scheduled recovery controller is stale."
              echo "::warning::Latest run #${run_id}: created=${created_at}, age=${age_minutes}m."
              echo "::warning::Run evidence: ${run_url}"
              exit 0
            fi
            echo "::error::No scheduled recovery-controller run within ${MAX_RECOVERY_AGE_MINUTES} minutes."
            echo "::error::Latest run #${run_id}: created=${created_at}, age=${age_minutes}m."
            echo "::error::status=${status}, conclusion=${conclusion}."
            echo "::error::Run evidence: ${run_url}"
            exit 1
          fi

          if [[ "$status" != "completed" ]]; then
            echo "::notice::Scheduled recovery run #${run_id} is still ${status}; result will be checked after completion."
            exit 0
          fi
          if [[ "$conclusion" != "success" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded; latest scheduled recovery-controller run concluded ${conclusion}."
              echo "::warning::Run evidence: ${run_url}"
              exit 0
            fi
            echo "::error::Scheduled recovery-controller run #${run_id} failed with conclusion=${conclusion}."
            echo "::error::Run evidence: ${run_url}"
            exit 1
          fi

          echo "Scheduled recovery-controller delivery passed for run #${run_id}."
          echo "age=${age_minutes}m status=${status} conclusion=${conclusion}."
          echo "Run evidence: ${run_url}"

      - name: Collect TCE schedule history from verified Platform heartbeat receipts
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          set -euo pipefail
          receipt_runs_file="${RUNNER_TEMP}/tce-heartbeat-receipt-runs.json"
          receipt_runs_prefix="repos/${GITHUB_REPOSITORY}/actions/workflows/"
          receipt_runs_workflow="recover-stale-ops.yml/runs"
          receipt_runs_query="event=repository_dispatch&branch=master&per_page=100"
          if ! receipt_response="$(gh api --paginate "${receipt_runs_prefix}${receipt_runs_workflow}?${receipt_runs_query}")"; then
            echo "::warning::Unable to query Platform's own TCE heartbeat receipt history."
            receipt_response=""
          fi
          if [[ -n "$receipt_response" ]]; then
            printf '%s\n' "$receipt_response" | jq -s '[.[].workflow_runs[]?]' > "$receipt_runs_file"
          else
            printf '[]\n' > "$receipt_runs_file"
          fi

          collect_tce_schedule_history() {
            local workflow_path="$1"
            local label="$2"
            local output_file="$3"
            local selected_file="${RUNNER_TEMP}/${label}-receipt-runs.json"
            local evidence_ndjson="${RUNNER_TEMP}/${label}-receipt-evidence.ndjson"
            local evidence_file="${RUNNER_TEMP}/${label}-receipt-evidence.json"
            local source_run_id receipt_name receipt source_file http_code evidence_item

            jq --arg path "$workflow_path" '
              [ .[]
                | select(
                    .event == "repository_dispatch"
                    and .path == ".github/workflows/recover-stale-ops.yml"
                    and .head_branch == "master"
                    and (.run_attempt // 1) == 1
                    and .conclusion == "success"
                    and ((.name // .display_title // "") | contains(" / " + $path))
                  )
              ]
              | map(. + {heartbeat_key: (.name // .display_title // "")})
              | group_by(.heartbeat_key)
              | map(max_by(.created_at))
              | sort_by(.created_at) | reverse | .[:2]
            ' "$receipt_runs_file" > "$selected_file"

            : > "$evidence_ndjson"
            while IFS= read -r receipt; do
              receipt_name="$(jq -r '.name // .display_title // empty' <<< "$receipt")"
              source_run_id="$(sed -nE 's/^.*source ([1-9][0-9]*) \/ \.github\/workflows\/[^[:space:]]+$/\1/p' <<< "$receipt_name")"
              if [[ ! "$source_run_id" =~ ^[1-9][0-9]*$ ]]; then
                echo "::warning::Skipping Platform receipt with an unparseable source run name: ${receipt_name}"
                continue
              fi

              source_file="${RUNNER_TEMP}/${label}-source-${source_run_id}.json"
              http_code="$(curl --silent --show-error --location --retry 3 --retry-delay 1 --retry-max-time 20 \
                --connect-timeout 5 --max-time 15 \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "User-Agent: platform-infra-tce-heartbeat-verifier" \
                --output "$source_file" --write-out '%{http_code}' \
                "https://api.github.com/repos/phanthienquoc/TCE-dashboard/actions/runs/${source_run_id}" || true)"
              if [[ "$http_code" != "200" ]]; then
                echo "::warning::Unable to verify TCE source run #${source_run_id} by ID (HTTP ${http_code}); receipt is not counted."
                continue
              fi

              evidence_item="$(jq -cn --argjson receipt "$receipt" --slurpfile source "$source_file" \
                '{receipt:$receipt,source_run:$source[0]}')"
              printf '%s\n' "$evidence_item" >> "$evidence_ndjson"
            done < <(jq -c '.[]' "$selected_file")

            jq -s '{receipts: .}' "$evidence_ndjson" > "$evidence_file"
            python3 scripts/verify-tce-heartbeat-receipts.py \
              --receipts-file "$evidence_file" \
              --workflow-path "$workflow_path" \
              --branch master \
              --output-runs-file "$output_file" \
              --warn-only
          }

          collect_tce_schedule_history \
            ".github/workflows/wf-06-tce-healthcheck.yml" \
            "tce-wf06" \
            "${RUNNER_TEMP}/tce-wf06-scheduled-runs.json"
          collect_tce_schedule_history \
            ".github/workflows/wf-12-tce-healthcheck-schedule-watchdog.yml" \
            "tce-wf12" \
            "${RUNNER_TEMP}/tce-wf12-scheduled-runs.json"

      - name: Observe TCE WF-06 schedule delivery from verified heartbeat receipts
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          set -euo pipefail
          reference_epoch="${WATCHDOG_REFERENCE_EPOCH:-}"
          if [[ -z "$reference_epoch" ]]; then
            current_run="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            reference_epoch="$(jq -r 'if .created_at then (.created_at | fromdateiso8601) else empty end' <<< "$current_run")"
          fi
          python3 scripts/verify-tce-schedule-delivery.py \
            --runs-file "${RUNNER_TEMP}/tce-wf06-scheduled-runs.json" \
            --http-status 200 \
            --reference-epoch "${reference_epoch:-0}" \
            --max-age-minutes "$MAX_TCE_WF06_AGE_MINUTES" \
            --warn-only

      - name: Verify native schedule inter-arrival gaps
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          reference_epoch="${WATCHDOG_REFERENCE_EPOCH:-}"
          if [[ -z "$reference_epoch" ]]; then
            current_run="$(gh api \
              -X GET \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            reference_epoch="$(jq -r 'if .created_at then (.created_at | fromdateiso8601) else empty end' <<< "$current_run")"
          fi
          [[ "$reference_epoch" =~ ^[0-9]+$ ]] || {
            echo "::error::Unable to obtain the watchdog API reference timestamp for native schedule-gap checks."
            exit 1
          }

          warn_args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            warn_args+=(--warn-only)
          fi

          # Aggregate all Platform schedule failures. With errexit, a single stale
          # workflow previously stopped this step before the remaining schedules
          # were measured, hiding useful evidence from the same watchdog run.
          schedule_gap_failures=()
          schedule_gap_warnings=()

          verify_platform_schedule_gap() {
            local workflow_file="$1"
            local max_gap_minutes="$2"
            local runs_file="$RUNNER_TEMP/${workflow_file%.yml}-native-schedule-runs.json"
            local response
            if ! response="$(gh api \
              -X GET \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs" \
              -f event=schedule \
              -f branch=master \
              -F per_page=100 2>&1)"; then
              if (( ${#warn_args[@]} > 0 )); then
                echo "::warning::Unable to query native schedule history for ${workflow_file}: ${response}"
                schedule_gap_warnings+=("${workflow_file}: Actions API query failed")
              else
                echo "::error::Unable to query native schedule history for ${workflow_file}: ${response}"
                schedule_gap_failures+=("${workflow_file}: Actions API query failed")
              fi
              return 0
            fi
            printf '%s\n' "$response" > "$runs_file"
            local verifier_output
            local verifier_status=0
            verifier_output="$(python3 scripts/verify-native-schedule-gap.py \
              --runs-file "$runs_file" \
              --workflow-path ".github/workflows/${workflow_file}" \
              --branch master \
              --reference-epoch "$reference_epoch" \
              --max-gap-minutes "$max_gap_minutes" \
              "${warn_args[@]}" 2>&1)" || verifier_status=$?
            printf '%s\n' "$verifier_output"

            if (( verifier_status != 0 )); then
              schedule_gap_failures+=("${workflow_file}")
              echo "::error::Native schedule acceptance failed for ${workflow_file}; continuing to inspect the remaining workflows."
            elif [[ "$verifier_output" == *"::warning::Native schedule inter-arrival observation:"* ]]; then
              schedule_gap_warnings+=("${workflow_file}")
            fi
          }

          verify_platform_schedule_gap reconcile-vps.yml "$MAX_AGE_MINUTES"
          verify_platform_schedule_gap inspect-vps.yml "$MAX_INSPECTION_AGE_MINUTES"
          verify_platform_schedule_gap recover-stale-ops.yml "$MAX_RECOVERY_AGE_MINUTES"
          verify_platform_schedule_gap reconcile-schedule-watchdog.yml "$MAX_WATCHDOG_AGE_MINUTES"

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            for spec in \
              ".github/workflows/wf-06-tce-healthcheck.yml|tce-wf06|$MAX_TCE_WF06_AGE_MINUTES" \
              ".github/workflows/wf-12-tce-healthcheck-schedule-watchdog.yml|tce-wf12|$MAX_TCE_WF12_GAP_MINUTES"; do
              IFS='|' read -r workflow_path label max_gap_minutes <<< "$spec"
              python3 scripts/verify-native-schedule-gap.py \
                --runs-file "${RUNNER_TEMP}/${label}-scheduled-runs.json" \
                --http-status 200 \
                --workflow-path "$workflow_path" \
                --branch master \
                --reference-epoch "$reference_epoch" \
                --max-gap-minutes "$max_gap_minutes" \
                --warn-only
            done
          else
            echo "::notice::TCE heartbeat history collection is skipped for diagnostic push/workflow_run events."
            echo "::notice::No TCE cadence acceptance is inferred."
          fi

          if (( ${#schedule_gap_failures[@]} > 0 )); then
            printf '::error::Native Platform schedule acceptance failed for: %s\n' "${schedule_gap_failures[*]}"
            exit 1
          fi
          if (( ${#warn_args[@]} > 0 )); then
            if (( ${#schedule_gap_warnings[@]} > 0 )); then
              echo "::notice::Read-only push smoke: native schedule observations are warning-only."
              printf '::notice::No cadence acceptance asserted; observed: %s\n' "${schedule_gap_warnings[*]}"
            else
              echo "Read-only push smoke completed; no Platform schedule warnings were observed. TCE observations remain warning-only."
            fi
          else
            echo "All Platform native schedule inter-arrival checks passed."
          fi
