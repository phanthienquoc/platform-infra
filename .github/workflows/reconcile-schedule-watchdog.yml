name: Reconcile Schedule Freshness Watchdog
run-name: Reconcile Schedule Freshness Watchdog — ${{ github.event_name }}

'on':
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
  # Exercise the read-only GitHub API path after a watchdog change lands.
  # Push runs are diagnostic smoke tests; scheduled/manual/fallback runs enforce freshness.
  push:
    branches: [master]
    paths:
      - ".github/workflows/reconcile-schedule-watchdog.yml"
  # Check freshness after scheduled reconcile/inspection runs and the independent hourly mirror heartbeat.
  workflow_run:
    workflows:
      - inspect-vps
      - reconcile-vps
      - Mirror locally-uncensored into private repository
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: reconcile-schedule-freshness-watchdog
  cancel-in-progress: false

jobs:
  verify:
    name: Verify scheduled reconciliation freshness
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_AGE_MINUTES: "45"
      MAX_QUEUE_MINUTES: "15"
      MAX_INSPECTION_AGE_MINUTES: "75"
    steps:
      - name: Verify reconcile-vps workflow is enabled
        shell: bash
        run: |
          set -euo pipefail
          workflow="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/reconcile-vps.yml")"
          state="$(jq -r '.state // empty' <<< "$workflow")"
          if [[ "$state" != "active" ]]; then
            echo "::error::reconcile-vps workflow is not active (state=${state:-missing}); scheduled events cannot be relied on."
            exit 1
          fi
          echo "reconcile-vps workflow state: active"

      - name: Inspect latest scheduled reconcile run
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/reconcile-vps.yml/runs" \
            -f event=schedule \
            -F per_page=1)"
          latest="$(jq -c '.workflow_runs | sort_by(.created_at) | last // empty' <<< "$response")"
          if [[ -z "$latest" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded, but no scheduled reconcile-vps run is present yet."
              exit 0
            fi
            echo "::error::No scheduled reconcile-vps run is available in GitHub Actions history."
            exit 1
          fi

          # Use the current watchdog run's GitHub API timestamp as the reference clock.
          # Hosted runner wall clocks can differ from Actions API timestamps; comparing
          # two API-created timestamps avoids false future-run and queue-delay failures.
          current_run="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          reference_at="$(jq -r '.created_at // empty' <<< "$current_run")"
          reference_epoch="$(jq -r 'if .created_at then (.created_at | fromdateiso8601) else empty end' <<< "$current_run")"
          if [[ -z "$reference_at" || -z "$reference_epoch" ]]; then
            echo "::error::Unable to obtain the current watchdog run timestamp from the Actions API."
            exit 1
          fi
          echo "WATCHDOG_REFERENCE_EPOCH=$reference_epoch" >> "$GITHUB_ENV"

          created_at="$(jq -r '.created_at' <<< "$latest")"
          created_epoch="$(jq -r '.created_at | fromdateiso8601' <<< "$latest")"
          run_id="$(jq -r '.id' <<< "$latest")"
          run_url="$(jq -r '.html_url' <<< "$latest")"
          status="$(jq -r '.status' <<< "$latest")"
          conclusion="$(jq -r '.conclusion // "pending"' <<< "$latest")"
          age_seconds=$((reference_epoch - created_epoch))
          age_minutes=$((age_seconds / 60))
          run_attempt="$(jq -r '.run_attempt // 1' <<< "$latest")"
          queue_measurable=true
          if (( run_attempt > 1 )); then
            # GitHub keeps created_at from the original run but updates run_started_at
            # for a re-run attempt. Their difference is not runner queue time.
            queue_measurable=false
            queue_seconds=0
            queue_minutes=0
            echo "::notice::Reconcile #${run_id} attempt ${run_attempt}: queue not measurable; freshness uses original created_at."
          else
            started_at="$(jq -r '.run_started_at // empty' <<< "$latest")"
            if [[ -n "$started_at" ]]; then
              started_epoch="$(jq -r '.run_started_at | fromdateiso8601' <<< "$latest")"
            else
              # A queued run has not acquired a runner yet; measure its wait to this
              # watchdog run API timestamp, not the hosted runner wall clock.
              started_epoch="$reference_epoch"
            fi
            queue_seconds=$((started_epoch - created_epoch))
            queue_minutes=$((queue_seconds / 60))
          fi

          if (( age_seconds < 0 )); then
            echo "::error::GitHub returned a future timestamp for scheduled reconcile run #${run_id}: ${created_at}"
            exit 1
          fi
          if [[ "$queue_measurable" == true ]] && (( queue_seconds < 0 )); then
            echo "::error::GitHub returned a run_started_at earlier than created_at for scheduled reconcile #${run_id}."
            exit 1
          fi
          if [[ "$queue_measurable" == true ]] && (( queue_minutes > MAX_QUEUE_MINUTES )); then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded; latest scheduled reconcile runner queue delay exceeds ${MAX_QUEUE_MINUTES}m."
              echo "::warning::Latest run #${run_id}: queue_wait=${queue_minutes}m status=${status}."
              echo "::warning::Run evidence: ${run_url}"
            else
              echo "::error::Scheduled reconcile #${run_id} waited ${queue_minutes}m for a runner."
              echo "::error::Queue budget=${MAX_QUEUE_MINUTES}m; status=${status}."
              echo "::error::created_at=${created_at}, run_started_at=${started_at:-not-started}."
              echo "::error::Run evidence: ${run_url}"
              exit 1
            fi
          fi
          if (( age_minutes > MAX_AGE_MINUTES )); then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded; latest scheduled reconcile is stale."
              echo "::warning::Latest run #${run_id}: created=${created_at}, age=${age_minutes}m."
              echo "::warning::status=${status}, conclusion=${conclusion}."
              echo "::warning::Run evidence: ${run_url}"
              exit 0
            fi
            echo "::error::No scheduled reconcile-vps run within ${MAX_AGE_MINUTES} minutes."
            echo "::error::Latest run #${run_id}: created=${created_at}, age=${age_minutes}m."
            echo "::error::status=${status}, conclusion=${conclusion}."
            echo "::error::Run evidence: ${run_url}"
            exit 1
          fi

          echo "Scheduled reconcile freshness passed for run #${run_id}."
          if [[ "$queue_measurable" == true ]]; then
            echo "age=${age_minutes}m queue_wait=${queue_minutes}m status=${status} conclusion=${conclusion}."
          else
            echo "age=${age_minutes}m queue_wait=not-measurable (run_attempt=${run_attempt}) status=${status} conclusion=${conclusion}."
          fi
          echo "Age reference: watchdog run #${GITHUB_RUN_ID} created=${reference_at} (GitHub Actions API clock)."
          echo "Run evidence: ${run_url}"

      - name: Report latest scheduled inspection runner queue delay
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/inspect-vps.yml/runs" \
            -f event=schedule \
            -F per_page=1)"
          latest="$(jq -c '.workflow_runs | sort_by(.created_at) | last // empty' <<< "$response")"
          if [[ -z "$latest" ]]; then
            echo "::warning::No scheduled inspect-vps run is available for runner queue diagnostics."
            exit 0
          fi

          # The freshness step normally exports this value. Fetch it again when that
          # step failed early (disabled workflow or empty reconcile history), so queue
          # telemetry still runs after the enforcement failure.
          reference_epoch="${WATCHDOG_REFERENCE_EPOCH:-}"
          if [[ -z "$reference_epoch" ]]; then
            current_run="$(gh api \
              -X GET \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")" || {
                echo "::warning::Unable to fetch watchdog run metadata; inspection queue telemetry is unavailable."
                exit 0
              }
            reference_epoch="$(jq -r 'if .created_at then (.created_at | fromdateiso8601) else empty end' <<< "$current_run")"
            if [[ -z "$reference_epoch" ]]; then
              echo "::warning::Watchdog run metadata has no usable created_at; inspection queue telemetry is unavailable."
              exit 0
            fi
          fi

          run_attempt="$(jq -r '.run_attempt // 1' <<< "$latest")"
          if (( run_attempt > 1 )); then
            echo "::warning::Inspection rerun attempt ${run_attempt}: queue not measurable; created_at is original."
            exit 0
          fi
          created_at="$(jq -r '.created_at' <<< "$latest")"
          created_epoch="$(jq -r '.created_at | fromdateiso8601' <<< "$latest")"
          started_at="$(jq -r '.run_started_at // empty' <<< "$latest")"
          if [[ -n "$started_at" ]]; then
            started_epoch="$(jq -r '.run_started_at | fromdateiso8601' <<< "$latest")"
          else
            started_epoch="$reference_epoch"
          fi
          queue_seconds=$((started_epoch - created_epoch))
          queue_minutes=$((queue_seconds / 60))
          run_id="$(jq -r '.id' <<< "$latest")"
          run_url="$(jq -r '.html_url' <<< "$latest")"
          status="$(jq -r '.status' <<< "$latest")"

          if (( queue_seconds < 0 )); then
            echo "::warning::Inspection run #${run_id} has an invalid negative queue duration."
            exit 0
          fi
          echo "Latest scheduled inspect-vps run #${run_id}: queue_wait=${queue_minutes}m status=${status}."
          echo "created_at=${created_at} started_at=${started_at:-not-started}."
          if (( queue_minutes > MAX_QUEUE_MINUTES )); then
            echo "::warning::Self-hosted inspection runner queue delay exceeds ${MAX_QUEUE_MINUTES}m."
            echo "::warning::Run evidence: ${run_url}"
          fi

      - name: Verify scheduled inspection delivery
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          workflow="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/inspect-vps.yml")"
          state="$(jq -r '.state // empty' <<< "$workflow")"
          if [[ "$state" != "active" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded; inspect-vps workflow is not active (state=${state:-missing})."
              exit 0
            fi
            echo "::error::inspect-vps workflow is not active (state=${state:-missing}); scheduled inspection cannot be relied on."
            exit 1
          fi

          response="$(gh api \
            -X GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/inspect-vps.yml/runs" \
            -f event=schedule \
            -F per_page=1)"
          latest="$(jq -c '.workflow_runs | sort_by(.created_at) | last // empty' <<< "$response")"
          if [[ -z "$latest" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded, but no scheduled inspect-vps run is present yet."
              exit 0
            fi
            echo "::error::No scheduled inspect-vps run is available in GitHub Actions history."
            exit 1
          fi

          reference_epoch="${WATCHDOG_REFERENCE_EPOCH:-}"
          if [[ -z "$reference_epoch" ]]; then
            current_run="$(gh api \
              -X GET \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            reference_epoch="$(jq -r 'if .created_at then (.created_at | fromdateiso8601) else empty end' <<< "$current_run")"
          fi
          if [[ -z "$reference_epoch" ]]; then
            echo "::error::Unable to obtain the current watchdog run timestamp from the Actions API."
            exit 1
          fi

          created_at="$(jq -r '.created_at' <<< "$latest")"
          created_epoch="$(jq -r '.created_at | fromdateiso8601' <<< "$latest")"
          run_id="$(jq -r '.id' <<< "$latest")"
          run_url="$(jq -r '.html_url' <<< "$latest")"
          status="$(jq -r '.status' <<< "$latest")"
          conclusion="$(jq -r '.conclusion // "pending"' <<< "$latest")"
          age_seconds=$((reference_epoch - created_epoch))
          age_minutes=$((age_seconds / 60))

          if (( age_seconds < 0 )); then
            echo "::error::GitHub returned a future timestamp for scheduled inspect-vps run #${run_id}: ${created_at}"
            exit 1
          fi
          if (( age_minutes > MAX_INSPECTION_AGE_MINUTES )); then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::warning::Read-only API smoke succeeded; scheduled inspect-vps is stale."
              echo "::warning::Latest run #${run_id}: created=${created_at}, age=${age_minutes}m."
              echo "::warning::status=${status}, conclusion=${conclusion}."
              echo "::warning::Run evidence: ${run_url}"
              exit 0
            fi
            echo "::error::No scheduled inspect-vps run within ${MAX_INSPECTION_AGE_MINUTES} minutes."
            echo "::error::Latest run #${run_id}: created=${created_at}, age=${age_minutes}m."
            echo "::error::status=${status}, conclusion=${conclusion}."
            echo "::error::Run evidence: ${run_url}"
            exit 1
          fi

          echo "Scheduled inspection delivery passed for run #${run_id}."
          echo "age=${age_minutes}m status=${status} conclusion=${conclusion}."
          echo "Run evidence: ${run_url}"
