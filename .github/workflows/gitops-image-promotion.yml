name: GitOps Image Promotion
run-name: GitOps Image Promotion — ${{ inputs.app || github.event.client_payload.app }} / ${{ inputs.component || github.event.client_payload.component }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: Application to promote
        required: true
        type: choice
        options:
          - stockdividend
          - tce-dashboard
      component:
        description: Image component
        required: true
        type: string
      tag:
        description: Immutable image tag
        required: true
        type: string
  repository_dispatch:
    types:
      - image-published

permissions:
  contents: write
  pull-requests: write
  packages: read

concurrency:
  group: gitops-image-promotion-${{ github.event.client_payload.app || inputs.app }}-${{ github.event.client_payload.component || inputs.component }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ github.event.client_payload.app || inputs.app }}/${{ github.event.client_payload.component || inputs.component }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve event inputs
        id: input
        env:
          EVENT_APP: ${{ github.event.client_payload.app }}
          EVENT_COMPONENT: ${{ github.event.client_payload.component }}
          EVENT_TAG: ${{ github.event.client_payload.tag }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_COMPONENT: ${{ inputs.component }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          APP="${EVENT_APP:-$INPUT_APP}"
          COMPONENT="${EVENT_COMPONENT:-$INPUT_COMPONENT}"
          TAG="${EVENT_TAG:-$INPUT_TAG}"

          case "$APP/$COMPONENT" in
            stockdividend/backend|stockdividend/admin|tce-dashboard/web|tce-dashboard/service) ;;
            *)
              echo "::error::Unsupported image target: $APP/$COMPONENT"
              exit 1
              ;;
          esac

          case "$APP" in
            tce-dashboard)
              [[ "$TAG" =~ ^prod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7,64}$ ]] || {
                echo "::error::TCE tag must be prod-v<semver>-<git-sha>"
                exit 1
              }
              ;;
            stockdividend)
              [[ "$TAG" =~ ^[0-9a-f]{7,64}$ ]] || {
                echo "::error::StockDividend tag must be an immutable Git SHA"
                exit 1
              }
              ;;
          esac

          {
            echo "app=$APP"
            echo "component=$COMPONENT"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Validate promoted image in GHCR
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          APP: ${{ steps.input.outputs.app }}
          COMPONENT: ${{ steps.input.outputs.component }}
          TAG: ${{ steps.input.outputs.tag }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/phanthienquoc/${APP}/${COMPONENT}:${TAG}"
          echo "Validating $IMAGE"

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

          docker manifest inspect "$IMAGE" >/dev/null
          echo "Validated GHCR image manifest: $IMAGE"

          docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Update Kustomize image tag
        env:
          APP: ${{ steps.input.outputs.app }}
          COMPONENT: ${{ steps.input.outputs.component }}
          TAG: ${{ steps.input.outputs.tag }}
        run: |
          set -euo pipefail

          if [ "$APP" = "stockdividend" ]; then
            FILE="apps/stockdividend/overlays/prod/kustomization.yaml"
          else
            FILE="apps/tce-dashboard/overlays/prod/kustomization.yaml"
          fi

          python3 - "$FILE" "$APP" "$COMPONENT" "$TAG" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          app = sys.argv[2]
          component = sys.argv[3]
          tag = sys.argv[4]

          lines = path.read_text().splitlines()
          expected = f"ghcr.io/phanthienquoc/{app}/{component}"

          for index, line in enumerate(lines):
              if line.strip() not in {f"- name: {expected}", f"name: {expected}"}:
                  continue

              if index + 1 >= len(lines) or not lines[index + 1].strip().startswith("newTag:"):
                  raise SystemExit(f"newTag missing after {expected}")

              indent = lines[index + 1][:len(lines[index + 1]) - len(lines[index + 1].lstrip())]
              lines[index + 1] = f"{indent}newTag: {tag}"
              path.write_text("\n".join(lines) + "\n")
              break
          else:
              raise SystemExit(f"image component not found: {expected}")
          PY

          grep -A1 "name: ghcr.io/phanthienquoc/${APP}/${COMPONENT}" "$FILE"

      - name: Create promotion PR
        id: promotion
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/promote-${{ steps.input.outputs.app }}-${{ steps.input.outputs.component }}-${{ steps.input.outputs.tag }}
          delete-branch: true
          title: "chore: promote ${{ steps.input.outputs.app }}/${{ steps.input.outputs.component }} ${{ steps.input.outputs.tag }}"
          commit-message: "chore: promote ${{ steps.input.outputs.app }}/${{ steps.input.outputs.component }} ${{ steps.input.outputs.tag }}"
          body: |
            Automated immutable image promotion from application CI.

            Source:
            - application: ${{ steps.input.outputs.app }}
            - component: ${{ steps.input.outputs.component }}
            - image tag: ${{ steps.input.outputs.tag }}

      - name: Validate promotion PR checks
        if: steps.promotion.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          echo "Waiting for required validation checks on PR #$PR_NUMBER."
          for attempt in $(seq 1 30); do
            state="$(gh pr checks "$PR_NUMBER" --repo "$REPO" --required --json state --jq 'if length == 0 then "PENDING" elif any(.[]; .state == "FAILURE" or .state == "ERROR") then "FAILURE" elif all(.[]; .state == "SUCCESS") then "SUCCESS" else "PENDING" end' 2>/dev/null || echo PENDING)"
            echo "Promotion PR check state: $state (attempt $attempt/30)"
            case "$state" in
              SUCCESS) exit 0 ;;
              FAILURE) echo "::error::Required promotion PR checks failed."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Required promotion PR checks did not complete within the validation window."
          exit 1

      - name: Merge promotion PR
        if: steps.promotion.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion.outputs.pull-request-number }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          MAX_ATTEMPTS=4

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Merge attempt $attempt/$MAX_ATTEMPTS for PR #$PR_NUMBER"

            if gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch; then
              echo "Promotion PR #$PR_NUMBER merged successfully."
              exit 0
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Promotion PR #$PR_NUMBER could not be merged after $MAX_ATTEMPTS attempts."
              exit 1
            fi

            echo "Base branch changed or merge was temporarily unavailable; updating PR branch before retry."
            gh pr update-branch "$PR_NUMBER" --repo "$REPO" --rebase

            for wait in 1 2 3 4 5; do
              sleep 2
              state="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeStateStatus --jq '.mergeStateStatus')"
              echo "PR merge state after branch update: $state"
              case "$state" in
                CLEAN|BEHIND|UNSTABLE) break ;;
              esac
            done
          done
      - name: Determine release readiness
        id: release
        if: success()
        env:
          APP: ${{ steps.input.outputs.app }}
          TAG: ${{ steps.input.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$APP" = "stockdividend" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "release=$TAG" >> "$GITHUB_OUTPUT"
            echo "StockDividend promotion is independently deployable."
            exit 0
          fi
          FILE="apps/tce-dashboard/overlays/prod/kustomization.yaml"
          WEB_TAG="$(awk '/name: ghcr.io\/phanthienquoc\/tce-dashboard\/web$/ {found=1; next} found && /newTag:/ {print $2; exit}' "$FILE")"
          SERVICE_TAG="$(awk '/name: ghcr.io\/phanthienquoc\/tce-dashboard\/service$/ {found=1; next} found && /newTag:/ {print $2; exit}' "$FILE")"
          echo "TCE GitOps web tag: $WEB_TAG"
          echo "TCE GitOps service tag: $SERVICE_TAG"
          if [ -n "$WEB_TAG" ] && [ "$WEB_TAG" = "$SERVICE_TAG" ] && [ "$WEB_TAG" = "$TAG" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "release=$TAG" >> "$GITHUB_OUTPUT"
            echo "TCE release is complete: both components point to $TAG."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "release=$TAG" >> "$GITHUB_OUTPUT"
            echo "TCE release is not complete yet; waiting for the paired component."
          fi

      - name: Trigger VPS reconciliation
        if: steps.release.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ steps.input.outputs.app }}
          COMPONENT: ${{ steps.input.outputs.component }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type="gitops-release-ready" \
            -f client_payload[app]="$APP" \
            -f client_payload[component]="$COMPONENT" \
            -f client_payload[release]="$RELEASE"
          echo "Triggered one VPS reconciliation for $APP release $RELEASE."
