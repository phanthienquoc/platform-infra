# yamllint disable rule:line-length
name: GitOps Image Promotion
run-name: GitOps Image Promotion — ${{ inputs.app || github.event.client_payload.app || github.event.action || github.event_name }} / ${{ inputs.component || github.event.client_payload.component || github.event.client_payload.release || github.event.client_payload.commit || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: Application to promote
        required: true
        type: choice
        options:
          - stockdividend
          - tce-dashboard
          - media-generation
          - auth-service
      component:
        description: Image component
        required: true
        type: string
      tag:
        description: Immutable image tag
        required: true
        type: string
  repository_dispatch:
    types:
      - image-published
      - tce-release-requested
      - media-release-requested
      - auth-image-published
      - microfe-images-published

permissions:
  contents: write
  pull-requests: write
  packages: read

concurrency:
  group: gitops-image-promotion-${{ github.event.client_payload.app || inputs.app }}-${{ github.event.client_payload.component || inputs.component }}
  cancel-in-progress: false

jobs:
  reject-non-master-manual-run:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
    name: Reject manual promotion outside master
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed for non-master manual promotion
        run: |
          echo "::error::Manual GitOps image promotion must run from refs/heads/master. Select master as the workflow ref."
          exit 1

  promote-microfe-digests:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'microfe-images-published'
    name: Promote MicroFE image digests as one GitOps change
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: true

      - name: Validate and resolve MicroFE digests
        id: digests
        env:
          AUTH_DIGEST: ${{ github.event.client_payload.auth_digest }}
          SHELL_DIGEST: ${{ github.event.client_payload.shell_digest }}
          WS_DIGEST: ${{ github.event.client_payload.ws_digest }}
          SOURCE_COMMIT: ${{ github.event.client_payload.commit }}
          RELEASE_INPUT: ${{ github.event.client_payload.release }}
        run: |
          set -euo pipefail
          # Auth is now released by phanthienquoc-authentication under the canonical
          # auth-service/auth image. Validate the legacy digest for contract safety,
          # but do not override the canonical Auth workload with microfe-auth.
          for digest in "$AUTH_DIGEST" "$SHELL_DIGEST" "$WS_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::Every MicroFE payload digest must be sha256:<64 hex>'; exit 1; }
          done
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Missing or invalid source commit SHA'; exit 1; }
          EXPECTED_RELEASE="microfe-${SOURCE_COMMIT:0:7}"
          [[ "$RELEASE_INPUT" == "$EXPECTED_RELEASE" ]] || {
            echo "::error::MicroFE release label must equal $EXPECTED_RELEASE derived from the full source commit SHA."
            exit 1
          }
          {
            echo "shell_digest=$SHELL_DIGEST"
            echo "ws_digest=$WS_DIGEST"
            echo "source_commit=$SOURCE_COMMIT"
            echo "release=$EXPECTED_RELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Validate promoted MicroFE images in GHCR
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          SHELL_DIGEST: ${{ steps.digests.outputs.shell_digest }}
          WS_DIGEST: ${{ steps.digests.outputs.ws_digest }}
        run: |
          set -euo pipefail
          if [[ -z "$GHCR_USERNAME" || -z "$GHCR_TOKEN" ]]; then
            echo "::error::Configure GHCR_READ_TOKEN with read:packages access to the promoted private images."
            exit 1
          fi
          TARGET_APP=microfe GHCR_USERNAME="$GHCR_USERNAME" GHCR_TOKEN="$GHCR_TOKEN" bash scripts/validate-ghcr-pull-access.sh
          for image in "ghcr.io/phanthienquoc/microfe-shell@$SHELL_DIGEST" "ghcr.io/phanthienquoc/microfe-ws@$WS_DIGEST"; do
            GHCR_USERNAME="$GHCR_USERNAME" GHCR_TOKEN="$GHCR_TOKEN" GHCR_IMAGE_REFERENCE="$image" bash scripts/validate-ghcr-image-reference.sh
          done

      - name: Update MicroFE Kustomize image digests
        env:
          SHELL_DIGEST: ${{ steps.digests.outputs.shell_digest }}
          WS_DIGEST: ${{ steps.digests.outputs.ws_digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path('platform/microfe/kustomization.yaml')
          text = path.read_text()
          images = {
              'ghcr.io/phanthienquoc/microfe-shell': os.environ['SHELL_DIGEST'],
              'ghcr.io/phanthienquoc/microfe-ws': os.environ['WS_DIGEST'],
          }
          lines = text.splitlines()
          if any(line.strip() == 'images:' for line in lines):
              raise SystemExit('Unexpected existing images block; refusing ambiguous update')
          text = text.rstrip() + '\n\nimages:\n'
          for name, digest in images.items():
              text += f'- name: {name}\n  newName: {name}\n  digest: {digest}\n'
          path.write_text(text)
          PY
          kubectl kustomize platform/microfe > /tmp/microfe-rendered.yaml
          grep -Eq 'image: ghcr.io/phanthienquoc/microfe-shell@sha256:[0-9a-f]{64}' /tmp/microfe-rendered.yaml
          grep -Eq 'image: ghcr.io/phanthienquoc/microfe-ws@sha256:[0-9a-f]{64}' /tmp/microfe-rendered.yaml

      - name: Scope MicroFE promotion changes
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'platform/microfe/kustomization.yaml' || {
            echo '::error::MicroFE promotion must change only platform/microfe/kustomization.yaml'
            git diff --name-only
            exit 1
          }

      - name: Create MicroFE promotion PR
        id: promotion
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7
        with:
          branch: automation/promote-microfe-${{ steps.digests.outputs.source_commit }}
          delete-branch: true
          title: 'chore: promote MicroFE digests ${{ steps.digests.outputs.release }}'
          commit-message: 'chore: promote MicroFE digests ${{ steps.digests.outputs.release }}'
          body: |
            Automated atomic MicroFE digest promotion from TCE-dashboard CI.

            - Shell digest: `${{ steps.digests.outputs.shell_digest }}`
            - WS digest: `${{ steps.digests.outputs.ws_digest }}`
            - Source commit: `${{ steps.digests.outputs.source_commit }}`

            Auth is managed independently by `phanthienquoc-authentication` using the canonical `auth-service/auth` image.

      - name: Validate promotion PR checks
        id: validate-pr-checks
        if: steps.promotion.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          PR_HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Could not resolve the promotion PR head SHA'; exit 1; }

          state="PENDING"
          seen_required_checks=0
          for attempt in $(seq 1 30); do
            required="$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --required --json state 2>/dev/null || printf '[]')"
            current_required_count="$(printf '%s' "$required" | jq 'length')"
            if [ "$current_required_count" -eq 0 ]; then
              if [ "$seen_required_checks" -eq 1 ]; then
                echo '::error::Required MicroFE promotion checks disappeared or could not be queried; refusing to merge.'
                exit 1
              fi
              echo "Required MicroFE checks are not visible yet (attempt $attempt/30)."
              sleep 10
              continue
            fi
            seen_required_checks=1
            state="$(printf '%s' "$required" | jq -r 'if any(.[]; .state == "FAILURE" or .state == "ERROR") then "FAILURE" elif all(.[]; .state == "SUCCESS") then "SUCCESS" else "PENDING" end')"
            case "$state" in
              SUCCESS) break ;;
              FAILURE) echo '::error::MicroFE promotion PR checks failed'; exit 1 ;;
            esac
            sleep 10
          done
          if [ "$seen_required_checks" -eq 0 ]; then
            echo '::error::No required MicroFE promotion PR checks appeared; refusing to merge.'
            exit 1
          fi
          if [ "$state" != "SUCCESS" ]; then
            echo '::error::MicroFE promotion checks did not complete in time'
            exit 1
          fi

          CURRENT_HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          if [ "$CURRENT_HEAD_SHA" != "$PR_HEAD_SHA" ]; then
            echo '::error::MicroFE promotion PR head changed while checks were running; refusing to merge an unverified commit.'
            exit 1
          fi
          echo "head_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Merge MicroFE promotion PR
        if: steps.promotion.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.validate-pr-checks.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "$HEAD_SHA" || { echo '::error::Verified promotion PR head SHA is missing'; exit 1; }
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA"

      - name: Trigger shared VPS reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.digests.outputs.release }}
        run: |
          set -euo pipefail
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='gitops-promoted-ready' \
            -f 'client_payload[app]=microfe' \
            -f 'client_payload[component]=release' \
            -f "client_payload[release]=$RELEASE"

  fanout-tce-release:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'tce-release-requested'
    name: Fan out TCE release
    runs-on: ubuntu-latest
    steps:
      - name: Validate release contract
        env:
          APP: ${{ github.event.client_payload.app }}
          RELEASE: ${{ github.event.client_payload.release }}
        run: |
          set -euo pipefail
          test "$APP" = "tce-dashboard" || { echo "::error::Unsupported release application: $APP"; exit 1; }
          [[ "$RELEASE" =~ ^prod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7,64}$ ]] || {
            echo "::error::TCE release must be prod-v<semver>-<git-sha>"
            exit 1
          }

      - name: Dispatch both TCE image promotions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event.client_payload.release }}
        run: |
          set -euo pipefail
          for component in web service; do
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/dispatches" \
              -f event_type="image-published" \
              -f "client_payload[app]=tce-dashboard" \
              -f "client_payload[component]=$component" \
              -f "client_payload[tag]=$RELEASE"
            echo "Dispatched TCE $component promotion for $RELEASE"
          done

  coordinate-tce-release:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'tce-release-requested'
    name: Coordinate TCE release
    needs: fanout-tce-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: true

      - name: Wait for paired GitOps release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event.client_payload.release }}
        run: |
          set -euo pipefail
          FILE="apps/tce-dashboard/overlays/prod/kustomization.yaml"
          MAX_ATTEMPTS=60
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            git fetch --no-tags origin master
            WEB_TAG="$(git show "origin/master:$FILE" | sed -n '/name: ghcr.io\/phanthienquoc\/tce-dashboard\/web$/,/newTag:/p' | awk '/newTag:/ {print $2; exit}')"
            SERVICE_TAG="$(git show "origin/master:$FILE" | sed -n '/name: ghcr.io\/phanthienquoc\/tce-dashboard\/service$/,/newTag:/p' | awk '/newTag:/ {print $2; exit}')"
            echo "Coordinator attempt $attempt/$MAX_ATTEMPTS"
            echo "TCE GitOps web tag: $WEB_TAG"
            echo "TCE GitOps service tag: $SERVICE_TAG"
            if [ "$WEB_TAG" = "$RELEASE" ] && [ "$SERVICE_TAG" = "$RELEASE" ]; then
              echo "TCE release $RELEASE converged on GitOps master."
              gh api --method POST -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/dispatches" \
                -f event_type="gitops-promoted-ready" \
                -f "client_payload[app]=tce-dashboard" \
                -f "client_payload[component]=release" \
                -f "client_payload[release]=$RELEASE"
              echo "Triggered VPS reconciliation for TCE release $RELEASE."
              exit 0
            fi
            sleep 2
          done
          echo "::error::TCE release $RELEASE did not converge on GitOps master within the readiness window."
          exit 1


  fanout-media-release:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'media-release-requested'
    name: Fan out Media release
    runs-on: ubuntu-latest
    steps:
      - name: Validate release contract
        env:
          APP: ${{ github.event.client_payload.app }}
          RELEASE: ${{ github.event.client_payload.release }}
        run: |
          set -euo pipefail
          test "$APP" = "media-generation"
          [[ "$RELEASE" =~ ^prod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7,64}$ ]] || {
            echo "::error::Media release must be prod-v<semver>-<git-sha>"
            exit 1
          }

      - name: Dispatch both Media image promotions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event.client_payload.release }}
        run: |
          set -euo pipefail
          for component in frontend backend; do
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/dispatches" \
              -f event_type="image-published" \
              -f "client_payload[app]=media-generation" \
              -f "client_payload[component]=$component" \
              -f "client_payload[tag]=$RELEASE"
          done

  coordinate-media-release:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'media-release-requested'
    name: Coordinate Media release
    needs: fanout-media-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Wait for paired GitOps release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event.client_payload.release }}
        run: |
          set -euo pipefail
          FILE="apps/media-generation/overlays/prod/kustomization.yaml"
          for _ in $(seq 1 60); do
            git fetch --no-tags origin master
            FRONTEND_TAG="$(git show "origin/master:$FILE" | sed -n '/name: ghcr.io\/phanthienquoc\/media-generation\/frontend$/,/newTag:/p' | awk '/newTag:/ {print $2; exit}')"
            BACKEND_TAG="$(git show "origin/master:$FILE" | sed -n '/name: ghcr.io\/phanthienquoc\/media-generation\/backend$/,/newTag:/p' | awk '/newTag:/ {print $2; exit}')"
            echo "Media frontend: $FRONTEND_TAG"
            echo "Media backend: $BACKEND_TAG"
            if [ "$FRONTEND_TAG" = "$RELEASE" ] && [ "$BACKEND_TAG" = "$RELEASE" ]; then
              gh api --method POST -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/dispatches" \
                -f event_type="gitops-promoted-ready" \
                -f "client_payload[app]=media-generation" \
                -f "client_payload[component]=release" \
                -f "client_payload[release]=$RELEASE"
              echo "Media release converged and VPS reconciliation triggered."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Media release $RELEASE did not converge on GitOps master."
          exit 1

  promote:
    if: (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master') && (github.event_name != 'repository_dispatch' || (github.event.action != 'tce-release-requested' && github.event.action != 'media-release-requested' && github.event.action != 'microfe-images-published'))
    name: Promote ${{ github.event.client_payload.app || inputs.app || github.event.action || github.event_name }} / ${{ github.event.client_payload.component || inputs.component || github.event.client_payload.tag || github.event.client_payload.commit || github.event_name }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Step "Determine release readiness" fetches origin/master after
          # promotion. Keep checkout credentials available so that fetch is
          # authenticated; actions/checkout removes them during post-job cleanup.
          persist-credentials: true

      - name: Resolve event inputs
        id: input
        env:
          EVENT_APP: ${{ github.event.client_payload.app }}
          EVENT_COMPONENT: ${{ github.event.client_payload.component }}
          EVENT_TAG: ${{ github.event.client_payload.tag }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_COMPONENT: ${{ inputs.component }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          APP="${EVENT_APP:-$INPUT_APP}"
          COMPONENT="${EVENT_COMPONENT:-$INPUT_COMPONENT}"
          TAG="${EVENT_TAG:-$INPUT_TAG}"

          case "$APP/$COMPONENT" in
            stockdividend/backend|stockdividend/admin|tce-dashboard/web|tce-dashboard/service|media-generation/backend|media-generation/frontend|auth-service/auth) ;;
            *)
              echo "::error::Unsupported image target: $APP/$COMPONENT"
              exit 1
              ;;
          esac

          case "$APP" in
            media-generation)
              [[ "$TAG" =~ ^prod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7,64}$ ]] || {
                echo "::error::media-generation tag must be prod-v<semver>-<git-sha>"
                exit 1
              }
              ;;
            tce-dashboard)
              [[ "$TAG" =~ ^prod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7,64}$ ]] || {
                echo "::error::TCE tag must be prod-v<semver>-<git-sha>"
                exit 1
              }
              ;;
            auth-service)
              [[ "$TAG" =~ ^prod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7,40}$ ]] || {
                echo "::error::Auth tag must be prod-v<semver>-<short-git-sha>"
                exit 1
              }
              ;;
            stockdividend)
              [[ "$TAG" =~ ^[0-9a-f]{7,64}$ ]] || {
                echo "::error::StockDividend tag must be an immutable Git SHA"
                exit 1
              }
              ;;
          esac

          {
            echo "app=$APP"
            echo "component=$COMPONENT"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Validate promoted image in GHCR
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          APP: ${{ steps.input.outputs.app }}
          COMPONENT: ${{ steps.input.outputs.component }}
          TAG: ${{ steps.input.outputs.tag }}
        run: |
          set -euo pipefail

          if [ "$APP" = "media-generation" ]; then
            IMAGE="ghcr.io/phanthienquoc/media-generation/${COMPONENT}:${TAG}"
          elif [ "$APP" = "auth-service" ]; then
            IMAGE="ghcr.io/phanthienquoc/auth-service/auth:${TAG}"
          else
            IMAGE="ghcr.io/phanthienquoc/${APP}/${COMPONENT}:${TAG}"
          fi
          echo "Validating $IMAGE"
          if [[ -z "$GHCR_USERNAME" || -z "$GHCR_TOKEN" ]]; then
            echo "::error::Configure GHCR_READ_TOKEN with read:packages access to the promoted private images."
            exit 1
          fi

          TARGET_APP="$APP" GHCR_USERNAME="$GHCR_USERNAME" GHCR_TOKEN="$GHCR_TOKEN" bash scripts/validate-ghcr-pull-access.sh

          GHCR_USERNAME="$GHCR_USERNAME" GHCR_TOKEN="$GHCR_TOKEN" GHCR_IMAGE_REFERENCE="$IMAGE" bash scripts/validate-ghcr-image-reference.sh

      - name: Update Kustomize image tag
        env:
          APP: ${{ steps.input.outputs.app }}
          COMPONENT: ${{ steps.input.outputs.component }}
          TAG: ${{ steps.input.outputs.tag }}
        run: |
          set -euo pipefail

          case "$APP" in
            stockdividend) FILE="apps/stockdividend/overlays/prod/kustomization.yaml" ;;
            tce-dashboard) FILE="apps/tce-dashboard/overlays/prod/kustomization.yaml" ;;
            media-generation) FILE="apps/media-generation/overlays/prod/kustomization.yaml" ;;
            auth-service) FILE="platform/auth-service/kustomization.yaml" ;;
            *) echo "::error::Unsupported application: $APP"; exit 1 ;;
          esac

          python3 - "$FILE" "$APP" "$COMPONENT" "$TAG" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          app = sys.argv[2]
          component = sys.argv[3]
          tag = sys.argv[4]

          lines = path.read_text().splitlines()
          expected = (
              "ghcr.io/phanthienquoc/auth-service/auth"
              if app == "auth-service"
              else f"ghcr.io/phanthienquoc/media-generation/{component}"
              if app == "media-generation"
              else f"ghcr.io/phanthienquoc/{app}/{component}"
          )

          for index, line in enumerate(lines):
              if line.strip() not in {f"- name: {expected}", f"name: {expected}"}:
                  continue

              # Kustomize image entries may include newName between name and newTag.
              end = index + 1
              while end < len(lines) and not lines[end].lstrip().startswith("- name:"):
                  end += 1
              tag_index = next(
                  (i for i in range(index + 1, end) if lines[i].strip().startswith("newTag:")),
                  None,
              )
              if tag_index is None:
                  raise SystemExit(f"newTag missing in image entry for {expected}")

              indent = lines[tag_index][:len(lines[tag_index]) - len(lines[tag_index].lstrip())]
              lines[tag_index] = f"{indent}newTag: {tag}"
              path.write_text("\n".join(lines) + "\n")
              break
          else:
              raise SystemExit(f"image component not found: {expected}")
          PY

          if [ "$APP" = "media-generation" ]; then
            grep -A1 "name: ghcr.io/phanthienquoc/media-generation/${COMPONENT}" "$FILE"
          elif [ "$APP" = "auth-service" ]; then
            grep -A3 "name: ghcr.io/phanthienquoc/auth-service/auth" "$FILE"
          else
            grep -A1 "name: ghcr.io/phanthienquoc/${APP}/${COMPONENT}" "$FILE"
          fi

      - name: Scope promotion changes
        env:
          APP: ${{ steps.input.outputs.app }}
        run: |
          set -euo pipefail
          case "$APP" in
            stockdividend) TARGET_FILE="apps/stockdividend/overlays/prod/kustomization.yaml" ;;
            tce-dashboard) TARGET_FILE="apps/tce-dashboard/overlays/prod/kustomization.yaml" ;;
            media-generation) TARGET_FILE="apps/media-generation/overlays/prod/kustomization.yaml" ;;
            auth-service) TARGET_FILE="platform/auth-service/kustomization.yaml" ;;
            *) echo "::error::Unsupported promotion app"; exit 1 ;;
          esac
          test -n "$(git diff --name-only -- "$TARGET_FILE")" || { echo "::error::Expected promotion diff missing for $TARGET_FILE"; git diff --name-only; exit 1; }
          git diff --name-only | while IFS= read -r file; do
            [ "$file" = "$TARGET_FILE" ] || git restore --source=HEAD --worktree --staged -- "$file"
          done
          changed_count="$(git diff --name-only | wc -l | tr -d ' ')"
          test "$changed_count" -eq 1 || { echo "::error::Promotion must modify exactly one manifest file"; git diff --name-only; exit 1; }
          test "$(git diff --name-only)" = "$TARGET_FILE"

      - name: Create promotion PR
        id: promotion
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7
        with:
          branch: automation/promote-${{ steps.input.outputs.app }}-${{ steps.input.outputs.component }}-${{ steps.input.outputs.tag }}
          delete-branch: true
          title: "chore: promote ${{ steps.input.outputs.app }}/${{ steps.input.outputs.component }} ${{ steps.input.outputs.tag }}"
          commit-message: "chore: promote ${{ steps.input.outputs.app }}/${{ steps.input.outputs.component }} ${{ steps.input.outputs.tag }}"
          body: |
            Automated immutable image promotion from application CI.

            Source:
            - application: ${{ steps.input.outputs.app }}
            - component: ${{ steps.input.outputs.component }}
            - image tag: ${{ steps.input.outputs.tag }}

      - name: Validate promotion PR checks
        id: validate-pr-checks
        if: steps.promotion.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          echo "Validating promotion PR #$PR_NUMBER before merge."

          PR_HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve promotion PR head SHA."; exit 1; }

          echo "Waiting for required promotion PR checks to appear and pass."
          state="PENDING"
          seen_required_checks=0
          for attempt in $(seq 1 30); do
            required="$(gh pr checks "$PR_NUMBER" --repo "$REPO" --required --json state 2>/dev/null || printf '[]')"
            current_required_count="$(printf '%s' "$required" | jq 'length')"
            if [ "$current_required_count" -eq 0 ]; then
              if [ "$seen_required_checks" -eq 1 ]; then
                echo "::error::Required promotion checks disappeared or could not be queried; refusing to merge."
                exit 1
              fi
              echo "Required promotion checks are not visible yet (attempt $attempt/30)."
              sleep 10
              continue
            fi
            seen_required_checks=1
            state="$(printf '%s' "$required" | jq -r '
              if any(.[]; .state == "FAILURE" or .state == "ERROR") then "FAILURE"
              elif all(.[]; .state == "SUCCESS") then "SUCCESS"
              else "PENDING"
              end
            ')"
            echo "Promotion PR check state: $state (attempt $attempt/30)"
            case "$state" in
              SUCCESS) break ;;
              FAILURE)
                echo "::error::Required promotion PR checks failed."
                exit 1
                ;;
            esac
            sleep 10
          done

          if [ "$seen_required_checks" -eq 0 ]; then
            echo "::error::No required promotion PR checks appeared; refusing to merge."
            exit 1
          fi
          if [ "$state" != "SUCCESS" ]; then
            echo "::error::Required promotion PR checks did not complete within the validation window."
            exit 1
          fi

          CURRENT_HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
          if [ "$CURRENT_HEAD_SHA" != "$PR_HEAD_SHA" ]; then
            echo "::error::Promotion PR head changed while checks were running; refusing to merge an unverified commit."
            exit 1
          fi
          echo "head_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Merge promotion PR
        if: steps.promotion.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.validate-pr-checks.outputs.head_sha }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          test -n "$HEAD_SHA" || { echo "::error::Verified promotion PR head SHA is missing."; exit 1; }
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          echo "Promotion PR #$PR_NUMBER merged at the verified head $HEAD_SHA."
      - name: Determine release readiness
        if: steps.input.outputs.app == 'stockdividend' || steps.input.outputs.app == 'media-generation' || steps.input.outputs.app == 'auth-service'
        id: readiness
        env:
          APP: ${{ steps.input.outputs.app }}
          COMPONENT: ${{ steps.input.outputs.component }}
          RELEASE: ${{ steps.input.outputs.tag }}
        run: |
          set -euo pipefail

          if [ "$APP" = "stockdividend" ] || [ "$APP" = "auth-service" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILE="apps/media-generation/overlays/prod/kustomization.yaml"
          git fetch --no-tags origin master
          BACKEND_TAG="$(git show "origin/master:$FILE" | sed -n '/name: ghcr.io\/phanthienquoc\/media-generation\/backend$/,/newTag:/p' | awk '/newTag:/ {print $2; exit}')"
          FRONTEND_TAG="$(git show "origin/master:$FILE" | sed -n '/name: ghcr.io\/phanthienquoc\/media-generation\/frontend$/,/newTag:/p' | awk '/newTag:/ {print $2; exit}')"

          echo "Media backend GitOps tag: $BACKEND_TAG"
          echo "Media frontend GitOps tag: $FRONTEND_TAG"
          echo "Incoming $COMPONENT tag: $RELEASE"

          if [ "$BACKEND_TAG" = "$RELEASE" ] && [ "$FRONTEND_TAG" = "$RELEASE" ]; then
            echo "Media FE/BE pair converged on $RELEASE."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Media FE/BE pair is not converged yet; waiting for the other component promotion."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger VPS reconciliation
        if: (steps.input.outputs.app == 'stockdividend' || steps.input.outputs.app == 'media-generation' || steps.input.outputs.app == 'auth-service') && steps.readiness.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ steps.input.outputs.app }}
          COMPONENT: ${{ steps.input.outputs.component }}
          RELEASE: ${{ steps.input.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type="gitops-promoted-ready" \
            -f client_payload\[app\]="$APP" \
            -f client_payload\[component\]="$COMPONENT" \
            -f client_payload\[release\]="$RELEASE"
          echo "Triggered VPS reconciliation for $APP release $RELEASE."
# yamllint enable rule:line-length
