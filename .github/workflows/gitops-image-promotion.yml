# yamllint disable rule:line-length
name: GitOps Image Promotion
run-name: GitOps Image Promotion — ${{ inputs.app || github.event.client_payload.app || github.event.action || github.event_name }} / ${{ inputs.component || github.event.client_payload.component || github.event.client_payload.release || github.event.client_payload.commit || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: Application to promote
        required: true
        type: choice
        options:
          - auth-service
      component:
        description: Image component
        required: true
        type: choice
        options:
          - auth
      tag:
        description: Immutable image tag
        required: true
        type: string
      source_commit:
        description: Full 40-character source commit SHA bound to the image
        required: true
        type: string
      auth_digest:
        description: Immutable Auth image digest (sha256:<64 hex>)
        required: true
        type: string
  repository_dispatch:
    types:
      - tce-release-requested
      - auth-image-published
      - microfe-images-published

permissions:
  contents: read
concurrency:
  group: gitops-image-promotion-${{ github.event.client_payload.app || inputs.app }}-${{ github.event.client_payload.component || inputs.component || github.event.client_payload.release }}
  cancel-in-progress: false

jobs:
  reject-non-master-manual-run:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
    name: Reject manual promotion outside master
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail closed for non-master manual promotion
        run: |
          echo "::error::Manual GitOps image promotion must run from refs/heads/master. Select master as the workflow ref."
          exit 1

  promote-microfe-digests:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'microfe-images-published'
    name: Promote MicroFE image digests as one GitOps change
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - name: Install pinned kubectl for MicroFE manifest render
        env:
          KUBECTL_VERSION: v1.36.3
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) kubectl_arch=amd64 ;;
            aarch64|arm64) kubectl_arch=arm64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${kubectl_arch}/kubectl"
          curl -fsSLo kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${kubectl_arch}/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client=true

      - name: Validate and resolve MicroFE digests
        id: digests
        env:
          AUTH_DIGEST: ${{ github.event.client_payload.auth_digest }}
          SHELL_DIGEST: ${{ github.event.client_payload.shell_digest }}
          WS_DIGEST: ${{ github.event.client_payload.ws_digest }}
          SOURCE_COMMIT: ${{ github.event.client_payload.commit }}
          RELEASE_INPUT: ${{ github.event.client_payload.release }}
        run: |
          set -euo pipefail
          # Canonical Auth is released independently by phanthienquoc-authentication.
          # Keep legacy auth_digest optional for older dispatch producers; this lane
          # always requires Shell and WebSocket digests and never updates the Auth image.
          for digest in "$SHELL_DIGEST" "$WS_DIGEST"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::Every required MicroFE Shell/WS digest must be sha256:<64 hex>'; exit 1; }
          done
          if [[ -n "${AUTH_DIGEST:-}" ]]; then
            [[ "$AUTH_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::Legacy auth_digest, when supplied, must be sha256:<64 hex>'; exit 1; }
          fi
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Missing or invalid source commit SHA'; exit 1; }
          EXPECTED_RELEASE="microfe-${SOURCE_COMMIT:0:7}"
          [[ "$RELEASE_INPUT" == "$EXPECTED_RELEASE" ]] || {
            echo "::error::MicroFE release label must equal $EXPECTED_RELEASE derived from the full source commit SHA."
            exit 1
          }
          {
            echo "shell_digest=$SHELL_DIGEST"
            echo "ws_digest=$WS_DIGEST"
            echo "source_commit=$SOURCE_COMMIT"
            echo "release=$EXPECTED_RELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Verify TCE MicroFE publisher provenance
        env:
          SOURCE_APP: ${{ github.event.client_payload.app }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.client_payload.source_run_attempt }}
          SOURCE_WORKFLOW_PATH: ${{ github.event.client_payload.source_workflow_path }}
          SOURCE_EVENT: ${{ github.event.client_payload.source_event }}
          SOURCE_HEAD_SHA: ${{ github.event.client_payload.source_head_sha }}
          SOURCE_COMMIT: ${{ steps.digests.outputs.source_commit }}
        run: bash scripts/verify-tce-microfe-publisher-run.sh

      - name: Validate promoted MicroFE images in GHCR
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          SHELL_DIGEST: ${{ steps.digests.outputs.shell_digest }}
          WS_DIGEST: ${{ steps.digests.outputs.ws_digest }}
          SOURCE_COMMIT: ${{ steps.digests.outputs.source_commit }}
        run: |
          set -euo pipefail
          if [[ -z "$GHCR_USERNAME" || -z "$GHCR_TOKEN" ]]; then
            echo "::error::Configure GHCR_READ_TOKEN with read:packages access to the promoted private images."
            exit 1
          fi
          TARGET_APP=microfe GHCR_USERNAME="$GHCR_USERNAME" GHCR_TOKEN="$GHCR_TOKEN" bash scripts/validate-ghcr-pull-access.sh
          # The TCE producer publishes each image under the immutable full source SHA.
          # Correlate that tag to the dispatch digest before accepting the digest ref.
          for component in shell ws; do
            image="ghcr.io/phanthienquoc/microfe-$component"
            digest_var="${component^^}_DIGEST"
            expected="${!digest_var}"
            GHCR_USERNAME="$GHCR_USERNAME" GHCR_TOKEN="$GHCR_TOKEN" \
              GHCR_EXPECTED_DIGEST="$expected" \
              GHCR_IMAGE_REFERENCE="$image:$SOURCE_COMMIT" \
              bash scripts/validate-ghcr-image-reference.sh
            GHCR_USERNAME="$GHCR_USERNAME" GHCR_TOKEN="$GHCR_TOKEN" \
              GHCR_IMAGE_REFERENCE="$image@$expected" \
              bash scripts/validate-ghcr-image-reference.sh
          done

      - name: Update MicroFE Kustomize image digests
        env:
          SHELL_DIGEST: ${{ steps.digests.outputs.shell_digest }}
          WS_DIGEST: ${{ steps.digests.outputs.ws_digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path('platform/microfe/kustomization.yaml')
          text = path.read_text()
          images = {
              'ghcr.io/phanthienquoc/microfe-shell': os.environ['SHELL_DIGEST'],
              'ghcr.io/phanthienquoc/microfe-ws': os.environ['WS_DIGEST'],
          }
          lines = text.splitlines()
          if any(line.strip() == 'images:' for line in lines):
              raise SystemExit('Unexpected existing images block; refusing ambiguous update')
          text = text.rstrip() + '\n\nimages:\n'
          for name, digest in images.items():
              text += f'- name: {name}\n  newName: {name}\n  digest: {digest}\n'
          path.write_text(text)
          PY
          kubectl kustomize platform/microfe > /tmp/microfe-rendered.yaml
          grep -Eq 'image: ghcr.io/phanthienquoc/microfe-shell@sha256:[0-9a-f]{64}' /tmp/microfe-rendered.yaml
          grep -Eq 'image: ghcr.io/phanthienquoc/microfe-ws@sha256:[0-9a-f]{64}' /tmp/microfe-rendered.yaml

      - name: Scope MicroFE promotion changes
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'platform/microfe/kustomization.yaml' || {
            echo '::error::MicroFE promotion must change only platform/microfe/kustomization.yaml'
            git diff --name-only
            exit 1
          }

      - name: Create MicroFE promotion PR
        id: promotion
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/promote-microfe-${{ steps.digests.outputs.source_commit }}
          delete-branch: true
          title: 'chore: promote MicroFE digests ${{ steps.digests.outputs.release }}'
          commit-message: 'chore: promote MicroFE digests ${{ steps.digests.outputs.release }}'
          body: |
            Automated atomic MicroFE digest promotion from TCE-dashboard CI.

            - Shell digest: `${{ steps.digests.outputs.shell_digest }}`
            - WS digest: `${{ steps.digests.outputs.ws_digest }}`
            - Source commit: `${{ steps.digests.outputs.source_commit }}`

            Auth is managed independently by `phanthienquoc-authentication` using the canonical `auth-service/auth` image.

      - name: Validate exact promotion PR head
        id: validate-pr-checks
        if: steps.promotion.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.promotion.outputs.pull-request-head-sha }}
          PR_BRANCH: ${{ steps.promotion.outputs.pull-request-branch }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/validate-promotion-pr.sh
      - name: Merge MicroFE promotion PR
        if: steps.promotion.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.validate-pr-checks.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "$HEAD_SHA" || { echo '::error::Verified promotion PR head SHA is missing'; exit 1; }
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA"

      - name: Trigger shared VPS reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.digests.outputs.release }}
          SOURCE_COMMIT: ${{ steps.digests.outputs.source_commit }}
          PROMOTION_RUN_ID: ${{ github.run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ github.run_attempt }}
          PROMOTION_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='gitops-promoted-ready' \
            -f 'client_payload[app]=microfe' \
            -f 'client_payload[component]=release' \
            -f "client_payload[release]=$RELEASE" \
            -f "client_payload[source_commit]=$SOURCE_COMMIT" \
            -f "client_payload[promotion_run_id]=$PROMOTION_RUN_ID" \
            -f "client_payload[promotion_run_attempt]=$PROMOTION_RUN_ATTEMPT" \
            -f 'client_payload[promotion_workflow_path]=.github/workflows/gitops-image-promotion.yml' \
            -f "client_payload[promotion_head_sha]=$PROMOTION_HEAD_SHA"

  promote-tce-digests:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'tce-release-requested'
    name: Promote TCE web/service digests atomically
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - name: Install pinned kubectl for TCE manifest render
        env:
          KUBECTL_VERSION: v1.36.3
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) kubectl_arch=amd64 ;;
            aarch64|arm64) kubectl_arch=arm64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${kubectl_arch}/kubectl"
          curl -fsSLo kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${kubectl_arch}/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client=true

      - name: Validate exact TCE release dispatch payload schema
        if: github.event_name == 'repository_dispatch' && github.event.action == 'tce-release-requested'
        run: bash scripts/verify-tce-dispatch-payload.sh "$GITHUB_EVENT_PATH"

      - name: Verify TCE release payload and publisher provenance
        env:
          APP: ${{ github.event.client_payload.app }}
          RELEASE: ${{ github.event.client_payload.release }}
          WEB_DIGEST: ${{ github.event.client_payload.web_digest }}
          SERVICE_DIGEST: ${{ github.event.client_payload.service_digest }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.client_payload.source_run_attempt }}
          SOURCE_WORKFLOW_PATH: ${{ github.event.client_payload.source_workflow_path }}
          SOURCE_EVENT: ${{ github.event.client_payload.source_event }}
          SOURCE_HEAD_SHA: ${{ github.event.client_payload.source_head_sha }}
          SOURCE_COMMIT: ${{ github.event.client_payload.source_head_sha }}
        run: |
          set -euo pipefail
          test "$APP" = "tce-dashboard" || { echo "::error::Unsupported TCE release application: $APP"; exit 1; }
          [[ "$RELEASE" =~ ^prod-v[0-9]+[.][0-9]+[.][0-9]+-[0-9a-f]{40}$ ]] || {
            echo "::error::TCE release must use a full-SHA prod-v<semver>-<sha> tag."
            exit 1
          }
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Invalid TCE web digest."; exit 1; }
          [[ "$SERVICE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Invalid TCE service digest."; exit 1; }
          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$RELEASE" == *-"$SOURCE_HEAD_SHA" ]] || {
            echo "::error::TCE release tag does not match the full publisher source SHA."
            exit 1
          }
          bash scripts/verify-tce-publisher-run.sh

      - name: Validate TCE GHCR pull access
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: TARGET_APP=tce-dashboard GHCR_USERNAME="$GHCR_USERNAME" GHCR_TOKEN="$GHCR_TOKEN" bash scripts/validate-ghcr-pull-access.sh

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          password: ${{ secrets.GHCR_READ_TOKEN }}

      - name: Set up Buildx for registry tag/digest correlation
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Verify TCE tag-to-digest mapping and exact ARM64 manifests
        env:
          RELEASE: ${{ github.event.client_payload.release }}
          WEB_DIGEST: ${{ github.event.client_payload.web_digest }}
          SERVICE_DIGEST: ${{ github.event.client_payload.service_digest }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          for component in web service; do
            image="ghcr.io/phanthienquoc/tce-dashboard/$component"
            expected_var="${component^^}_DIGEST"
            expected="${!expected_var}"
            inspect="$(docker buildx imagetools inspect "$image:$RELEASE")"
            tag_digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$inspect")"
            [[ "$tag_digest" == "$expected" ]] || {
              echo "::error::TCE $component release tag resolves to $tag_digest, not the attested $expected."
              exit 1
            }
            grep -Eq 'Platform: linux/arm64|linux/arm64' <<< "$inspect" || {
              echo "::error::TCE $component release tag has no linux/arm64 descriptor."
              exit 1
            }
            GHCR_USERNAME="$GHCR_USERNAME" GHCR_TOKEN="$GHCR_TOKEN" GHCR_IMAGE_REFERENCE="$image@$expected" bash scripts/validate-ghcr-image-reference.sh
          done

      - name: Update TCE production image digests as one pair
        env:
          WEB_DIGEST: ${{ github.event.client_payload.web_digest }}
          SERVICE_DIGEST: ${{ github.event.client_payload.service_digest }}
        run: |
          set -euo pipefail
          python3 scripts/promote-tce-image-digests.py --file apps/tce-dashboard/overlays/prod/kustomization.yaml --web-digest "$WEB_DIGEST" --service-digest "$SERVICE_DIGEST"
          kubectl kustomize apps/tce-dashboard/overlays/prod > /tmp/tce-rendered.yaml
          grep -Fq "image: ghcr.io/phanthienquoc/tce-dashboard/web@$WEB_DIGEST" /tmp/tce-rendered.yaml
          grep -Fq "image: ghcr.io/phanthienquoc/tce-dashboard/service@$SERVICE_DIGEST" /tmp/tce-rendered.yaml

      - name: Scope TCE promotion changes
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'apps/tce-dashboard/overlays/prod/kustomization.yaml' || {
            echo '::error::TCE paired promotion must change only its production Kustomize overlay.'
            git diff --name-only
            exit 1
          }

      - name: Create TCE paired digest promotion PR
        id: promotion
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/promote-tce-dashboard-${{ github.event.client_payload.source_head_sha }}
          delete-branch: true
          title: 'chore: promote TCE digest pair ${{ github.event.client_payload.release }}'
          commit-message: 'chore: promote TCE digest pair ${{ github.event.client_payload.release }}'
          body: |
            Automated atomic TCE web/service digest promotion.

            - Release: ${{ github.event.client_payload.release }}
            - Web digest: ${{ github.event.client_payload.web_digest }}
            - Service digest: ${{ github.event.client_payload.service_digest }}
            - Publisher run: ${{ github.event.client_payload.source_run_id }}
            - Source commit: ${{ github.event.client_payload.source_head_sha }}

      - name: Validate exact TCE promotion PR head
        id: validate-pr-checks
        if: steps.promotion.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.promotion.outputs.pull-request-head-sha }}
          PR_BRANCH: ${{ steps.promotion.outputs.pull-request-branch }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/validate-promotion-pr.sh

      - name: Merge TCE paired digest promotion PR
        if: steps.promotion.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.validate-pr-checks.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "$HEAD_SHA" || { echo '::error::Verified TCE promotion PR head SHA is missing.'; exit 1; }
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA"

  coordinate-tce-release:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'tce-release-requested'
    name: Coordinate TCE release
    needs: promote-tce-digests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true

      - name: Wait for paired GitOps release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event.client_payload.release }}
          WEB_DIGEST: ${{ github.event.client_payload.web_digest }}
          SERVICE_DIGEST: ${{ github.event.client_payload.service_digest }}
          SOURCE_COMMIT: ${{ github.event.client_payload.source_head_sha }}
          PROMOTION_RUN_ID: ${{ github.run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ github.run_attempt }}
          PROMOTION_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FILE="apps/tce-dashboard/overlays/prod/kustomization.yaml"
          MAX_ATTEMPTS=60
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            git fetch --no-tags origin master
            read_digest() {
              git show "origin/master:$FILE" | awk -v target="$1" '
                $0 == "- name: " target { in_image=1; next }
                in_image && /^- name:/ { exit }
                in_image && /^[[:space:]]+digest:/ { print $2; exit }
              '
            }
            WEB_DIGEST_ON_MASTER="$(read_digest ghcr.io/phanthienquoc/tce-dashboard/web)"
            SERVICE_DIGEST_ON_MASTER="$(read_digest ghcr.io/phanthienquoc/tce-dashboard/service)"
            echo "Coordinator attempt $attempt/$MAX_ATTEMPTS"
            echo "TCE GitOps web digest: $WEB_DIGEST_ON_MASTER"
            echo "TCE GitOps service digest: $SERVICE_DIGEST_ON_MASTER"
            if [ "$WEB_DIGEST_ON_MASTER" = "$WEB_DIGEST" ] && [ "$SERVICE_DIGEST_ON_MASTER" = "$SERVICE_DIGEST" ]; then
              echo "TCE release $RELEASE converged on GitOps master."
              gh api --method POST -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/dispatches" \
                -f event_type="gitops-promoted-ready" \
                -f "client_payload[app]=tce-dashboard" \
                -f "client_payload[component]=release" \
                -f "client_payload[release]=$RELEASE" \
                -f "client_payload[source_commit]=$SOURCE_COMMIT" \
                -f "client_payload[promotion_run_id]=$PROMOTION_RUN_ID" \
                -f "client_payload[promotion_run_attempt]=$PROMOTION_RUN_ATTEMPT" \
                -f 'client_payload[promotion_workflow_path]=.github/workflows/gitops-image-promotion.yml' \
                -f "client_payload[promotion_head_sha]=$PROMOTION_HEAD_SHA"
              echo "Triggered VPS reconciliation for TCE release $RELEASE."
              exit 0
            fi
            sleep 2
          done
          echo "::error::TCE release $RELEASE did not converge on GitOps master within the readiness window."
          exit 1


  promote:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'repository_dispatch' && github.event.action == 'auth-image-published')
    name: Promote ${{ github.event.client_payload.app || inputs.app || github.event.action || github.event_name }} / ${{ github.event.client_payload.component || inputs.component || github.event.client_payload.tag || github.event.client_payload.commit || github.event_name }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Step "Determine release readiness" fetches origin/master after
          # promotion. Keep checkout credentials available so that fetch is
          # authenticated; actions/checkout removes them during post-job cleanup.
          persist-credentials: true

      - name: Validate exact Auth dispatch payload schema
        if: github.event_name == 'repository_dispatch' && github.event.action == 'auth-image-published'
        run: bash scripts/verify-auth-dispatch-payload.sh "$GITHUB_EVENT_PATH"

      - name: Resolve event inputs
        id: input
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_APP: ${{ github.event.client_payload.app }}
          EVENT_COMPONENT: ${{ github.event.client_payload.component }}
          EVENT_TAG: ${{ github.event.client_payload.tag }}
          EVENT_COMMIT: ${{ github.event.client_payload.commit }}
          EVENT_AUTH_DIGEST: ${{ github.event.client_payload.auth_digest }}
          EVENT_RELEASE: ${{ github.event.client_payload.release }}
          EVENT_SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          EVENT_SOURCE_RUN_ATTEMPT: ${{ github.event.client_payload.source_run_attempt }}
          EVENT_SOURCE_WORKFLOW_PATH: ${{ github.event.client_payload.source_workflow_path }}
          EVENT_SOURCE_EVENT: ${{ github.event.client_payload.source_event }}
          EVENT_SOURCE_HEAD_SHA: ${{ github.event.client_payload.source_head_sha }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_COMPONENT: ${{ inputs.component }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          INPUT_AUTH_DIGEST: ${{ inputs.auth_digest }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" && "$EVENT_ACTION" != "auth-image-published" ]]; then
            echo "::error::Unsupported Auth promotion dispatch; only auth-image-published with publisher provenance is accepted."
            exit 1
          fi

          AUTH_DIGEST="${EVENT_AUTH_DIGEST:-$INPUT_AUTH_DIGEST}"
          SOURCE_COMMIT="${EVENT_COMMIT:-$INPUT_SOURCE_COMMIT}"
          SOURCE_RUN_ID=""
          SOURCE_RUN_ATTEMPT=""
          SOURCE_WORKFLOW_PATH=""
          SOURCE_EVENT=""
          SOURCE_HEAD_SHA=""
          if [[ "$EVENT_ACTION" == "auth-image-published" ]]; then
            APP="$EVENT_APP"
            COMPONENT="$EVENT_COMPONENT"
            TAG="$EVENT_TAG"
            SOURCE_COMMIT="$EVENT_COMMIT"
            AUTH_DIGEST="$EVENT_AUTH_DIGEST"
            SOURCE_RUN_ID="$EVENT_SOURCE_RUN_ID"
            SOURCE_RUN_ATTEMPT="$EVENT_SOURCE_RUN_ATTEMPT"
            SOURCE_WORKFLOW_PATH="$EVENT_SOURCE_WORKFLOW_PATH"
            SOURCE_EVENT="$EVENT_SOURCE_EVENT"
            SOURCE_HEAD_SHA="$EVENT_SOURCE_HEAD_SHA"
            [[ "$APP" == "auth-service" && "$COMPONENT" == "auth" ]] || { echo "::error::Auth digest event target must be auth-service/auth"; exit 1; }
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Auth source commit must be a full 40-character SHA"; exit 1; }
            [[ "$TAG" =~ ^prod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{40}$ && "$TAG" == *-"$SOURCE_COMMIT" ]] || { echo "::error::Auth release tag must contain the full source SHA"; exit 1; }
            [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Auth source run ID must be a positive integer"; exit 1; }
            [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Auth source run attempt must be a positive integer"; exit 1; }
            [[ "$SOURCE_WORKFLOW_PATH" == ".github/workflows/release.yml" ]] || { echo "::error::Auth source workflow path is not approved"; exit 1; }
            [[ "$SOURCE_EVENT" == "workflow_dispatch" ]] || { echo "::error::Auth production publisher must originate from workflow_dispatch"; exit 1; }
            [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_HEAD_SHA" == "$SOURCE_COMMIT" ]] || { echo "::error::Auth source SHA must match the immutable image commit"; exit 1; }
            [[ "$AUTH_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Invalid Auth image digest"; exit 1; }
          else
            APP="${EVENT_APP:-$INPUT_APP}"
            COMPONENT="${EVENT_COMPONENT:-$INPUT_COMPONENT}"
            TAG="${EVENT_TAG:-$INPUT_TAG}"
          fi

          case "$APP/$COMPONENT" in
            auth-service/auth) ;;
            *)
              echo "::error::Unsupported image target: $APP/$COMPONENT"
              exit 1
              ;;
          esac

          case "$APP" in
            auth-service)
              if [[ "$EVENT_ACTION" == "auth-image-published" ]]; then
                [[ "$TAG" =~ ^prod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{40}$ && "$TAG" == *-"$SOURCE_COMMIT" ]] || {
                  echo "::error::Auth digest release must use a full source-SHA tag"
                  exit 1
                }
              else
                [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$TAG" =~ ^prod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{40}$ && "$TAG" == *-"$SOURCE_COMMIT" ]] || {
                  echo "::error::Manual Auth tag must end with the supplied full source commit SHA."
                  exit 1
                }
                [[ "$AUTH_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
                  echo "::error::Manual Auth promotion requires an immutable sha256 digest."
                  exit 1
                }
              fi
              ;;
            *)
              echo "::error::Unsupported application: $APP"
              exit 1
              ;;
          esac

          {
            echo "app=$APP"
            echo "component=$COMPONENT"
            echo "tag=$TAG"
            echo "auth_digest=$AUTH_DIGEST"
            echo "source_commit=$SOURCE_COMMIT"
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "source_run_attempt=$SOURCE_RUN_ATTEMPT"
            echo "source_workflow_path=$SOURCE_WORKFLOW_PATH"
            echo "source_event=$SOURCE_EVENT"
            echo "source_head_sha=$SOURCE_HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Auth publisher run provenance
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'auth-image-published' }}
        env:
          SOURCE_RUN_ID: ${{ steps.input.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.input.outputs.source_run_attempt }}
          SOURCE_WORKFLOW_PATH: ${{ steps.input.outputs.source_workflow_path }}
          SOURCE_EVENT: ${{ steps.input.outputs.source_event }}
          SOURCE_HEAD_SHA: ${{ steps.input.outputs.source_head_sha }}
          SOURCE_COMMIT: ${{ steps.input.outputs.source_commit }}
        run: bash scripts/verify-auth-publisher-run.sh

      - name: Validate promoted image in GHCR
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          APP: ${{ steps.input.outputs.app }}
          COMPONENT: ${{ steps.input.outputs.component }}
          TAG: ${{ steps.input.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.input.outputs.source_commit }}
          AUTH_DIGEST: ${{ steps.input.outputs.auth_digest }}
        run: |
          set -euo pipefail
          if [[ -z "$GHCR_USERNAME" || -z "$GHCR_TOKEN" ]]; then
            echo "::error::Configure GHCR_READ_TOKEN with read:packages access to the promoted private image."
            exit 1
          fi
          TARGET_APP="$APP" GHCR_USERNAME="$GHCR_USERNAME" GHCR_TOKEN="$GHCR_TOKEN" bash scripts/validate-ghcr-pull-access.sh
          if [[ "$APP" == "auth-service" && "$COMPONENT" == "auth" && -n "$AUTH_DIGEST" ]]; then
            IMAGE="ghcr.io/phanthienquoc/auth-service/auth"
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::Auth source commit must be a full 40-character SHA before registry verification."
              exit 1
            }
            [[ "$TAG" =~ ^prod-v[0-9]+[.][0-9]+[.][0-9]+-[0-9a-f]{40}$ && "${TAG##*-}" == "$SOURCE_COMMIT" ]] || {
              echo "::error::Auth release tag must end with the exact source commit SHA."
              exit 1
            }
            for immutable_tag in "$SOURCE_COMMIT" "$TAG"; do
              GHCR_USERNAME="$GHCR_USERNAME" GHCR_TOKEN="$GHCR_TOKEN" GHCR_EXPECTED_DIGEST="$AUTH_DIGEST" GHCR_IMAGE_REFERENCE="$IMAGE:$immutable_tag" bash scripts/validate-ghcr-image-reference.sh
            done
            GHCR_USERNAME="$GHCR_USERNAME" GHCR_TOKEN="$GHCR_TOKEN" GHCR_IMAGE_REFERENCE="$IMAGE@$AUTH_DIGEST" bash scripts/validate-ghcr-image-reference.sh
          else
            echo "::error::Only the Auth image promotion contract is supported by this workflow."
            exit 1
          fi

      - name: Update Auth Kustomize image digest
        env:
          AUTH_DIGEST: ${{ steps.input.outputs.auth_digest }}
        run: |
          set -euo pipefail
          test -n "$AUTH_DIGEST" || { echo "::error::Auth promotion requires an immutable digest."; exit 1; }
          python3 scripts/promote-auth-image-digest.py --file platform/auth-service/kustomization.yaml --digest "$AUTH_DIGEST"
          grep -A3 "name: ghcr.io/phanthienquoc/auth-service/auth" platform/auth-service/kustomization.yaml

      - name: Scope promotion changes
        env:
          APP: ${{ steps.input.outputs.app }}
        run: |
          set -euo pipefail
          [[ "$APP" == "auth-service" ]] || { echo "::error::Unsupported promotion app"; exit 1; }
          TARGET_FILE="platform/auth-service/kustomization.yaml"
          test -n "$(git diff --name-only -- "$TARGET_FILE")" || { echo "::error::Expected promotion diff missing for $TARGET_FILE"; git diff --name-only; exit 1; }
          git diff --name-only | while IFS= read -r file; do
            [ "$file" = "$TARGET_FILE" ] || git restore --source=HEAD --worktree --staged -- "$file"
          done
          changed_count="$(git diff --name-only | wc -l | tr -d ' ')"
          test "$changed_count" -eq 1 || { echo "::error::Promotion must modify exactly one manifest file"; git diff --name-only; exit 1; }
          test "$(git diff --name-only)" = "$TARGET_FILE"

      - name: Create promotion PR
        id: promotion
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/promote-${{ steps.input.outputs.app }}-${{ steps.input.outputs.component }}-${{ steps.input.outputs.tag }}
          delete-branch: true
          title: "chore: promote ${{ steps.input.outputs.app }}/${{ steps.input.outputs.component }} ${{ steps.input.outputs.tag }}"
          commit-message: "chore: promote ${{ steps.input.outputs.app }}/${{ steps.input.outputs.component }} ${{ steps.input.outputs.tag }}"
          body: |
            Automated immutable image promotion from application CI.

            Source:
            - application: ${{ steps.input.outputs.app }}
            - component: ${{ steps.input.outputs.component }}
            - release tag: ${{ steps.input.outputs.tag }}
            - source commit: ${{ steps.input.outputs.source_commit }}
            - Auth digest: ${{ steps.input.outputs.auth_digest }}

      - name: Validate exact promotion PR head
        id: validate-pr-checks
        if: steps.promotion.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.promotion.outputs.pull-request-head-sha }}
          PR_BRANCH: ${{ steps.promotion.outputs.pull-request-branch }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/validate-promotion-pr.sh
      - name: Merge promotion PR
        if: steps.promotion.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.validate-pr-checks.outputs.head_sha }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          test -n "$HEAD_SHA" || { echo "::error::Verified promotion PR head SHA is missing."; exit 1; }
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          echo "Promotion PR #$PR_NUMBER merged at the verified head $HEAD_SHA."
      - name: Determine release readiness
        if: steps.input.outputs.app == 'auth-service'
        id: readiness
        env:
          AUTH_DIGEST: ${{ steps.input.outputs.auth_digest }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          remote_manifest="$(git show origin/master:platform/auth-service/kustomization.yaml)"
          remote_digest="$(awk '/name: ghcr.io\/phanthienquoc\/auth-service\/auth/{found=1;next} found && /digest:/{print $2;exit}' <<< "$remote_manifest")"
          test "$remote_digest" = "$AUTH_DIGEST" || {
            echo "::error::Auth digest on master does not match the exact verified promotion digest."
            exit 1
          }
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Trigger VPS reconciliation
        if: steps.input.outputs.app == 'auth-service' && steps.readiness.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ steps.input.outputs.app }}
          COMPONENT: ${{ steps.input.outputs.component }}
          RELEASE: ${{ steps.input.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.input.outputs.source_commit }}
          PROMOTION_RUN_ID: ${{ github.run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ github.run_attempt }}
          PROMOTION_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type="gitops-promoted-ready" \
            -f client_payload\[app\]="$APP" \
            -f client_payload\[component\]="$COMPONENT" \
            -f client_payload\[release\]="$RELEASE" \
            -f client_payload\[source_commit\]="$SOURCE_COMMIT" \
            -f client_payload\[promotion_run_id\]="$PROMOTION_RUN_ID" \
            -f client_payload\[promotion_run_attempt\]="$PROMOTION_RUN_ATTEMPT" \
            -f client_payload\[promotion_workflow_path\]=".github/workflows/gitops-image-promotion.yml" \
            -f client_payload\[promotion_head_sha\]="$PROMOTION_HEAD_SHA"
          echo "Triggered VPS reconciliation for $APP release $RELEASE."
# yamllint enable rule:line-length
