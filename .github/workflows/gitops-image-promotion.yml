name: GitOps image promotion

on:
  workflow_dispatch:
    inputs:
      app:
        required: true
        type: choice
        options: [stockdividend, tce-dashboard]
      component:
        required: true
        type: string
      tag:
        required: true
        type: string
  repository_dispatch:
    types: [image-published]

permissions:
  contents: write
  pull-requests: write
  packages: read

concurrency:
  group: gitops-image-promotion-${{ github.event.client_payload.app || inputs.app }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve event inputs
        id: input
        env:
          EVENT_APP: ${{ github.event.client_payload.app }}
          EVENT_COMPONENT: ${{ github.event.client_payload.component }}
          EVENT_TAG: ${{ github.event.client_payload.tag }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_COMPONENT: ${{ inputs.component }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          APP="${EVENT_APP:-$INPUT_APP}"
          COMPONENT="${EVENT_COMPONENT:-$INPUT_COMPONENT}"
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          case "$APP/$COMPONENT" in
            stockdividend/backend|stockdividend/admin|tce-dashboard/web|tce-dashboard/service) ;;
            *) echo "Unsupported image target"; exit 1;;
          esac
          case "$APP" in
            tce-dashboard)
              [[ "$TAG" =~ ^prod-v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7,64}$ ]] || { echo "TCE tag must be prod-v<semver>-<git-sha>"; exit 1; }
              ;;
            stockdividend)
              [[ "$TAG" =~ ^[0-9a-f]{7,64}$ ]] || { echo "StockDividend tag must be an immutable Git SHA"; exit 1; }
              ;;
          esac
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate promoted image exists in GHCR
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          APP: ${{ steps.input.outputs.app }}
          COMPONENT: ${{ steps.input.outputs.component }}
          TAG: ${{ steps.input.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/phanthienquoc/${APP}/${COMPONENT}:${TAG}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          docker manifest inspect "$IMAGE" >/dev/null
          echo "Validated GHCR image manifest: $IMAGE"
          docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Update Kustomize tag
        env:
          APP: ${{ steps.input.outputs.app }}
          COMPONENT: ${{ steps.input.outputs.component }}
          TAG: ${{ steps.input.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$APP" = stockdividend ]; then FILE=apps/stockdividend/overlays/prod/kustomization.yaml; else FILE=apps/tce-dashboard/overlays/prod/kustomization.yaml; fi
          python3 - "$FILE" "$COMPONENT" "$TAG" <<'PY'
import pathlib, sys
p=pathlib.Path(sys.argv[1]); component=sys.argv[2]; tag=sys.argv[3]
lines=p.read_text().splitlines()
for i,line in enumerate(lines):
    if line.strip()==f"name: ghcr.io/phanthienquoc/stockdividend/{component}" or line.strip()==f"name: ghcr.io/phanthienquoc/tce-dashboard/{component}":
        if i+1 < len(lines) and lines[i+1].strip().startswith("newTag:"):
            lines[i+1]=f"  newTag: {tag}"
            p.write_text("\n".join(lines)+"\n")
            break
else:
    raise SystemExit(f"image component not found: {component}")
PY
          grep -A1 "name:.*$COMPONENT" "$FILE"

      - name: Create promotion PR
        id: promotion
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/promote-${{ steps.input.outputs.app }}-${{ steps.input.outputs.component }}-${{ steps.input.outputs.tag }}
          delete-branch: true
          title: "chore: promote ${{ steps.input.outputs.app }}/${{ steps.input.outputs.component }} ${{ steps.input.outputs.tag }}"
          commit-message: "chore: promote ${{ steps.input.outputs.app }}/${{ steps.input.outputs.component }} ${{ steps.input.outputs.tag }}"
          body: "Automated immutable image promotion from application CI."

      - name: Merge promotion PR
        if: steps.promotion.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "${GITHUB_REPOSITORY}" --squash --delete-branch
