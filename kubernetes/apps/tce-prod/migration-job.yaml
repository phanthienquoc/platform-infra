apiVersion: batch/v1
kind: Job
metadata:
  name: migration-job
  namespace: tce-prod
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: ghcr.io/<OWNER>/tce-dashboard:<TAG>
          command: ["/bin/sh", "-c", "echo TODO: run migration command"]
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: external-services }
