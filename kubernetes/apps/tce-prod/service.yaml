apiVersion: apps/v1
kind: Deployment
metadata:
  name: service
  namespace: tce-prod
spec:
  replicas: 2
  selector: { matchLabels: { app: service } }
  template:
    metadata: { labels: { app: service } }
    spec:
      containers:
        - name: service
          image: ghcr.io/<OWNER>/tce-dashboard:<TAG>
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: external-services }
          resources: {}
---
apiVersion: v1
kind: Service
metadata:
  name: service
  namespace: tce-prod
spec:
  selector: { app: service }
  ports: [{ name: http, port: 80, targetPort: http }]
