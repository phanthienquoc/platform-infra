apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stock-prod
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: ghcr.io/<OWNER>/stockdividend:<TAG>
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: external-services }
          resources: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: stock-prod
spec:
  selector: { app: backend }
  ports: [{ name: http, port: 80, targetPort: http }]
