apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: stock-prod
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/<OWNER>/stockdividend:<TAG>
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: platform-config }
          resources: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: stock-prod
spec:
  selector: { app: frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
