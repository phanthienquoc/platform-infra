apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: tce, namespace: tce-prod, annotations: {cert-manager.io/cluster-issuer: letsencrypt-prod}}
spec:
  ingressClassName: traefik
  tls:
  - hosts: [tce.mrcute.space]
    secretName: tce-mrcute-tls
  rules:
  - host: tce.mrcute.space
    http:
      paths:
      - {path: /api, pathType: Prefix, backend: {service: {name: tce-service, port: {number: 8210}}}}
      - {path: /, pathType: Prefix, backend: {service: {name: tce-frontend, port: {number: 80}}}}
