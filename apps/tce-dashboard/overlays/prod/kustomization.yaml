apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tce-prod
resources:
- ../../base
- ingress.yaml
images:
# Release identity follows TCE WF-03: prod-v<package-version>-<7-char-git-sha>.
# Keep the image tag immutable and update both components together per release.
- name: ghcr.io/phanthienquoc/tce-dashboard/web
  newTag: prod-v0.1.0-61f90c4
- name: ghcr.io/phanthienquoc/tce-dashboard/service
  newTag: prod-v0.1.0-93c8836
