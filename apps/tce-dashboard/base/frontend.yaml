apiVersion: apps/v1
kind: Deployment
metadata: {name: tce-frontend, namespace: tce-prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: tce-frontend}}
  template:
    metadata: {labels: {app: tce-frontend}}
    spec:
      containers:
      - name: frontend
        image: ghcr.io/phanthienquoc/tce-dashboard/web:2f0cc20
        ports: [{name: http, containerPort: 80}]
        env: [{name: TCE_API_INTERNAL_URL, value: http://tce-service:8210}]
        readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
        resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 300m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: tce-frontend, namespace: tce-prod}
spec:
  selector: {app: tce-frontend}
  ports: [{name: http, port: 80, targetPort: http}]
