apiVersion: apps/v1
kind: Deployment
metadata: {name: tce-service, namespace: tce-prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: tce-service}}
  template:
    metadata: {labels: {app: tce-service}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: service
        image: ghcr.io/phanthienquoc/tce-dashboard/service:2f0cc20
        ports: [{name: http, containerPort: 8210}]
        env:
        - {name: NODE_ENV, value: production}
        - {name: PORT, value: "8210"}
        - {name: PASSKEY_RP_NAME, value: TCE Treasury Cash Extraction}
        - {name: PASSKEY_RP_ID, value: mrcute.space}
        - {name: PASSKEY_ORIGIN, value: https://tce.mrcute.space}
        - {name: STOCK_EVENTS_READ_SOURCE, value: supabase}
        - {name: MONGO_DB_NAME, value: vietstock}
        - {name: MONGO_EVENTS_COLLECTION, value: events}
        - {name: JWT_REFRESH_TTL_SECONDS, value: "2592000"}
        envFrom: [{secretRef: {name: tce-app-secrets}}, {secretRef: {name: tce-auth}}]
        readinessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 10, timeoutSeconds: 3, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 30, timeoutSeconds: 3, periodSeconds: 20}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {cpu: 1000m, memory: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: tce-service, namespace: tce-prod}
spec:
  selector: {app: tce-service}
  ports: [{name: http, port: 8210, targetPort: http}]
