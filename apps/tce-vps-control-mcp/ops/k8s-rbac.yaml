apiVersion: v1
kind: Namespace
metadata:
  name: tce-ops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tce-vps-control-mcp
  namespace: tce-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tce-vps-control-mcp
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "pods/log", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tce-vps-control-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tce-vps-control-mcp
subjects:
  - kind: ServiceAccount
    name: tce-vps-control-mcp
    namespace: tce-ops
