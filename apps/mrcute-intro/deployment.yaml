apiVersion: apps/v1
kind: Deployment
metadata:
  name: mrcute-intro
  namespace: microfe-platform
  labels:
    app.kubernetes.io/name: mrcute-intro
    app.kubernetes.io/part-of: mrcute
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mrcute-intro
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mrcute-intro
        app.kubernetes.io/part-of: mrcute
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: html
        configMap:
          name: mrcute-intro-html
      - name: nginx-config
        configMap:
          name: mrcute-intro-nginx
      - name: tmp
        emptyDir: {}
