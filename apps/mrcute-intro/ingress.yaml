apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mrcute-root
  namespace: microfe-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - mrcute.space
    secretName: mrcute-root-tls
  rules:
  - host: mrcute.space
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mrcute-intro
            port:
              number: 80
