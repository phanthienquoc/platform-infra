apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-generation-frontend
  namespace: media-prod
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: media-generation-frontend}
  template:
    metadata:
      labels: {app: media-generation-frontend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: media-generation-frontend
        image: ghcr.io/phanthienquoc/media-generation-frontend:bea4c25ea7c551452cd059a4397f4066388b41fa
        ports:
        - name: http
          containerPort: 80
        startupProbe:
          httpGet: {path: /, port: http}
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet: {path: /, port: http}
          initialDelaySeconds: 5
          timeoutSeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /, port: http}
          initialDelaySeconds: 15
          timeoutSeconds: 3
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
