apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-generation-api
  namespace: media-prod
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: media-generation-api}
  template:
    metadata:
      labels: {app: media-generation-api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: api
        image: ghcr.io/phanthienquoc/fe-algorithm-video/api:REPLACE_WITH_GIT_SHA
        ports:
        - name: http
          containerPort: 3000
        envFrom:
        - secretRef:
            name: media-generation-runtime
        readinessProbe:
          httpGet: {path: /ready, port: http}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 15
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
