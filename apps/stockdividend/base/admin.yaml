apiVersion: apps/v1
kind: Deployment
metadata: {name: stock-admin, namespace: stock-prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: stock-admin}}
  template:
    metadata: {labels: {app: stock-admin}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: admin
        image: ghcr.io/phanthienquoc/stockdividend/admin:12d63b4
        ports: [{name: http, containerPort: 3000}]
        env: [{name: BACKEND_URL, value: http://stock-backend:8080}]
        readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 300m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: stock-admin, namespace: stock-prod}
spec:
  selector: {app: stock-admin}
  ports: [{name: http, port: 3000, targetPort: http}]
