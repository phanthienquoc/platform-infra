apiVersion: v1
kind: LimitRange
metadata:
  name: stock-defaults
  namespace: stock-prod
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: 2
        memory: 4Gi
