apiVersion: batch/v1
kind: Job
metadata: {name: stock-migration, namespace: stock-prod, annotations: {platform-infra/migration: explicit-run}}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      restartPolicy: Never
      containers:
      - name: migration
        image: ghcr.io/phanthienquoc/stockdividend/backend:12d63b4
        command: [./migrate_src]
        envFrom: [{secretRef: {name: stock-secrets}}]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
