apiVersion: v1
kind: ConfigMap
metadata:
  name: microfe-auth-config
  namespace: microfe-platform
data:
  NODE_ENV: production
  PORT: "4010"
  CORS_ORIGINS: "https://tce.mrcute.space,https://media.mrcute.space"
  JWT_ISSUER: "https://auth.mrcute.space"
  JWT_AUDIENCE: "tce-dashboard,media-generation"
  JWT_ACCESS_TTL_SECONDS: "900"
  JWT_REFRESH_TTL_SECONDS: "2592000"
  PASSKEY_RP_ID: "mrcute.space"
  PASSKEY_RP_NAME: "MRCute"
  PASSKEY_ORIGIN: "https://auth.mrcute.space"
  # Keycloak token validation for the additive OIDC session-exchange endpoint.
  # The exception is scoped to the administrator-owned TCE MVP Keycloak subject only.
  KEYCLOAK_URL: "https://sso.mrcute.space"
  KEYCLOAK_REALM: "mrcute"
  KEYCLOAK_ISSUER: "https://sso.mrcute.space/realms/mrcute"
  KEYCLOAK_AUDIENCE: "nest-api"
  KEYCLOAK_TCE_CLIENT_ID: "tce-dashboard"
  KEYCLOAK_TCE_UNVERIFIED_EMAIL_SUBJECTS: "fb15a5ab-48e7-43bd-bc62-2d92ca4da5a6"
