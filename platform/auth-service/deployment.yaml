apiVersion: apps/v1
kind: Deployment
metadata:
  name: microfe-auth
  namespace: microfe-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microfe-auth
  template:
    metadata:
      labels:
        app: microfe-auth
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: auth
          image: ghcr.io/phanthienquoc/microfe-auth:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: AUTH_COOKIE_NAME
              value: "__Secure-microfe_session"
            - name: AUTH_CSRF_COOKIE_NAME
              value: "__Secure-microfe_csrf"
            - name: AUTH_COOKIE_DOMAIN
              value: ".mrcute.space"
            - name: AUTH_SESSION_TTL_SECONDS
              value: "2592000"
            - name: DB_POOL_MAX
              value: "5"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: microfe-auth-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: microfe-auth-secrets
                  key: JWT_SECRET
            - name: MFA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: microfe-auth-secrets
                  key: MFA_ENCRYPTION_KEY
            - name: PASSKEY_RP_ID
              value: "mrcute.space"
            - name: PASSKEY_RP_NAME
              value: "MRCute"
            - name: PASSKEY_ORIGIN
              value: "https://app.mrcute.space"
          startupProbe:
            httpGet:
              path: /health/live
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: microfe-auth
  namespace: microfe-platform
spec:
  selector:
    app: microfe-auth
  ports:
    - port: 80
      targetPort: 3000
