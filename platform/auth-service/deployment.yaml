apiVersion: apps/v1
kind: Deployment
metadata:
  name: microfe-auth
  namespace: microfe-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microfe-auth
  template:
    metadata:
      labels:
        app: microfe-auth
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: auth
          image: ghcr.io/phanthienquoc/auth-service/auth:8138295b27f8754d96255d292e3ec630270abfe9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4010
          envFrom:
            - configMapRef:
                name: microfe-auth-config
          env:
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: microfe-auth-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: microfe-auth-secrets
                  key: SUPABASE_SERVICE_ROLE_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: microfe-auth-secrets
                  key: JWT_SECRET
            - name: MFA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: microfe-auth-secrets
                  key: MFA_ENCRYPTION_KEY
          startupProbe:
            httpGet:
              path: /api/health
              port: 4010
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 4010
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4010
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: microfe-auth
  namespace: microfe-platform
spec:
  selector:
    app: microfe-auth
  ports:
    - port: 80
      targetPort: 4010
