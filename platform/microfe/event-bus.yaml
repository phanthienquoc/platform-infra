apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: microfe-platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: nats}
  template:
    metadata: {labels: {app: nats}}
    spec:
      containers:
        - name: nats
          image: nats:2.12-alpine
          args: ["--jetstream", "--http_port", "8222"]
          ports:
            - {name: client, containerPort: 4222}
            - {name: monitor, containerPort: 8222}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          readinessProbe: {httpGet: {path: /, port: monitor}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /, port: monitor}, initialDelaySeconds: 10, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: microfe-platform
spec:
  type: ClusterIP
  selector: {app: nats}
  ports:
    - {name: client, port: 4222, targetPort: client}
    - {name: monitor, port: 8222, targetPort: monitor}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats
  namespace: microfe-platform
spec:
  podSelector: {matchLabels: {app: nats}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {app.kubernetes.io/part-of: microfe-platform}
      ports:
        - {protocol: TCP, port: 4222}
