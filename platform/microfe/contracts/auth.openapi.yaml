openapi: 3.1.0
info:
  title: MicroFE Authentication Boundary
  version: 1.0.0
servers:
  - url: https://auth.mrcute.space
paths:
  /auth/login:
    post:
      summary: Create an authenticated browser session
      responses:
        '204':
          description: Session established with Secure HttpOnly cookie
        '401':
          description: Invalid credentials
  /auth/me:
    get:
      summary: Resolve the current authenticated user/session
      responses:
        '200':
          description: Authenticated user
        '401':
          description: Not authenticated
  /auth/refresh:
    post:
      summary: Rotate the server-side session credentials
      responses:
        '204':
          description: Session refreshed
        '401':
          description: Session invalid
  /auth/logout:
    post:
      summary: Revoke the current session
      responses:
        '204':
          description: Session revoked
  /auth/logout-all:
    post:
      summary: Revoke all sessions for the current user
      responses:
        '204':
          description: Sessions revoked
