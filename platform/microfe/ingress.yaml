apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microfe-public
  namespace: microfe-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - app.mrcute.space
        - auth.mrcute.space
        - ws.mrcute.space
      secretName: microfe-public-tls
  rules:
    - host: app.mrcute.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: microfe-shell, port: {number: 80}}}
    - host: auth.mrcute.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: microfe-auth, port: {number: 80}}}
    - host: ws.mrcute.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: microfe-ws, port: {number: 8080}}}
