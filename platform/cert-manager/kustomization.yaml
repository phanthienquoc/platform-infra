apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# cert-manager.yaml is generated by the checksum-verifying preparation script
# before validation or GitOps reconciliation. Keep this local resource first so
# its controller and CRDs are included in the same approved environments/prod apply.
resources:
- cert-manager.yaml
- cluster-issuer.yaml
- certificates.yaml
