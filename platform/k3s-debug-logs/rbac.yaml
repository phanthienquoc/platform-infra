apiVersion: v1
kind: ServiceAccount
metadata:
  name: k3s-debug-collector
  namespace: k3s-debug
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k3s-debug-collector
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, endpoints, events, namespaces, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: ["cert-manager.io"]
    resources: [certificates, issuers, clusterissuers]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k3s-debug-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k3s-debug-collector
subjects:
  - kind: ServiceAccount
    name: k3s-debug-collector
    namespace: k3s-debug
