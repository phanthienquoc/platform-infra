# This file documents Secret keys only; it deliberately contains no Kubernetes Secret.
# Reconcile-vps workflow must create keycloak-runtime-secrets from the production
# Environment secrets via stdin using a dedicated, allowlisted platform-kubectl action.
# Required keys:
# KEYCLOAK_DB_URL
# KEYCLOAK_DB_USERNAME (must equal keycloak_runtime)
# KEYCLOAK_DB_PASSWORD
# KEYCLOAK_ADMIN_USERNAME
# KEYCLOAK_ADMIN_PASSWORD
