apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-registration-rate-limit
  namespace: microfe-platform
spec:
  rateLimit:
    average: 5
    period: 1m
    burst: 10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-registration-rate-limit
  namespace: microfe-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: microfe-platform-keycloak-registration-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sso.mrcute.space
      secretName: keycloak-sso-tls
  rules:
    - host: sso.mrcute.space
      http:
        paths:
          - path: /realms/mrcute/login-actions/registration
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 80
